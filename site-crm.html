<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site · Omega Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cs-navy:#16202B;--cs-blue:#2B5FA8;--cs-text:#14171A;--cs-sub:#5B6672;
  --cs-bg:#F5F4F0;--cs-border:#DCD9D2;--cs-red:#D9482B;
  --sap-blue:#2B5FA8;--sap-blue-hi:#3F76C4;--sap-page:#F5F4F0;--sap-card-border:#E4E8EC;
  --sap-ink:#16202B;--sap-ink-2:#5B6672;
}
body{font-family:'DM Sans',sans-serif;background:var(--sap-page);color:var(--cs-text);min-height:100vh}
#main{max-width:1240px}
/* the chrome (rail, switcher, side panel, phone tab bar) is omega-workspace-shell.js; this page builds none of it */
.crumb{font-size:12.5px;color:var(--cs-sub);margin-bottom:10px}
.crumb a{color:var(--sap-blue);text-decoration:none}
.site-head{background:#fff;border:1px solid var(--sap-card-border);border-radius:14px;padding:24px;margin-bottom:0}
.site-head h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.site-head .loc{font-size:13.5px;color:var(--cs-sub);margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px}
.fact .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--cs-sub)}
.fact .v{font-size:16px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.fact .n{font-size:11.5px;color:var(--cs-sub);margin-top:2px;line-height:1.4}
.t-mut{color:#9AA3AD;font-style:italic;font-weight:400}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill-ok{background:rgba(0,169,164,.13);color:#00736F}
.pill-no{background:rgba(217,72,43,.10);color:#B03A1E}
.pill-unk{background:#EEF1F4;color:var(--cs-sub)}
.pill-warn{background:rgba(217,119,6,.12);color:#B45309}
.tabs{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--sap-card-border)}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 16px;font:600 13.5px 'DM Sans',sans-serif;color:var(--cs-sub);cursor:pointer}
.tab.active{color:var(--sap-blue);border-bottom-color:var(--sap-blue-hi)}
.tabpane{display:none;padding:22px 0}
.tabpane.active{display:block}
.card{background:#fff;border:1px solid var(--sap-card-border);border-radius:12px;padding:18px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input[type=text],input[type=number],input[type=date],select,textarea{border:1.5px solid var(--cs-border);border-radius:8px;padding:8px 11px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--cs-text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cs-sky)}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{background:var(--sap-blue);border:none;color:#fff;border-radius:7px;padding:8px 16px;cursor:pointer;font:600 12.5px 'DM Sans',sans-serif}
.btn:hover{background:var(--sap-blue-hi)}
.btn-ghost{background:#fff;border:1px solid var(--sap-card-border);color:var(--sap-ink);border-radius:7px;padding:8px 14px;cursor:pointer;font:500 12.5px 'DM Sans',sans-serif}
.btn-danger{background:none;border:1px solid #F3C4B5;color:var(--cs-red);border-radius:7px;padding:6px 12px;cursor:pointer;font:500 12px 'DM Sans',sans-serif}
.list-item{border-bottom:1px solid rgba(0,0,0,.05);padding:12px 0}
.list-item:last-child{border-bottom:none}
.li-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.li-title{font-size:13.5px;font-weight:600}
.li-meta{font-size:11.5px;color:var(--cs-sub)}
.li-body{font-size:13px;color:var(--cs-text);margin-top:6px;white-space:pre-wrap;line-height:1.5}
.err{background:#FDF0EC;border:1px solid #F3C4B5;color:#B03A1E;border-radius:9px;padding:12px 16px;font-size:13px;margin:14px 0}
.okmsg{background:#EDF7F6;border:1px solid #BFE3E0;color:#00736F;border-radius:9px;padding:12px 16px;font-size:13px;margin:14px 0}
.loading{display:flex;align-items:center;justify-content:center;padding:50px;gap:10px;color:var(--cs-sub)}
.spin{width:18px;height:18px;border:2px solid var(--cs-border);border-top-color:var(--cs-sky);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
table.cf{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.cf th,table.cf td{text-align:right;padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.05)}
table.cf th:first-child,table.cf td:first-child{text-align:left}
table.cf th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--cs-sub)}
.assume{font-size:12px;color:var(--cs-sub);line-height:1.6;background:#FAFBFC;border:1px solid var(--sap-card-border);border-radius:9px;padding:12px 14px;margin-top:12px}
.assume b{color:var(--cs-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
select.inline,input.inline{padding:6px 9px;font-size:12.5px}
/* the deck tab: the IRR tool's own headline tiles, the three structures, the deck */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.kpi{background:#FAFBFC;border:1px solid var(--sap-card-border);border-radius:10px;padding:14px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}.kpi .l{font-size:11.5px;color:var(--cs-sub);margin-top:4px;line-height:1.4}
.kpi.good .v{color:#2E7D5B}.kpi.warn .v{color:#B45309}
.cap-state{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.cap-state .pill{font-size:12px;padding:4px 11px}
.pill-funded{background:#2E7D5B;color:#fff}
.deck-box{overflow:hidden;border-radius:10px;background:#E8ECF1;border:1px solid var(--sap-card-border);padding:16px 16px 0;margin-top:12px;--pf-scale:.5}
.deck-box .empty{padding:0 0 16px;color:var(--cs-sub);font-size:13px}
.deals{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}.deals th,.deals td{text-align:right;padding:7px 8px;border-bottom:1px solid rgba(0,0,0,.05);font-variant-numeric:tabular-nums}.deals th:first-child,.deals td:first-child{text-align:left}.deals th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--cs-sub)}.deals tr.on td{font-weight:700}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--sap-card-border);background:#fff;color:var(--sap-blue);text-decoration:none}
@media print{#side-nav,#topbar,.ows-tabs,.tabs,.crumb,.site-head,#pane-deck .card:not(#deck-card){display:none!important}}
label.fl{display:block;font-size:11.5px;font-weight:600;color:var(--cs-sub);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
@media(max-width:900px){
#main{padding:24px 14px 48px}
.tabs{overflow-x:auto}
.tab{white-space:nowrap;padding:10px 12px}
.site-head{padding:18px}
.site-head h1{font-size:20px}
}
@media(max-width:600px){
#main{padding:20px 12px 44px}
input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
.facts{grid-template-columns:1fr 1fr;gap:10px}
}
.ef-kinds{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:4px 0 2px}
.ef-kind{font-size:13px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div id="main">
  <div class="crumb"><a href="/portfolio.html">Portfolio</a> · <span id="crumb-site">…</span></div>
  <div id="msg"></div>
  <div class="site-head" id="site-head"><div class="loading"><div class="spin"></div>Loading the site…</div></div>
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-t="overview">Overview</button>
    <button class="tab" data-t="contacts">Contacts</button>
    <button class="tab" data-t="activity">Activity</button>
    <button class="tab" data-t="files">Files</button>
    <button class="tab" data-t="proforma">Pro forma</button>
    <button class="tab" data-t="power">Power &amp; bills</button>
    <button class="tab" data-t="deck">Investor deck &amp; capital</button>
  </div>
  <div class="tabpane active" id="pane-overview"></div>
  <div class="tabpane" id="pane-contacts"></div>
  <div class="tabpane" id="pane-activity"></div>
  <div class="tabpane" id="pane-files"></div>
  <div class="tabpane" id="pane-proforma"></div>
  <div class="tabpane" id="pane-power"></div>
  <div class="tabpane" id="pane-deck"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/omega-auth-errors.js?v=1"></script>
<script src="/omega-jd-nav.js?v=1"></script>
<script src="/omega-brand.js"></script>
<script src="/omega-tenant.js"></script>
<script src="/omega-whitelabel.js"></script>
<script src="/omega-workspace-shell.js"></script>
<script src="/omega-newproject.js"></script>
<!-- the investor deck is the BESS Pro Forma's own (proforma-logic.js); every figure on it is the finance engine's -->
<script src="/proforma-logic.js"></script>
<script>
(function () {
  'use strict';
  /* omega-tenant.js starts Firebase the moment it loads; a second start throws */
  try { firebase.initializeApp((window.CLEARSKY_CONFIG || {}).firebase); } catch (e) { if (!/already exists/.test(String(e && e.message))) throw e; }
  var auth = firebase.auth();
  var S = window.OmegaWorkspaceShell, WS = null, USER = null, LOADED = false, ENT_TIMER = null;
  S.mount({ current: 'portfolio', tabs: true, search: false });
  document.getElementById('main').classList.add('ows-content');
  function paint() {
    S.paint({ ws: WS || window.OMEGA_WORKSPACE || {}, user: USER || {} });
    if (!S.wantsWorkspace()) Array.prototype.forEach.call(document.querySelectorAll('#side-nav a[data-key="home"], .ows-tabs a[data-tab="home"]'), function (a) { a.setAttribute('href', '/'); });
  }
  var ORG = '', SITE = '', DATA = null, CANEDIT = false, CANARCHIVE = false, TAB = 'overview';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function msg(html, ok) { document.getElementById('msg').innerHTML = html ? '<div class="' + (ok ? 'okmsg' : 'err') + '">' + html + '</div>' : ''; }
  function unk(v) { return v == null || v === ''; }
  function notProvided() { return '<span class="t-mut">Not provided</span>'; }
  function needsVer() { return '<span class="t-mut">Needs verification</span>'; }
  function org() {
    var w = WS || window.OMEGA_WORKSPACE || {};
    if (w.orgId) return w.orgId;
    var u = auth.currentUser;
    return u && u.email ? (u.email.split('@')[1] || '').toLowerCase() : '';
  }
  function api(path, opts) {
    return auth.currentUser.getIdToken().then(function (t) {
      var h = { 'Authorization': 'Bearer ' + t };
      if (opts && opts.json) h['Content-Type'] = 'application/json';
      return fetch(path, { method: (opts && opts.method) || 'GET', headers: h, body: opts && opts.json ? JSON.stringify(opts.json) : undefined });
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && (j.message || j.error)) || ('HTTP ' + r.status));
        return j;
      });
    });
  }
  function post(action, extra) {
    var body = Object.assign({ org: ORG, site: SITE, action: action }, extra || {});
    return api('/api/site-crm', { method: 'POST', json: body });
  }
  function money(n, short) {
    if (n == null || !isFinite(n)) return '–';
    var a = Math.abs(n);
    if (short === false) return (n < 0 ? '−$' : '$') + Math.round(a).toLocaleString('en-US');
    var s = a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(1) + 'k' : a.toFixed(0);
    return (n < 0 ? '−$' : '$') + s;
  }
  function pct(n, d) {
    if (!isFinite(n)) return '–';
    return (n * 100).toFixed(d == null ? 2 : d) + '%';
  }

  /* ── header ── */
  function renderHead() {
    var s = DATA.site;
    document.getElementById('crumb-site').textContent = s.name || 'Site';
    document.title = (s.name || 'Site') + ' · ClearSky-OMEGA';
    var meter = s.meterOwned === true ? '<span class="pill pill-ok">Meter owned</span>'
      : s.meterOwned === false ? '<span class="pill pill-no">No meter</span>'
      : '<span class="pill pill-unk">Meter: needs verification</span>';
    var term = unk(s.termYearsRemaining) ? needsVer() : esc(s.termYearsRemaining) + ' years <span class="n">remaining (snapshot)</span>';
    var pods = s.screening && !unk(s.screening.pods) ? esc(s.screening.pods) + ' pods' : notProvided();
    var availKw = s.availablePowerMw != null ? Number(s.availablePowerMw) * 1000
      : (s.serviceCapacityKw != null && s.existingPeakKw != null ? Math.max(0, Number(s.serviceCapacityKw) - Number(s.existingPeakKw)) : null);
    var availBasis = s.availablePowerMw != null ? 'as entered'
      : (availKw != null ? 'service \u2212 peak, derived' : null);
    document.getElementById('site-head').innerHTML =
      '<h1>' + esc(s.name || 'Unnamed site') + '</h1>' +
      '<div class="loc">' + esc([s.city, s.state].filter(Boolean).join(', ') || 'Location not provided') + '</div>' +
      '<div class="facts">' +
      '<div class="fact"><div class="k">Project type</div><div class="v">' + (kindLabels(s).length ? esc(kindLabels(s).join(' + ')) : notProvided()) + '</div><div class="n">what Site Map opens on</div></div>' +
      '<div class="fact"><div class="k">Site Map</div><div class="v">' + (s.latestDesign ? esc(designShort(s.latestDesign)) : (s.projectId ? '<span class="pill pill-unk">Nothing drawn yet</span>' : notProvided())) + '</div><div class="n">' + (s.latestDesign && s.latestDesign.capex != null ? 'cost run ' + esc(String(s.latestDesign.capexAt || s.latestDesign.at || '').slice(0, 10)) : 'the design the IRR follows') + '</div></div>' +
      '<div class="fact"><div class="k">Installed chargers</div><div class="v">' + (unk(s.installedKw) ? notProvided() : esc(s.installedKw) + ' kW') + '</div><div class="n">nameplate, not approved capacity</div></div>' +
      '<div class="fact"><div class="k">Reported peak</div><div class="v">' + (unk(s.reportedPeakKw) ? notProvided() : esc(s.reportedPeakKw) + ' kW ' + (s.peakUnresolved ? '<span class="pill pill-warn">unresolved</span>' : '')) + '</div><div class="n">workbook statistic; definition in dispute</div></div>' +
      '<div class="fact"><div class="k">Meter</div><div class="v">' + meter + '</div><div class="n">ownership at this site</div></div>' +
      '<div class="fact"><div class="k">Remaining term</div><div class="v">' + term + '</div></div>' +
      '<div class="fact"><div class="k">Available power</div><div class="v">' + (availKw == null ? notProvided() : esc(availKw) + ' kW') + '</div><div class="n">' + (availBasis ? esc(availBasis) : 'for new load') + '</div></div>' +
      '<div class="fact"><div class="k">Screened pods</div><div class="v">' + pods + '</div><div class="n">Screening proxy \u00b7 unverified</div></div>' +
      capitalFact(s) + '</div>';
    document.getElementById('tabs').style.display = 'flex';
  }

  function capitalFact(s) {
    var lm = s.latestModel, cap = s.capital;
    var v = cap && cap.funded ? '<span class="pill pill-funded">Funded</span>' : cap && cap.status && cap.status !== 'missing' ? '<span class="pill pill-ok">' + esc(cap.status === 'draft' ? 'Draft deal' : 'On the marketplace') + '</span>' : lm && lm.totalProjectCost > 0 ? esc(money(lm.totalProjectCost, true)) : notProvided();
    var n = cap && cap.funded ? 'accepted by ' + esc(cap.awardedToOrg || 'a capital partner') : cap && cap.offerCount ? cap.offerCount + ' offer(s) waiting' : lm ? 'total project cost \u00b7 after-tax IRR ' + esc(irrPct(lm.irr)) + (lm.auto ? ' \u00b7 from the design' : '') + (lm.host && lm.host.noRevenue ? ' \u00b7 <b style="color:#B45309">the host\u2019s system has no revenue on record: enter the PPA</b>' : '') : s.designModel && s.designModel.missing ? 'the model needs what the design card names' : s.latestDesign ? 'runs by itself from the design' : 'run the compute model';
    return '<div class="fact"><div class="k">Capital</div><div class="v">' + v + '</div><div class="n">' + n + '</div></div>';
  }
  /* ── overview ── */
  function renderOverview() {
    var s = DATA.site, sc = s.screening || {}, cm = s.commercial || {};
    var open = (DATA.followUps || []).length;
    document.getElementById('pane-overview').innerHTML =
      '<div class="grid2"><div class="card"><h3>Site facts</h3>' +
      fact('Address', s.address) + fact('External IDs', Object.keys(s.externalSiteIds || {}).map(function (k) { return k + ': ' + s.externalSiteIds[k]; }).join('; ')) +
      fact('Project type', kindLabels(s).join(' + ')) + fact('Status', s.status) + fact('Tags', (s.tags || []).join(', ')) +
      (s.notes ? '<div style="margin-top:10px"><div class="li-meta">Notes</div><div class="li-body">' + esc(s.notes) + '</div></div>' : '') +
      '</div><div class="card"><h3>Screening · ' + esc(sc.label || 'none') + '</h3>' +
      fact('Screened kW', sc.screenKw) + fact('Pods', sc.pods) + fact('Reserve kW', sc.reserveKw) +
      '<div class="assume">A legacy screening proxy (75 kW IT per pod, PUE 1.2). <b>Not verified capacity.</b> ' + esc(sc.note || '') + '</div>' +
      '</div></div>' +
      '<div class="grid2">' + designCardHtml(s) + '</div>' +
      '<div class="grid2"><div class="card"><h3>Commercial</h3>' +
      fact('Rent per kW of compute a month', cm.rentPerKwMonth, '$') + fact('Rent / month (a signed lease; wins over the rate)', cm.rentMonthly, '$') + fact('Rent escalator', cm.rentEscalatorPct != null ? cm.rentEscalatorPct + '% a year' : null) + fact('Revenue share of gross compute', cm.revenueShare != null ? pct(cm.revenueShare) : null) + fact('kWh share', cm.kwhShare != null ? pct(cm.kwhShare) : null) +
      '<div class="assume">The host lease: annual rent = kW of compute (75 a skid) \u00d7 $ per kW-month \u00d7 12, escalating; ClearSky quotes $150\u2013$450 per kW-month and the model opens at the $150 floor until a rate or a rent is entered here. A revenue share rides beside it.</div>' +
      fact('PPA rate, year one', s.ppaRatePerKwh != null ? '$' + s.ppaRatePerKwh + '/kWh' : null) + fact('PPA escalator', s.ppaEscalatorPct != null ? s.ppaEscalatorPct + '% a year' : null) + fact('PPA term', s.ppaTermYears != null ? s.ppaTermYears + ' years' : null) +
      fact('PPA price table', s.ppaPriceSchedule && s.ppaPriceSchedule.length ? s.ppaPriceSchedule.length + ' years, $' + s.ppaPriceSchedule[0] + ' to $' + s.ppaPriceSchedule[s.ppaPriceSchedule.length - 1] + '/kWh' : null) +
      fact('PPA expected year-one production', s.ppaYear1Kwh != null ? Math.round(s.ppaYear1Kwh).toLocaleString('en-US') + ' kWh' : null) +
      fact('ITC adders claimed', s.itcEnergyCommunity || s.itcDomesticContent ? [s.itcEnergyCommunity ? 'energy community' : '', s.itcDomesticContent ? 'domestic content' : ''].filter(Boolean).join(' + ') : (s.itcEnergyCommunity === false ? 'none' : null)) +
      '<div class="assume">The PPA the host\u2019s solar + storage is sold under: the compute model prices the host\u2019s system on it, so the IRR and the capital request are the whole project\u2019s. Enter the contract\u2019s own price table and its expected first-year production, and each year is priced as the contract reads (a bank can check it line by line); a rate and an escalator stand in without them. No PPA on record means the host\u2019s system earns the Site Map run\u2019s revenue, or nothing, and the model says so.</div>' +
      '</div><div class="card"><h3>Attention</h3>' +
      '<div class="li-body">' + (open ? '<span class="pill pill-warn">' + open + ' open follow-up' + (open > 1 ? 's' : '') + '</span>' : 'No open follow-ups.') + '</div>' +
      ((s.flags && s.flags.peakExceedsInstalled) ? '<div class="li-body" style="margin-top:8px"><span class="pill pill-warn">Reported peak exceeds installed kW</span> — surfaced, not clamped.</div>' : '') +
      ((s.flags && s.flags.meterUnknown) ? '<div class="li-body" style="margin-top:8px">Meter ownership ' + needsVer() + '.</div>' : '') +
      '</div></div>' +
      '<div class="grid2">' + usageCardHtml(s, fact) + (CANEDIT ? '<div class="card"><h3>Edit site facts</h3>' + editFormHtml(s) + '</div>' : '<div></div>') + '</div>';
    wireEditForm();
    wireDesign();
    function fact(k, v, pre) {
      return '<div style="margin-bottom:8px"><div class="li-meta">' + esc(k) + '</div><div style="font-size:13.5px">' + (unk(v) ? notProvided() : esc((pre || '') + v)) + '</div></div>';
    }
  }

  /* ── power & usage card ── */
  function usageCardHtml(s, fact) {
    var mu = s.monthlyUsageKwh, muHtml = '';
    if (Array.isArray(mu)) {
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    if (iv) iv.addEventListener('click', function () {
      var f = pwEl('iv-file').files[0]; if (!f) { msg('Choose the interval CSV first.'); return; }
      var rd = new FileReader(); rd.onload = function () { msg('Reading…', true); regPost('interval-upload', { csv: String(rd.result), intervalMin: Number(pwEl('iv-min').value) || 15, activeOnly: pwEl('iv-active').checked }).then(function (j) { msg('Interval coverage ' + esc((j.coverage.coverage * 100).toFixed(1)) + '% of a year' + (j.coverage.warnings.length ? ': ' + esc(j.coverage.warnings.join('; ')) : '') + '.', true); load(true); }).catch(function (e) { msg(esc(e.message)); }); };
      rd.readAsText(f);
    });
    var bs = pwEl('bl-save');
    if (bs) bs.addEventListener('click', function () {
      function n(id) { var v = pwEl(id).value.trim(); return v === '' ? undefined : Number(v); }
      var entered = { periodStart: pwEl('bl-start').value || undefined, periodEnd: pwEl('bl-end').value || undefined, meterId: pwEl('bl-meter').value.trim() || undefined, kwh: n('bl-kwh'), billedKw: n('bl-kw'), totalUsd: n('bl-total') };
      if (pwEl('bl-est').checked) entered.estimatedRead = true;
      msg('Saving…', true);
      regPost('bill-save', { manual: true, entered: entered }).then(function (j) { msg('Bill entered: ' + esc(j.bill.state) + (j.bill.problems.length ? ' · ' + esc(j.bill.problems.join(', ')) : ' · ready for review'), true); loadBills(); }).catch(function (e) { msg(esc(e.message)); });
    });
    var ag = pwEl('ag-save');
    if (ag) ag.addEventListener('click', function () {
      msg('Recording…', true);
      regPost('agreement-upsert', { agreement: { type: 'site_host_agreement', label: 'Site host agreement (reviewed)', signed: pwEl('ag-signed').checked, computePermitted: pwEl('ag-compute').checked, reviewStatus: 'reviewed', endDate: pwEl('ag-end').value || null } }).then(function (j) { msg('Agreement recorded: ' + esc(j.record.termDisplay) + '.', true); loadAgreement(); }).catch(function (e) { msg(esc(e.message)); });
    });
    loadBills(); loadAgreement();
  }
  function loadAgreement() {
    api('/api/site-crm?org=' + encodeURIComponent(ORG) + '&site=' + encodeURIComponent(SITE) + '&register=1').then(function (j) {
      var ok = (j.agreements || []).filter(function (a) { return a.reviewStatus === 'reviewed' && a.computePermitted === true; })[0], el = pwEl('ag-state');
      if (el) el.innerHTML = ok ? '<span class="pill pill-ok">Reviewed · compute permitted</span> ' + esc(ok.termDisplay || '') : (j.agreements || []).length ? '<span class="pill pill-warn">' + esc(j.agreements[0].termDisplay || 'Needs agreement review') + '</span>' : 'No agreement on record.';
    }).catch(function () {});
  }
  function loadBills() {
    api('/api/site-crm?org=' + encodeURIComponent(ORG) + '&bills=all').then(function (j) {
      BILLS = (j.bills || []).filter(function (b) { return b.siteId === SITE; }).sort(function (a, b) { return (a.entered.periodStart || '') < (b.entered.periodStart || '') ? 1 : -1; });
      var el = pwEl('bill-list'); if (!el) return;
      el.innerHTML = BILLS.length ? BILLS.map(function (b) {
        var e = b.entered || {}, pill = b.state === 'accepted' ? 'pill-ok' : b.state === 'rejected' ? 'pill-no' : 'pill-warn';
        return '<div class="list-item"><div class="li-head"><span class="pill ' + pill + '">' + esc(b.state) + '</span><span class="li-title">' + esc((e.periodStart || '?') + ' → ' + (e.periodEnd || '?')) + '</span><span class="li-meta">' + esc(e.meterId || 'no meter') + ' · ' + (e.kwh != null ? esc(e.kwh.toLocaleString('en-US')) + ' kWh' : 'kWh?') + (e.totalUsd != null ? ' · $' + esc(e.totalUsd) : '') + '</span></div>' +
          (b.problems && b.problems.length ? '<div class="li-meta">' + esc(b.problems.join(', ')) + '</div>' : '') +
          (CANARCHIVE && b.state !== 'accepted' && b.state !== 'rejected' ? '<div class="row" style="margin-top:6px;margin-bottom:0"><button class="btn-ghost" data-bill-accept="' + esc(b.id) + '">Accept</button><button class="btn-danger" data-bill-reject="' + esc(b.id) + '">Reject</button></div>' : '') + '</div>';
      }).join('') : '<div class="li-meta">No bills entered yet.</div>';
      Array.prototype.forEach.call(el.querySelectorAll('[data-bill-accept]'), function (bt) { bt.addEventListener('click', function () { regPost('bill-review', { billId: bt.getAttribute('data-bill-accept'), accept: true }).then(function (j) { msg(j.ok ? 'Bill ' + esc(j.state) + '.' : esc(j.message + ': ' + (j.problems || []).join(', ')), !!j.ok); loadBills(); }).catch(function (e) { msg(esc(e.message)); }); }); });
      Array.prototype.forEach.call(el.querySelectorAll('[data-bill-reject]'), function (bt) { bt.addEventListener('click', function () { var why = window.prompt('Reason:'); if (why == null) return; regPost('bill-review', { billId: bt.getAttribute('data-bill-reject'), reject: true, reason: why }).then(function () { msg('Bill rejected.', true); loadBills(); }).catch(function (e) { msg(esc(e.message)); }); }); });
    }).catch(function (e) { var el = pwEl('bill-list'); if (el) el.innerHTML = '<div class="li-meta">' + esc(e.message) + '</div>'; });
  }

  /* ── the finance package: the gates the server checks at prepare and again inside the submission, and the one private submission ── */
  function packageCard(s) {
    return '<div class="card" id="package-card"><h3>Finance package <span class="li-meta">the diligence gate: map, reviewed bills, site control, power evidence, a current compute case</span></h3>' +
      '<div id="pkg-body"><div class="li-meta">Loading…</div></div>' +
      (CANEDIT ? '<div class="row" style="margin-top:10px"><button class="btn-ghost" id="pkg-map">Sync Site Map</button><button class="btn" id="pkg-prepare">Prepare the package</button>' + (CANARCHIVE ? '<button class="btn-ghost" id="pkg-submit" disabled>Submit (private)</button>' : '') + '</div>' : '') +
      '<div class="assume">Submission is private: one snapshot per package, never published or mailed by itself. The capital request above is the marketplace listing; this is what a partner diligences.</div></div>';
  }
  var PKG = null;
  function loadPackage() {
    api('/api/site-crm?org=' + encodeURIComponent(ORG) + '&packages=1').then(function (j) {
      PKG = (j.packages || []).filter(function (p) { return p.siteId === SITE; }).sort(function (a, b) { return (a.preparedAt || '') < (b.preparedAt || '') ? 1 : -1; })[0] || null;
      drawPackage();
    }).catch(function (e) { var el = document.getElementById('pkg-body'); if (el) el.innerHTML = '<div class="li-meta">' + esc(e.message) + '</div>'; });
  }
  function drawPackage() {
    var el = document.getElementById('pkg-body'), sub = document.getElementById('pkg-submit'); if (!el) return;
    if (!PKG) { el.innerHTML = '<div class="li-meta">No package prepared yet. Prepare one to see which gates are open and which are closed.</div>'; if (sub) sub.disabled = true; return; }
    var g = PKG.gates || { ok: false, codes: [] };
    el.innerHTML = '<div class="cap-state"><span class="pill ' + (PKG.status === 'submitted' ? 'pill-funded' : g.ok ? 'pill-ok' : PKG.status === 'stale' ? 'pill-warn' : 'pill-unk') + '">' + esc(PKG.status === 'submitted' ? 'Submitted (private)' : PKG.status === 'stale' ? 'Stale: ' + (PKG.staleReason || 'inputs changed') : g.ok ? 'Ready to submit' : (g.codes.length + ' gate(s) closed')) + '</span><span class="li-meta">prepared ' + esc(String(PKG.preparedAt || '').slice(0, 10)) + (g.partialHistory ? ' · ' + esc(g.partialHistory) : '') + '</span></div>' +
      (g.codes.length ? '<ul style="margin:8px 0 0 18px;font-size:13px;line-height:1.6">' + g.codes.map(function (c) { return '<li><b>' + esc(c.code) + '</b>: ' + esc(c.fix) + '</li>'; }).join('') + '</ul>' : '');
    if (sub) sub.disabled = !(g.ok && PKG.status === 'draft');
  }
  function wirePackage() {
    var pm = document.getElementById('pkg-map'), pp = document.getElementById('pkg-prepare'), ps = document.getElementById('pkg-submit');
    if (pm) pm.addEventListener('click', function () { msg('Reading the Site Map…', true); regPost('map-sync', { markReviewed: CANARCHIVE }).then(function (j) { msg('Site Map: ' + esc(j.map.state) + (j.revision ? ' · revision ' + esc(j.revision) : '') + '.', true); loadPackage(); }).catch(function (e) { msg(esc(e.message)); }); });
    if (pp) pp.addEventListener('click', function () { msg('Checking the gates…', true); regPost('package-prepare', { scenarioId: 'sc_compute' }).then(function (j) { PKG = j.package; drawPackage(); msg(j.package.gates.ok ? 'Every gate is open: the package is ready to submit.' : (j.package.gates.codes.length + ' gate(s) are closed; each says what to do.'), j.package.gates.ok); }).catch(function (e) { msg(esc(e.message)); }); });
    if (ps) ps.addEventListener('click', function () { if (!PKG || !window.confirm('Submit this package? One private snapshot is recorded; nothing is published or mailed.')) return; regPost('package-submit', { packageId: PKG.id, confirm: true }).then(function (j) { msg(j.duplicate ? 'Already submitted.' : 'Submitted: one private snapshot (' + esc(j.submission.publication.state) + ').', true); loadPackage(); }).catch(function (e) { msg(esc(e.message)); }); });
    loadPackage();
  }
  function terraCard(s) {
    var t = s.partners && s.partners.terra;
    return '<div class="card" id="terra-card"><h3>Terra Energy <span class="li-meta">the solar partner: a solar package and detail for the site</span></h3>' +
      '<div class="cap-state">' + (t ? '<span class="pill pill-ok">Sent ' + esc(String(t.sentAt || '').slice(0, 10)) + '</span><span class="li-meta">to ' + esc((t.to || []).join(', ')) + ' by ' + esc(t.by || '') + (t.status === 'not-sent' ? ' · no mailbox was configured, so it is recorded only' : '') + '</span>' : '<span class="pill pill-unk">Not sent</span><span class="li-meta">Terra usually funds its own package; it is one of the partners, not the capital request.</span>') + '</div>' +
      (CANEDIT ? '<div class="row" style="margin-top:10px"><input type="text" id="terra-note" placeholder="A note for Terra (roof, land, what you want sized)" style="flex:1;min-width:220px"><button class="btn" id="terra-send">' + (t ? 'Send to Terra again' : 'Send to Terra Energy') + '</button></div>' : '') + '</div>';
  }
  function wireTerra() {
    var b = document.getElementById('terra-send'); if (!b) return;
    b.addEventListener('click', function () {
      if (!window.confirm('Send this site to Terra Energy for a solar package? They receive the site facts, the compute case on file and a link to the record, with you in copy.')) return;
      msg('Sending…', true);
      api('/api/site-crm', { method: 'POST', json: { org: ORG, action: 'send-to-partner', partner: 'terra', ids: [SITE], note: document.getElementById('terra-note').value } }).then(function (j) { msg(esc(j.note), true); load(true); }).catch(function (e) { msg(esc(e.message)); });
    });
  }

  /* ── boot ── */
  function showTab(t) {
    TAB = t;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('active', b.getAttribute('data-t') === t); });
    Array.prototype.forEach.call(document.querySelectorAll('.tabpane'), function (p) { p.classList.toggle('active', p.id === 'pane-' + t); });
    if (t === 'overview') renderOverview();
    if (t === 'contacts') renderContacts();
    if (t === 'activity') renderActivity();
    if (t === 'files') renderFiles();
    if (t === 'proforma') renderProforma();
    if (t === 'power') renderPower();
    if (t === 'deck') renderDeck();
  }
  function load(keepTab) {
    msg('');
    api('/api/site-crm?org=' + encodeURIComponent(ORG) + '&site=' + encodeURIComponent(SITE)).then(function (j) {
      DATA = j; CANEDIT = !!j.canEdit; CANARCHIVE = !!j.canArchive;
      try { if (window.OmegaSplash) OmegaSplash.done(); } catch (e) {}
      renderHead();
      if (j.autoModel && j.autoModel.latestModel) { var am = j.autoModel.latestModel; msg('The compute model ran by itself on the Site Map design: ' + (am.title || am.pods + ' unit(s)') + ', after-tax IRR ' + irrPct(am.irr) + ', total project cost ' + money(am.totalProjectCost) + '.', true); }
      showTab(keepTab ? TAB : (window.location.hash === '#deck' ? 'deck' : window.location.hash === '#power' ? 'power' : 'overview'));
    }).catch(function (e) {
      document.getElementById('site-head').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
      try { if (window.OmegaSplash) OmegaSplash.done(); } catch (x) {}
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.addEventListener('click', function () { showTab(b.getAttribute('data-t')); });
  });
  /* who is here: the sign-in, then the entitlements (the workspace) */
  function onAuth(u, tries) {
    if (!u) {
      var had = !!(window.OmegaTenant && OmegaTenant.hadSession && OmegaTenant.hadSession());
      if ((tries || 0) < (had ? 20 : 4) && !auth.currentUser) { setTimeout(function () { onAuth(auth.currentUser, (tries || 0) + 1); }, 300); return; }
      window.location.href = '/login.html'; return;
    }
    USER = u; paint();
    var m = /[?&]site=([^&]+)/.exec(window.location.search);
    SITE = m ? decodeURIComponent(m[1]) : '';
    if (!SITE) { document.getElementById('site-head').innerHTML = '<div class="err">No site selected. <a href="/portfolio.html">Back to the portfolio</a>.</div>'; try { if (window.OmegaSplash) OmegaSplash.done(); } catch (e) {} return; }
    function start(ws) {
      clearTimeout(ENT_TIMER);
      WS = ws || window.OMEGA_WORKSPACE || (window.OmegaTenant && OmegaTenant.workspace) || {};
      paint(); ORG = org();
      if (!LOADED && ORG) { LOADED = true; load(); }
    }
    if (window.OmegaTenant && OmegaTenant.onEntitlements) OmegaTenant.onEntitlements(start);
    ENT_TIMER = setTimeout(function () { if (!LOADED) start(null); }, 3500);
  }
  auth.onAuthStateChanged(function (u) { onAuth(u, 0); });
})();

</script>
</body>
</html>
