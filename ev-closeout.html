<!--
  LEVEL 2 PROJECT CLOSEOUT
  The sibling of ev-cost-workbook.html. The workbook gets a job APPROVED
  (estimate -> utility make-ready application); this page gets it PAID
  (installed job -> the utility's project-completion package).

  Programs covered: Eversource (MA, CT) and National Grid (MA, NY, RI)
  Level 2 make-ready. The checklists below are what those programs ask for
  at completion — final itemised invoices split make-ready vs EVSE, proof
  of payment, the electrical inspection certificate, photos, EVSE serials,
  network activation and the data-sharing commitment, W-9 and as-builts.
  Program manuals change every filing cycle: every list is data (PROGRAMS),
  and the page says so on screen. Confirm against the current manual.

  Nothing here is written to Firestore. A closeout is saved in this
  browser (localStorage for the record, IndexedDB for attached files) and
  can be exported as a JSON file or a ZIP package. The incentive figure is
  reconciliation arithmetic on numbers the user types from their own
  pre-approval letter — no eligibility or pricing rule lives in this file.

  ES5 only (see CLAUDE.md).
-->
<style>
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --ink:#0B1E35; --gold:#C9A84C;
  --line:#DFD9CF; --line2:#EBE6DE; --sub:#5B6B7E; --dim:#8A94A0;
  --green:#1E7A44; --red:#B4342B; --amber:#A66A00;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tb{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 18px;background:var(--surface);border-bottom:2px solid var(--gold);box-shadow:0 1px 3px rgba(11,30,53,.06)}
.tb-logo-txt{font-size:14px;font-weight:800;color:var(--ink)}
.tb-logo-txt span{color:var(--gold)}
.tb-sub{font-size:10px;color:var(--sub);letter-spacing:1.3px;text-transform:uppercase;padding-left:12px;border-left:1px solid var(--line)}
.tb-sp{flex:1}
.tb-who{font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:2px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;font-size:12px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .cnt{display:inline-block;margin-left:6px;font-size:10px;padding:1px 6px;border-radius:9px;background:#F1ECE2;color:var(--sub)}
.tabs .cnt.ok{background:#E3F2E8;color:var(--green)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
.card>h3{margin:0;padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;background:#FBF9F6;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px}
.card>h3:before{content:"";width:3px;height:12px;background:var(--gold);flex:none}
.card>h3 .hint{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim);font-size:10.5px}
.body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:10px;color:var(--sub);margin-bottom:4px}
label.f>span b{color:var(--red);font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;padding:7px 9px;background:var(--surface);border:1px solid #CFC8BC;border-radius:3px;color:var(--ink);font-family:inherit;font-size:12.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 2px rgba(11,30,53,.09)}
textarea{resize:vertical;min-height:60px}
button{font-family:inherit;cursor:pointer;border-radius:3px}
.btn{padding:7px 12px;font-size:11.5px;font-weight:600;background:var(--surface);border:1px solid #CFC8BC;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.g{border-color:var(--gold);color:#8A6F1E;background:#FDFAF2}
.btn.sm{padding:4px 8px;font-size:10.5px}
.btn.x{border:none;background:none;color:var(--dim);font-size:15px;padding:2px 6px}
.btn.x:hover{color:var(--red)}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:11.5px;color:var(--sub);line-height:1.55}
.warn{background:#FFF7E6;border:1px solid #F0D9A8;color:#6B4A00;padding:9px 12px;border-radius:3px;font-size:11.5px;margin-bottom:12px}
.okbox{background:#EAF5EE;border:1px solid #BFE0CB;color:#14532D;padding:9px 12px;border-radius:3px;font-size:11.5px;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--sub);padding:7px 6px;border-bottom:1px solid var(--line);background:#FBF9F6;white-space:nowrap}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t td input,table.t td select{padding:5px 6px;font-size:12px}
table.t td.num,table.t th.num{text-align:right}
table.t tr.tot td{font-weight:700;background:#FBF9F6;border-top:2px solid var(--line)}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.3px}
.pill.req{background:#FBE9E7;color:var(--red)}
.pill.opt{background:#EEF1F4;color:var(--sub)}
.pill.done{background:#E3F2E8;color:var(--green)}
.meter{height:10px;background:#EEE9E0;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.meter>div{height:100%;background:var(--green);transition:width .2s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
.kpi .l{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--sub)}
.kpi .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:10.5px;color:var(--dim)}
.chk{display:grid;grid-template-columns:1fr 150px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:start}
.chk:last-child{border-bottom:none}
.chk .lbl{font-weight:600;font-size:12.5px}
.chk .det{font-size:11px;color:var(--sub);margin-top:2px}
.chk .files{font-size:11px;color:var(--sub);margin-top:4px}
.chk .files span{display:inline-block;background:#F4F1EC;border:1px solid var(--line2);border-radius:3px;padding:1px 6px;margin:2px 4px 0 0}
@media(max-width:720px){ .chk{grid-template-columns:1fr} }
.hide{display:none}
/* gate */
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{max-width:440px;width:100%;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:4px;padding:30px 28px;text-align:center}
.gate-title{font-size:17px;font-weight:700;margin-bottom:8px}
.gate-msg{font-size:12.5px;color:var(--sub);line-height:1.6}
/* print = the closeout package cover document */
#printDoc{display:none}
@media print{
  body{background:#fff}
  #gate,#app{display:none !important}
  #printDoc{display:block !important;font-size:11px;color:#000}
  #printDoc h1{font-size:18px;margin:0 0 4px}
  #printDoc h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;border-bottom:1.5px solid #000;padding-bottom:3px;margin:18px 0 8px;page-break-after:avoid}
  #printDoc table{width:100%;border-collapse:collapse;margin-bottom:6px}
  #printDoc th,#printDoc td{border:1px solid #999;padding:3px 5px;text-align:left;font-size:10px}
  #printDoc td.num,#printDoc th.num{text-align:right}
  #printDoc .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px}
  #printDoc .sig div{border-top:1px solid #000;padding-top:4px;font-size:10px}
  #printDoc .pb{page-break-before:always}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div style="font-size:13px;font-weight:800;margin-bottom:20px">ClearSky <b style="color:var(--gold)">OMEGA</b></div>
    <div class="gate-title" id="gateTitle">Checking access…</div>
    <div class="gate-msg" id="gateMsg">One moment.</div>
    <div id="gateActions" class="row-btn" style="justify-content:center;margin-top:16px"></div>
    <div id="gatePw" style="display:none;margin-top:14px;text-align:left">
      <input type="email" id="gatePwEmail" placeholder="you@company.com" autocomplete="username" style="margin-bottom:8px">
      <input type="password" id="gatePwPass" placeholder="Password" autocomplete="current-password" style="margin-bottom:10px;width:100%;padding:7px 9px;border:1px solid #CFC8BC;border-radius:3px"
             onkeydown="if(event.key==='Enter')window.__gatePwSignIn()">
      <div id="gatePwErr" style="display:none;color:#b91c1c;font-size:12px;margin-bottom:8px"></div>
      <div class="row-btn" style="justify-content:center"><button class="btn p" onclick="window.__gatePwSignIn()">Sign in</button></div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="tb">
    <a href="/" style="text-decoration:none"><div class="tb-logo-txt" id="tbName">ClearSky <span>OMEGA</span></div></a>
    <div class="tb-sub">Level 2 Project Closeout</div>
    <div class="tb-sp"></div>
    <select id="savedSel" onchange="openSaved(this.value)" style="width:auto;min-width:200px"></select>
    <button class="btn" onclick="newCloseout()">New</button>
    <button class="btn" onclick="pullFromEditor()" title="Take the site, charger fleet and estimate from the editor">From editor</button>
    <button class="btn" onclick="document.getElementById('jsonIn').click()">Open file</button>
    <input type="file" id="jsonIn" accept=".json,application/json" class="hide" onchange="importJSON(this)">
    <button class="btn" onclick="exportJSON()">Save file</button>
    <button class="btn" onclick="printPackage()">Print package</button>
    <button class="btn p" onclick="exportZip()">Export ZIP</button>
    <span class="tb-who" id="tbWho"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="view"></div>
</div>

<div id="printDoc"></div>

<script>
/* ════════════════════════════════════════════════════════════════════
   PROGRAM DATA — the ONLY place a utility's closeout requirements live.
   Every item: id, label, detail, req (required at completion), cat.
   Categories drive the ZIP folder a file lands in.
   ════════════════════════════════════════════════════════════════════ */
var CATS = {
  forms:   '01 Completion Forms',
  costs:   '02 Invoices & Payment',
  permits: '03 Permits & Inspection',
  equip:   '04 EVSE & Network',
  photos:  '05 Photos',
  drawings:'06 As-Builts',
  admin:   '07 Tax & Agreements'
};

/* Shared building blocks — each program picks from these and adds its own. */
var DOC = {
  invoice:   { id:'invoice',   cat:'costs',   req:true,  label:'Final itemised contractor invoice(s)',
               detail:'Line items split into make-ready (customer-side infrastructure) and EVSE hardware / installation. Totals must match the cost reconciliation.' },
  payment:   { id:'payment',   cat:'costs',   req:true,  label:'Proof of payment',
               detail:'Cancelled cheque, bank/ACH record or paid-in-full receipt for every invoice claimed.' },
  lien:      { id:'lien',      cat:'costs',   req:false, label:'Final lien waiver / release',
               detail:'From the electrical contractor (and any sub over the program threshold).' },
  hwInvoice: { id:'hwInvoice', cat:'costs',   req:true,  label:'EVSE hardware invoice',
               detail:'Showing make, model, quantity and unit price of the chargers purchased.' },
  permit:    { id:'permit',    cat:'permits', req:true,  label:'Electrical permit',
               detail:'Permit number issued by the AHJ for the EVSE installation.' },
  inspect:   { id:'inspect',   cat:'permits', req:true,  label:'Certificate of electrical inspection (final sign-off)',
               detail:'Signed final by the municipal wiring inspector / AHJ.' },
  bldg:      { id:'bldg',      cat:'permits', req:false, label:'Building / zoning / DPW permits closed',
               detail:'Only where the job needed them (trenching in the right of way, new pads, signage).' },
  serials:   { id:'serials',   cat:'equip',   req:true,  label:'EVSE register with serial numbers',
               detail:'Make, model, serial, ports and kW for every charger. Generated from the Equipment tab.' },
  qpl:       { id:'qpl',       cat:'equip',   req:true,  label:'Qualified / ENERGY STAR product evidence',
               detail:'Spec sheet or listing showing each Level 2 model is on the program’s qualified product list.' },
  network:   { id:'network',   cat:'equip',   req:true,  label:'Network service agreement',
               detail:'Executed networking / software subscription covering the program’s required operating term.' },
  activation:{ id:'activation',cat:'equip',   req:true,  label:'Commissioning / network activation confirmation',
               detail:'Report or screenshot showing each station online and reporting on the network, with the activation date.' },
  datashare: { id:'datashare', cat:'admin',   req:true,  label:'Data-sharing authorisation',
               detail:'Signed consent for the network provider to share charging-session data with the utility for the program term.' },
  w9:        { id:'w9',        cat:'admin',   req:true,  label:'IRS Form W-9',
               detail:'For whoever receives the incentive payment (site host or assigned contractor).' },
  assign:    { id:'assign',    cat:'admin',   req:false, label:'Incentive payment assignment',
               detail:'Only if the incentive is paid to the contractor rather than the site host.' },
  asbuilt:   { id:'asbuilt',   cat:'drawings',req:true,  label:'As-built site plan',
               detail:'Charger locations, conduit/trench route, panel and meter as installed. Export from the editor.' },
  oneline:   { id:'oneline',   cat:'drawings',req:true,  label:'As-built single-line diagram',
               detail:'Service, panel, breakers and circuits feeding the EVSE, as installed.' },
  loadcalc:  { id:'loadcalc',  cat:'drawings',req:false, label:'Final load calculation',
               detail:'Where the service or panel was modified.' },
  signage:   { id:'signage',   cat:'photos',  req:false, label:'EV parking signage / striping in place',
               detail:'Photo of signage and stall marking, including any accessible (ADA) space.' }
};

var PHOTOS = [
  { id:'ph_evse',   label:'Each charger installed, full view',                req:true  },
  { id:'ph_plate',  label:'Each charger nameplate / serial number label',     req:true  },
  { id:'ph_panel',  label:'Panel / breakers feeding the EVSE (cover off)',    req:true  },
  { id:'ph_meter',  label:'Service / meter (and new meter if installed)',     req:true  },
  { id:'ph_trench', label:'Open trench with conduit before backfill',         req:false },
  { id:'ph_restore',label:'Surface restoration after backfill',               req:false },
  { id:'ph_bollard',label:'Bollards / wheel stops / pad',                      req:false },
  { id:'ph_screen', label:'Charger screen or app showing it online',          req:true  }
];

function pick(ids, extra){
  var out=[], i;
  for(i=0;i<ids.length;i++) out.push(DOC[ids[i]]);
  for(i=0;extra && i<extra.length;i++) out.push(extra[i]);
  return out;
}
var BASE_IDS = ['invoice','hwInvoice','payment','lien','permit','inspect','bldg',
                'serials','qpl','network','activation','datashare','w9','assign',
                'asbuilt','oneline','loadcalc','signage'];

var PROGRAMS = {
  es_ma: {
    utility:'Eversource', state:'MA', name:'Eversource MA — EV Make-Ready Program (Level 2)',
    submit:'Your installer submits the project closeout report through Eversource\u2019s MA EV PowerClerk portal (eversourcemaevprogram.powerclerk.com) with the project number (ESMAEV-##### or HTMAEV-#####). Chargers must be on Eversource\u2019s MA EVSE Qualified Products List, with proof of purchase before construction. Letter of Agreement must be fully executed by Dec 31, 2026.',
    termYears:5,
    docs: pick(BASE_IDS, [
      { id:'es_complete', cat:'forms', req:true, label:'Eversource Project Completion Form',
        detail:'Signed by the site host and the contractor; project ID from the pre-approval letter.' },
      { id:'es_approval', cat:'forms', req:true, label:'Pre-approval / commitment letter (copy)',
        detail:'Sets the approved make-ready amount the completion is reconciled against.' },
      { id:'es_hostagr',  cat:'admin', req:true, label:'Executed Site Host Agreement',
        detail:'The program participation agreement signed at approval.' }
    ])
  },
  es_ct: {
    utility:'Eversource', state:'CT', name:'Eversource CT — EV Charging Program (Level 2, PURA)',
    submit:'Submit through the Eversource CT EV Charging Program portal, referencing the application number.',
    termYears:5,
    docs: pick(BASE_IDS, [
      { id:'ct_complete', cat:'forms', req:true, label:'Project Completion / Incentive Request Form',
        detail:'Signed by the site host; application number from the reservation.' },
      { id:'ct_approval', cat:'forms', req:true, label:'Incentive reservation / approval (copy)',
        detail:'Approved port count and incentive cap.' },
      { id:'ct_hostagr',  cat:'admin', req:true, label:'Executed participant / site host agreement', detail:'' }
    ])
  },
  ng_ma: {
    utility:'National Grid', state:'MA', name:'National Grid MA \u2014 EV Charging Station Make-Ready Program (Level 2)',
    /* VERIFIED 2026-09-25 against National Grid's own documents:
       Closeout Checklist CM10894 (2/26), Standard Terms and Conditions
       CM10552 MA (1/26), incentive charts CM8214B/D (11/25), Invoice
       Template (nationalgrid_ev_make_ready_invoice.xlsx). Phase III ends
       12/31/2026; applications by Oct 1 2026, signed Pre-Approval Offer
       Letter back by Dec 31 2026. */
    verified:'2026-09-25 \u2014 National Grid Closeout Checklist CM10894 (2/26), T&C CM10552 (1/26)',
    submit:'Upload every closeout document to the CE 2.0 portal (nationalgridclean energy.my.site.com/tradepartners). Questions: EVnationalgrid@nationalgrid.com. Customer-side construction must finish within 6 months of the Pre-Approval Offer Letter unless the program manager extends it; costs invoiced before the approval letter date are not eligible.'.replace('clean energy','cleanenergy'),
    termYears:4,
    termNote:'Keep the EVSE operational and report usage monthly for 4 years from the Activation Date (T&C 1.3, 4.6, 11.1); a shortfall is repaid straight-line.',
    docs: [
      /* Already on file from the application: at closeout, check for missing answers or signatures. */
      { id:'ng_estimate', cat:'forms',   req:true, label:'Estimate (on file from application)', detail:'Check it is complete and signed.' },
      { id:'ng_siteplan', cat:'drawings',req:true, label:'Site Plan (on file from application)', detail:'' },
      { id:'ng_agreement',cat:'admin',   req:true, label:'Signed Agreement (Pre-Approval Offer Letter)', detail:'On file; check signatures.' },
      { id:'ng_tc',       cat:'admin',   req:true, label:'Terms and Conditions (CM10552 MA)', detail:'On file; check signatures.' },
      { id:'ng_assign',   cat:'admin',   req:false,label:'Assignment of Incentive (CM8264 MA)', detail:'Only when someone other than the customer is paid. That payee also submits a W-9.' },
      { id:'ng_ejc',      cat:'admin',   req:false,label:'Publicly Accessible and Fleet EJ Community Certification (CM9274)', detail:'Public and fleet projects.' },
      /* New at closeout */
      { id:'ng_asbuilt',  cat:'drawings',req:true, label:'As-Built Site Plan', detail:'' },
      { id:'ng_sessions', cat:'equip',   req:true, label:'Sessions Report', detail:'Must show networking IDs, date of charge and usage.' },
      { id:'ng_permit',   cat:'permits', req:true, label:'City or Town Permit', detail:'' },
      { id:'ng_invoice',  cat:'costs',   req:true, label:'Invoice Template, signed by the customer, both tabs complete', detail:'The Serial Number tab needs, per port: EVSE serial (required), MAC address (optional), charger type and activation date. Filled from the Equipment tab.' },
      { id:'ng_custinv',  cat:'costs',   req:true, label:'Customer Invoice showing total project costs incurred', detail:'' },
      { id:'ng_distinv',  cat:'costs',   req:true, label:'Distributor invoice for the EVSEs and equipment', detail:'' },
      { id:'ng_thirdparty',cat:'forms',  req:true, label:'Third Party Funding Verification Form (CM9272)', detail:'Filed whether or not other funding (e.g. MassEVIP) was used.' },
      { id:'ng_w9',       cat:'admin',   req:true, label:'Customer and payee W-9s', detail:'' },
      { id:'ng_signatory',cat:'admin',   req:false,label:'Authorized Signatory Form (CM11271)', detail:'Listed on the program page (not on the checklist): signatories for Site Host, Property Owner and EVSE Owner-Operator.' },
      { id:'ng_final',    cat:'forms',   req:false,label:'Final Rebate Document', detail:'National Grid prepares this after the above; attach it when it comes back.' },
      { id:'ng_qpl',      cat:'equip',   req:true, label:'Chargers on the EPRI Vetted Product List (MA tab); network provider on the Qualified Network Service Provider List (CM9896)', detail:'Networking is required for Public and Workplace Level 2, not for MUD.' }
    ],
    photos: [
      { id:'ph_evse',   label:'Pictures of each EVSE installed', req:true },
      { id:'ph_plate',  label:'Each charger nameplate / serial number label', req:false },
      { id:'ph_xfmrpad',label:'Transformer pad (if civil work was required)', req:false },
      { id:'ph_bollard',label:'Bollards (if civil work was required)', req:false }
    ]
  },
  ng_ny: {
    utility:'National Grid', state:'NY', name:'National Grid NY — EV Make-Ready Program (Level 2)',
    submit:'Submit the completion package in the National Grid NY Make-Ready participant portal, referencing the project ID.',
    termYears:5,
    docs: pick(BASE_IDS, [
      { id:'ny_complete', cat:'forms', req:true, label:'Make-Ready Program Project Completion Form', detail:'' },
      { id:'ny_approval', cat:'forms', req:true, label:'Incentive approval / reservation (copy)', detail:'' },
      { id:'ny_cost',     cat:'costs', req:true, label:'Itemised make-ready cost breakdown (program categories)',
        detail:'Customer-side make-ready separated from EVSE and ineligible costs.' },
      { id:'ny_contractor',cat:'admin',req:true, label:'Approved contractor confirmation',
        detail:'The installer’s eligible-contractor status in the program.' }
    ])
  },
  ng_ri: {
    utility:'National Grid', state:'RI', name:'Rhode Island Energy / National Grid RI — EV Program (Level 2)',
    submit:'Submit to the RI EV program team with the project number. (Rhode Island Energy took over National Grid’s RI service territory in 2022.)',
    termYears:5,
    docs: pick(BASE_IDS, [
      { id:'ri_complete', cat:'forms', req:true, label:'Project Completion Form', detail:'' },

function r2(n){ return Math.round((n||0)*100)/100; }
function money(n){ return '$'+r2(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ── attachments: IndexedDB, falls back to memory ── */
var IDB=null, MEMBLOB={};
function idb(cb){
  if(IDB) return cb(IDB);
  try{
    var rq=indexedDB.open('omega-l2-closeout',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('files'); };
    rq.onsuccess=function(){ IDB=rq.result; cb(IDB); };
    rq.onerror=function(){ cb(null); };
  }catch(e){ cb(null); }
}
function putBlob(key, blob, cb){
  idb(function(db){
    if(!db){ MEMBLOB[key]=blob; return cb(); }
    try{ var tx=db.transaction('files','readwrite'); tx.objectStore('files').put(blob,key); tx.oncomplete=function(){cb();}; tx.onerror=function(){ MEMBLOB[key]=blob; cb(); }; }
    catch(e){ MEMBLOB[key]=blob; cb(); }
  });
}
function getBlob(key, cb){
  if(MEMBLOB[key]) return cb(MEMBLOB[key]);
  idb(function(db){
    if(!db) return cb(null);
    try{ var rq=db.transaction('files').objectStore('files').get(key); rq.onsuccess=function(){cb(rq.result||null);}; rq.onerror=function(){cb(null);}; }
    catch(e){ cb(null); }
  });
}
function delBlob(key){
  delete MEMBLOB[key];
  idb(function(db){ if(db) try{ db.transaction('files','readwrite').objectStore('files')['delete'](key); }catch(e){} });
}
function attach(itemId, input){
  var files=input.files, i, left=files.length;
  if(!left) return;
  if(!FILES[itemId]) FILES[itemId]=[];
  for(i=0;i<files.length;i++){
    (function(f){
      var key=C.id+'/'+itemId+'/'+uid();
      putBlob(key, f, function(){
        FILES[itemId].push({ key:key, name:f.name, type:f.type, size:f.size });
        var st=docState(itemId); if(st.status==='todo') st.status='collected';
        if(--left===0){ save(); render(); }
      });
    })(files[i]);
  }
  input.value='';
}
function detach(itemId, key){
  var list=FILES[itemId]||[], i;
  for(i=0;i<list.length;i++) if(list[i].key===key){ list.splice(i,1); break; }
  delBlob(key); save(); render();
}

/* ════════════════════════════════════════════════════════════════════
   DERIVED NUMBERS
   ════════════════════════════════════════════════════════════════════ */
function isElig(cat){
  var o=C.costs[cat.k]&&C.costs[cat.k].eligOverride;
  return (o===true||o===false) ? o : cat.elig;
}
function totals(){
  var t={est:0,fin:0,elig:0,evse:0,inel:0}, i, c, row;
  for(i=0;i<COST_CATS.length;i++){
    c=COST_CATS[i]; row=C.costs[c.k]||{est:0,fin:0};
    t.est+=num(row.est); t.fin+=num(row.fin);
    if(isElig(c)) t.elig+=num(row.fin);
    else if(c.evse) t.evse+=num(row.fin);
    else t.inel+=num(row.fin);
  }
  return t;
}
function ports(){ var n=0,i; for(i=0;i<C.equip.length;i++) n+=num(C.equip[i].ports)||0; return n; }
/* Reconciliation, not eligibility: every input is a number the user copied
   from their own approval letter. Payable is the lesser of what was
   approved, the program share of the eligible final cost, and any per-port
   cap they entered. */
function payable(){
  var t=totals(), inc=C.incentive;
  var share=t.elig*(num(inc.pct)/100);
  var caps=[share];
  if(num(inc.approved)>0) caps.push(num(inc.approved));
  if(num(inc.perPortCap)>0 && ports()>0) caps.push(num(inc.perPortCap)*ports());
  return { share:share, pay:Math.max(0,Math.min.apply(null,caps)), t:t };
}
function readiness(){
  var items=allItems(), req=0, done=0, missing=[], i, st;
  for(i=0;i<items.length;i++){
    st=docState(items[i].id);
    if(st.status==='na') continue;
    if(items[i].req){ req++; if(st.status==='collected'||st.status==='submitted') done++; else missing.push(items[i].label); }
  }
  /* the package is also incomplete while the register or the costs are empty */
  var gaps=[];
  if(!C.equip.length) gaps.push('No chargers in the equipment register');
  for(i=0;i<C.equip.length;i++){ if(!String(C.equip[i].serial||'').trim()){ gaps.push('Serial number missing on '+(C.equip[i].tag||('charger '+(i+1)))); break; } }
  if(!totals().fin) gaps.push('No final invoiced costs entered');
  var P=C.p;
  if(!P.utilityProjectId) gaps.push('Utility project / application ID');
  if(!P.inspectionDate)   gaps.push('Final inspection date');
  if(!P.activationDate)   gaps.push('Network activation date');
  var s=C.signoff;
  if(!s.hostName||!s.ctrName) gaps.push('Sign-off names');
  return { req:req, done:done, missing:missing, gaps:gaps,
           pct: req ? Math.round(100*done/req) : 0 };
}

function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function csv(rows){ return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n'); }
function equipCSV(){
  var rows=[['Tag','Make','Model','Serial','Ports','kW','Network station ID','ENERGY STAR','Location']], i, e;
  for(i=0;i<C.equip.length;i++){ e=C.equip[i]; rows.push([e.tag,e.make,e.model,e.serial,e.ports,e.kw,e.netId,e.estar,e.loc]); }
  return csv(rows);
}
function costCSV(){
  var rows=[['Category','Make-ready eligible','Estimate','Final invoiced','Variance']], i, c, row, t=totals(), p=payable();
  for(i=0;i<COST_CATS.length;i++){ c=COST_CATS[i]; row=C.costs[c.k]; rows.push([c.label,isElig(c)?'Yes':'No',r2(row.est),r2(row.fin),r2(num(row.fin)-num(row.est))]); }
  rows.push(['Total','',r2(t.est),r2(t.fin),r2(t.fin-t.est)]);
  rows.push([]); rows.push(['Eligible final cost','','',r2(t.elig)]);
  rows.push(['Approved incentive','','',r2(C.incentive.approved)]);
  rows.push(['Payable at completion','','',r2(p.pay)]);
  return csv(rows);
}

function safeName(s){ return String(s||'closeout').replace(/[^\w\- .]+/g,'_').replace(/\s+/g,'_').slice(0,60); }
function dl(name, data, type){
  var b=(data instanceof Blob)?data:new Blob([data],{type:type||'application/octet-stream'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); },500);
}
function exportJSON(){ C.fileIndex=FILES; dl(safeName(C.p.projectName||C.p.address)+'_closeout.json', JSON.stringify(C,null,2), 'application/json'); }
function importJSON(inp){
  var f=inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);
      if(!o||!o.p||!o.costs) throw new Error('not a closeout file');
      var b=blank(), k;
      for(k in b) if(b.hasOwnProperty(k) && o[k]==null) o[k]=b[k];
      o.id=o.id||uid(); C=o; FILES={};  /* attachments do not travel in the file */
      save(); render();

  };
  rd.readAsText(f); inp.value='';
}
function exportZip(){
  if(window._ZIPFAIL || typeof JSZip==='undefined'){ alert('The ZIP library did not load. Use Print package and the CSV buttons instead.'); return; }
  var zip=new JSZip(), root=safeName(C.p.projectName||C.p.address)+'_L2_closeout';
  var doc='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Closeout summary</title><style>body{font-family:Arial,sans-serif;font-size:12px;max-width:900px;margin:24px auto}table{width:100%;border-collapse:collapse;margin-bottom:8px}th,td{border:1px solid #999;padding:4px 6px;text-align:left}td.num,th.num{text-align:right}h2{border-bottom:2px solid #000;font-size:14px;margin-top:22px}.sig{display:flex;gap:40px;margin-top:30px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px}</style></head><body>'+summaryHTML()+'</body></html>';
  zip.file(root+'/00_Closeout_Summary.html', doc);

  zip.file(root+'/'+CATS.costs+'/cost_reconciliation.csv', costCSV());
  var items=allItems(), jobs=[], i, j;
  for(i=0;i<items.length;i++){
    var list=FILES[items[i].id]||[];
    for(j=0;j<list.length;j++) jobs.push({ item:items[i], f:list[j] });
  }
  var left=jobs.length, missing=[];
  function finish(){
    if(missing.length) zip.file(root+'/MISSING_ATTACHMENTS.txt','These files were listed but are not stored in this browser; re-attach them:\r\n'+missing.join('\r\n'));
    zip.generateAsync({type:'blob'}).then(function(b){ dl(root+'.zip', b, 'application/zip'); });
  }
  if(!left) return finish();
  jobs.forEach(function(jb){
    getBlob(jb.f.key, function(blob){
      var folder=root+'/'+CATS[jb.item.cat]+'/'+safeName(jb.item.label)+'/';
      if(blob) zip.file(folder+jb.f.name, blob); else missing.push(jb.item.label+': '+jb.f.name);
      if(--left===0) finish();
    });
  });
}

/* ════════════════════════════════════════════════════════════════════
   EDITOR HANDOFF
   editor.html writes OMEGA_EV_CLOSEOUT_HANDOFF (same origin) and opens
   this page. Same payload shape the cost workbook takes: site, chargers
   (fleet by model), lines (priced estimate), feet. Estimate lines become
   the Estimate column; the fleet becomes the register rows.
   ════════════════════════════════════════════════════════════════════ */
function catOfLine(l){
  var s=(String(l.category||'')+' '+String(l.description||'')).toLowerCase();
  if(/charger|evse|pedestal/.test(s)) return 'evseInst';
  if(/network|software|subscription|activation/.test(s)) return 'network';
  if(/trench|bore|excavat|saw ?cut|backfill/.test(s)) return 'civil';
  if(/restor|asphalt|concrete patch|strip|paint/.test(s)) return 'restore';
  if(/pad|bollard|wheel ?stop|base/.test(s)) return 'pads';
  if(/panel|breaker|disconnect|switch|meter|transformer|service/.test(s)) return 'electric';
  if(/design|engineer|permit|drawing|survey/.test(s)) return 'design';
  if(/conduit|wire|cable|handhole|pull ?box|junction/.test(s)) return 'conduit';
  return 'other';
}
function loadHandoff(pay){
  if(pay.sites && pay.sites.length) pay=pay.sites[0];
  var s=pay.site||{}, i, j, n=0;
  if(s.name && !C.p.projectName) C.p.projectName=s.name;
  if(s.applicant && !C.p.siteHost) C.p.siteHost=s.applicant;
  if(s.address && !C.p.address) C.p.address=s.address;
  if(pay.lines && pay.lines.length){
    for(i=0;i<COST_CATS.length;i++) C.costs[COST_CATS[i].k].est=0;
    for(i=0;i<pay.lines.length;i++){
      var l=pay.lines[i];
      C.costs[catOfLine(l)].est=r2(C.costs[catOfLine(l)].est+num(l.mat)+num(l.lab));
    }
  }
  if(pay.chargers && pay.chargers.length){
    var hw=0;
    C.equip=[];
    for(i=0;i<pay.chargers.length;i++){
      var ch=pay.chargers[i], q=Math.max(1,Math.round(num(ch.qty)||1));
      hw+=num(ch.eq);
      for(j=0;j<q;j++){
        n++;
        C.equip.push({ tag:'EV-'+(n<10?'0':'')+n, make:ch.mfr||'', model:ch.model||ch.id||'', serial:'',
                       ports: num(ch.ports)||2, kw: num(ch.kw)||'', netId:'', estar:'Unknown', loc:'' });
      }
    }
    if(hw) C.costs.evse.est=r2(hw);
  }
  save(); render();
  return n;
}
function pullFromEditor(){
  var raw=null;
  try{ raw=localStorage.getItem(HANDOFF_KEY); }catch(e){}
  if(!raw){ alert('Nothing handed over yet. In the editor open Electrical Estimate and press L2 Closeout.'); return; }
  try{
    var n=loadHandoff(JSON.parse(raw));
    localStorage.removeItem(HANDOFF_KEY);
    TAB='project'; render();
    alert('Loaded the site'+(n?' and '+n+' charger(s)':'')+' from the editor. Serial numbers and final costs are yours to fill in.');
  }catch(e){ alert('The editor handoff could not be read: '+e.message); }
}
