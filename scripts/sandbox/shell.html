<title>Clean Cell Live Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
  /* ══ Two real brands, neither of them mine ═══════════════════════════════
     Clean Cell  — cyan on white, near-black headlines, a coral accent, the
                   bolt from their wordmark, Poppins.
     ClearSky    — blueprint: warm paper, a blue grid, monospace sheet labels,
                   an orange call to action.
     The browser frame around them stays light and neutral so it does not
     fight either one.
     ══════════════════════════════════════════════════════════════════════ */
  :root{
    --cc:'Poppins',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --cs:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --f:var(--cc);
    --paper:#FFFFFF; --sunk:#F1FAFC; --ink:#0B2733; --ink2:#3F5D68; --ink3:#86A0A9;
    --line:#DCECF1; --line2:#EFF8FA;
    --brand:#3FAFC6; --brand-d:#2A8CA3; --brand-soft:#E2F4F8;
    --accent:#EE5A4F; --accent-soft:#FDEBE9;
    --ok:#17845C; --ok-bg:#E2F5EE; --warn:#9A6206; --warn-bg:#FCF1DC;
    --bad:#C4372B; --bad-bg:#FCEAE8;
    --shadow:0 1px 2px rgba(11,39,51,.04),0 10px 30px -16px rgba(11,39,51,.20);
    --r:14px;
  }
  [data-skin="omega"]{
    --f:var(--cs);
    --paper:#FFFFFF; --sunk:#F7F5EF; --ink:#10161C; --ink2:#44505C; --ink3:#7C8794;
    --line:#E2E1D8; --line2:#F1EFE7;
    --brand:#1B57C9; --brand-d:#13419B; --brand-soft:#E6EDFB;
    --accent:#E4502A; --accent-soft:#FCEAE3;
    --r:6px;
  }
  /* No dark mode. Both of these are light brands; repainting a white-label
     demo navy because the viewer's phone is in dark mode shows them a brand
     that does not exist. color-scheme pins the form controls too. */
  :root{color-scheme:light}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:#E9ECEE;color:var(--ink);font:400 15px/1.6 var(--f);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}

  /* ══ sandbox bar — neutral, so it belongs to neither brand ══ */
  .demo{position:sticky;top:0;z-index:60;background:#F6F7F8;border-bottom:1px solid #DFE3E6;
    padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:400 13px var(--cs);color:#5A646D}
  .demo .tag{font:700 10px var(--m);letter-spacing:.14em;background:#EE5A4F;color:#fff;
    padding:4px 8px;border-radius:4px}
  .demo .as{font-size:12.5px;color:#8A949C}
  .who{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
  .who button{background:#fff;border:1px solid #DFE3E6;color:#48525A;border-radius:999px;
    padding:6px 12px;cursor:pointer;font:600 12.5px var(--cs);white-space:nowrap}
  .who button:hover{border-color:#9AA4AC;color:#1B242B}
  .who button[aria-current="true"]{background:#1B242B;border-color:#1B242B;color:#fff}
  .demo .sp{flex:1}
  .demo .mini{background:#fff;border:1px solid #DFE3E6;color:#5A646D;border-radius:7px;
    padding:6px 10px;cursor:pointer;font:600 12px var(--cs)}
  .demo .mini:hover{color:#1B242B;border-color:#9AA4AC}
  .demo .mini[aria-pressed="true"]{background:#1B242B;border-color:#1B242B;color:#fff}
  .hint{width:100%;display:flex;align-items:center;gap:8px;color:#5A646D;font:400 12.5px var(--cs);padding-top:1px}
  @media (max-width:760px){
    .demo{padding:6px 10px;gap:6px}
    .demo .as{display:none}
    .demo .sp{display:none}
    .demo .tag{font-size:9px;padding:3px 6px}
    .demo .lbl-long{display:none} .demo .lbl-short{display:inline}
    .who{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;gap:5px;scrollbar-width:none;
      -webkit-overflow-scrolling:touch}
    .who::-webkit-scrollbar{display:none}
    .who button{padding:5px 10px;font-size:12px}
    .demo .mini{padding:4px 9px;font-size:11px;order:3;flex:none}
    .hint{order:4;flex:1 1 100%;display:block;font-size:11.5px;line-height:1.45;padding-top:2px;white-space:normal}
    .chrome{padding:6px 10px;gap:7px}
    .url{padding:6px 12px;font-size:11.5px;justify-content:flex-start}
    .dots{display:none}
  }
  .hint b{color:#1B242B;font-weight:600}
  /* The click handler matches on the button's id, so the label spans must
     not become the event target. */
  .lbl-long,.lbl-short{pointer-events:none}
  .lbl-short{display:none}

  /* ══ browser frame — light, like the phone it will be shown on ══ */
  .chrome{position:sticky;top:0;z-index:50;background:#EDEFF1;padding:8px 12px;display:flex;
    align-items:center;gap:10px;border-bottom:1px solid #DFE3E6}
  .dots{display:flex;gap:6px;flex:none}
  .dots i{width:11px;height:11px;border-radius:50%;background:#C8CED3}
  .dots i:first-child{background:#F0645A} .dots i:nth-child(2){background:#F1BE4F}
  .dots i:nth-child(3){background:#5FC474}
  .back{background:transparent;border:0;color:#8A949C;cursor:pointer;padding:2px 5px;font-size:17px;line-height:1}
  .back:disabled{opacity:.3;cursor:default}
  .url{flex:1;min-width:0;background:#fff;border:1px solid #E1E5E8;border-radius:999px;
    padding:7px 16px;color:#5A646D;font:500 12.5px var(--m);display:flex;align-items:center;gap:8px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;justify-content:center}
  .url .lock{color:#5FC474;flex:none;font-size:11px}
  .url .dom{color:#1B242B;font-weight:600}
  #urltext{overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* ══ page ══ */
  .vp{background:var(--paper);min-height:78vh;color:var(--ink);position:relative}
  [data-skin="omega"] .vp{
    background-color:var(--sunk);
    background-image:linear-gradient(rgba(27,87,201,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(27,87,201,.07) 1px,transparent 1px);
    background-size:26px 26px;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  .sp{flex:1}
  h1,h2,h3,h4{margin:0;line-height:1.1;letter-spacing:-.025em}
  h1{font-size:clamp(34px,5.4vw,60px);font-weight:700}
  h2{font-size:clamp(24px,3vw,34px);font-weight:700}
  h3{font-size:19px;font-weight:600;letter-spacing:-.015em}
  h4{font-size:15px;font-weight:600;letter-spacing:-.01em}
  [data-skin="omega"] h1,[data-skin="omega"] h2{font-weight:800}
  p{margin:0}
  .lead{color:var(--ink2);font-size:clamp(15px,1.5vw,17px);line-height:1.7}
  .mut{color:var(--ink3)}
  .sm{font-size:13.5px} .xs{font-size:12px}
  code{font:500 12.5px var(--m);background:var(--brand-soft);color:var(--brand-d);
    padding:2px 6px;border-radius:4px;word-break:break-word}
  .eyebrow{font:600 11px var(--m);letter-spacing:.18em;text-transform:uppercase;color:var(--brand-d)}

  /* ══ Clean Cell public site ══ */
  .nav{background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:6}
  .nav .in{max-width:1120px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;
    gap:26px;flex-wrap:wrap}
  /* Their mobile nav is a coral hamburger. Below this width the links are
     behind it, which is also what stops the bar overflowing the phone. */
  .burger{display:none;flex-direction:column;gap:4px;background:0;border:0;cursor:pointer;padding:6px 2px}
  .burger i{display:block;width:26px;height:4px;border-radius:2px;background:var(--accent)}
  @media (max-width:800px){
    .burger{display:inline-flex}
    .nav .nlinks{display:none;order:9;width:100%;flex-direction:column;gap:15px;padding:6px 0 2px}
    .nav.open .nlinks{display:flex}
    .nav .in{gap:14px}
  }
  .logo{display:flex;align-items:baseline;gap:1px;font:700 25px var(--cc);letter-spacing:-.03em;
    color:var(--ink);white-space:nowrap}
  .logo .c1{color:var(--brand)}
  .logo .bolt{width:.5em;height:1.0em;margin:0 .02em -.02em;align-self:flex-end}
  .logo .us{font:600 .38em var(--cc);letter-spacing:.02em;color:var(--ink);margin-left:.14em}
  .nlinks{display:flex;gap:24px;font:500 14.5px var(--f);color:var(--ink2);flex-wrap:wrap}
  .nlinks button{background:0;border:0;cursor:pointer;padding:0;font:inherit;color:inherit}
  .nlinks button:hover{color:var(--brand)}
  .hero{position:relative;overflow:hidden;padding:clamp(48px,8vw,104px) 0 clamp(40px,6vw,76px);
    background:linear-gradient(170deg,#FFFFFF 0%,#EAF6F9 55%,#DDF0F5 100%)}
  .hero .wm{position:absolute;right:-4%;top:-14%;height:150%;opacity:.5;pointer-events:none}
  .hero .in{position:relative;z-index:1}
  .hero h1 .b2{color:var(--brand);display:block}
  .hero .say{font:600 clamp(16px,1.8vw,19px)/1.75 var(--f);color:var(--ink);max-width:36ch;margin-top:30px}
  .hero .say2{color:var(--ink2);font-weight:400;font-size:clamp(15px,1.5vw,16.5px);margin-top:16px;max-width:48ch}
  .hgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
  @media (max-width:900px){ .hgrid{grid-template-columns:1fr;gap:30px} .hero .wm{display:none} }
  .stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:34px}
  .stats div b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em}
  .stats div span{font-size:12.5px;color:var(--ink3)}
  .band{background:var(--sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:clamp(36px,5vw,64px) 0}
  .sec{padding:clamp(40px,6vw,76px) 0}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:18px;margin-top:28px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;text-align:left}
  button.card{cursor:pointer;font:inherit;color:inherit}
  button.card:hover{border-color:var(--brand);transform:translateY(-1px)}
  .card .cap{font:600 10.5px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-d)}
  .card .spec{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:2px}
  .card .price{font-weight:600;font-size:17px;margin-top:auto;padding-top:10px;letter-spacing:-.02em}
  .foot{background:var(--ink);color:#BFD6DD;padding:32px 0;font-size:12.5px}
  .foot .logo{color:#fff}
  .foot .logo .us{color:#fff}
  [data-skin="omega"] .foot{background:var(--ink);color:#B9C3CF}

  /* ══ buttons ══ */
  .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
    padding:12px 24px;font:600 15px var(--f);cursor:pointer;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
  .b:hover{border-color:var(--brand);color:var(--brand-d)}
  .b.p{background:var(--brand);border-color:var(--brand);color:#fff}
  .b.p:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
  .b.a{background:var(--accent);border-color:var(--accent);color:#fff}
  .b.a:hover{filter:brightness(.93);color:#fff}
  .b.sm{padding:8px 15px;font-size:13.5px}
  .b.lg{padding:15px 30px;font-size:16px}
  .b:disabled{opacity:.45;cursor:not-allowed}
  .b.g{border-color:transparent;background:transparent;color:var(--brand-d);padding-left:0}
  [data-skin="omega"] .b{border-radius:4px;font-family:var(--cs)}
  [data-skin="omega"] .b.p{background:var(--accent);border-color:var(--accent)}
  [data-skin="omega"] .b.p:hover{background:var(--accent);filter:brightness(.92)}
  .brow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible
    {outline:2px solid var(--brand);outline-offset:2px}

  /* ══ forms ══ */
  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
  .fld>span{font:600 10.5px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  input,select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;
    padding:11px 13px;width:100%;font-size:15px}
  [data-skin="omega"] input,[data-skin="omega"] select{border-radius:4px}
  input:focus,select:focus{border-color:var(--brand);outline:none}
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
  .chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink2)}
  .chk input{width:auto}

  /* ══ app shell ══ */
  .app{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:78vh}
  @media (max-width:840px){ .app{grid-template-columns:minmax(0,1fr)} .side{position:static!important;max-height:none!important} }
  .side{background:var(--sunk);border-right:1px solid var(--line);padding:20px 15px;position:sticky;top:46px;
    align-self:start;max-height:calc(100vh - 46px);overflow:auto}
  [data-skin="omega"] .side{background:var(--paper)}
  .side .brandrow{display:flex;align-items:center;gap:9px;margin-bottom:22px}
  .snav{display:flex;flex-direction:column;gap:2px}
  .snav button{text-align:left;background:0;border:0;border-radius:9px;padding:9px 12px;cursor:pointer;
    color:var(--ink2);font:500 14px var(--f)}
  .snav button:hover{background:var(--line2);color:var(--ink)}
  .snav button[aria-current="true"]{background:var(--brand);color:#fff;font-weight:600}
  [data-skin="omega"] .snav button{border-radius:4px}
  [data-skin="omega"] .snav button[aria-current="true"]{background:var(--brand-soft);color:var(--brand-d)}
  .snav .grp{font:600 10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
    padding:16px 12px 6px}
  .sidefoot{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
  /* On a phone the sidebar becomes a scrolling strip, so the page starts at
     the content instead of 600px of navigation. */
  @media (max-width:840px){
    .side{display:flex;align-items:center;gap:10px;overflow-x:auto;padding:9px 12px;
      border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
    .side::-webkit-scrollbar{display:none}
    .side .brandrow{margin:0;flex:none}
    .snav{flex-direction:row;gap:6px;flex:none}
    .snav button{white-space:nowrap;padding:7px 13px;border-radius:999px;
      border:1px solid var(--line);background:var(--paper)}
    .snav .grp,.sidefoot{display:none}
  }
  .main{padding:28px 28px 64px;min-width:0}
  @media (max-width:640px){ .main{padding:20px 16px 46px} .wrap{padding:0 18px} }
  .ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .ph .sub{color:var(--ink3);font-size:13.5px;margin-top:5px}
  .sheettag{display:block;width:fit-content;font:600 10px var(--m);letter-spacing:.16em;
    background:var(--brand);color:#fff;padding:5px 9px;border-radius:3px;margin-top:14px}

  /* ══ panels / tables / tiles ══ */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;
    overflow:hidden}
  .panel>.hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    gap:12px;flex-wrap:wrap}
  .panel>.bd{padding:18px;overflow-x:auto}
  .panel>.bd.tight{padding:0}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:13px;margin-bottom:18px}
  .tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
  .tile .t{font:600 10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .tile .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.03em}
  .tile .v.s{font-size:16px;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{text-align:left;padding:11px 17px;font:600 10px var(--m);letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
  td{padding:13px 17px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr.clk{cursor:pointer}
  tbody tr.clk:hover{background:var(--line2)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .mono{font:500 13px var(--m)}
  .tag2{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f);border-radius:999px;
    padding:4px 11px;white-space:nowrap;background:var(--line2);color:var(--ink2)}
  [data-skin="omega"] .tag2{border-radius:3px;font-family:var(--m);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase}
  .tag2.ok{background:var(--ok-bg);color:var(--ok)} .tag2.warn{background:var(--warn-bg);color:var(--warn)}
  .tag2.bad{background:var(--bad-bg);color:var(--bad)} .tag2.br{background:var(--brand-soft);color:var(--brand-d)}
  .empty{padding:36px 18px;text-align:center;color:var(--ink3)}
  .dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:18px}
  .dl>div>.t{font:600 10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .dl>div>.v{font-weight:600;margin-top:5px}
  .two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:920px){ .two{grid-template-columns:minmax(0,1fr)} }

  /* ══ timeline ══ */
  .tl{display:flex;flex-direction:column}
  .tl .s{display:flex;gap:14px;padding:2px 0}
  .tl .rail{display:flex;flex-direction:column;align-items:center;flex:none;width:16px}
  .tl .dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:5px;flex:none}
  .tl .bar{width:2px;flex:1;background:var(--line);min-height:20px}
  .tl .s.done .dot{background:var(--ok)} .tl .s.done .bar{background:var(--ok)}
  .tl .s.now .dot{background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .tl .txt{padding-bottom:15px;min-width:0}
  .tl .txt b{font-size:14.5px;font-weight:600} .tl .txt div{font-size:13px;color:var(--ink3);margin-top:2px}
  .tl .s.wait .txt b{color:var(--ink3);font-weight:400}

  /* ══ design studio ══ */
  .studio{display:grid;grid-template-columns:204px minmax(0,1fr) 254px;
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
  @media (max-width:1000px){ .studio{grid-template-columns:minmax(0,1fr)} }
  .tools{background:var(--sunk);border-right:1px solid var(--line);padding:13px}
  .tools .grp{font:600 10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
    padding:11px 7px 6px}
  .tools button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:0;border:0;
    border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink2);font:500 13.5px var(--f)}
  .tools button:hover{background:var(--line2);color:var(--ink)}
  .tools button[aria-current="true"]{background:var(--brand);color:#fff;font-weight:600}
  .tools button.off{opacity:.36;cursor:not-allowed}
  .tools .ic{width:18px;text-align:center;flex:none}
  .cvs{background:var(--sunk);padding:16px;min-width:0}
  .cvs svg{display:block;width:100%;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px}
  .props{background:var(--sunk);border-left:1px solid var(--line);padding:15px}
  @media (max-width:1000px){ .props,.tools{border:0;border-top:1px solid var(--line)} }
  .props .grp{font:600 10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:14px 0 8px}
  .props .grp:first-child{margin-top:0}
  .pr{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line2)}
  .pr b{font-variant-numeric:tabular-nums;font-weight:600}
  .legend{display:flex;gap:7px 16px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--ink2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .sheetdoc{border:1px solid var(--line);border-radius:8px;padding:20px;background:var(--paper)}

  /* ══ bench tablet — Clean Cell on a shop-floor screen ══ */
  .kiosk{padding:22px 24px 48px}
