name: Catalog inspection
on:
  push:
    branches: [codex/cleancell-both-pickers-featured]
    paths: ['.github/workflows/catalog-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify placement implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('editor.html').read_text().splitlines()
          terms = ['Custom size', 'BESS_PRESET', 'function applyBMCatalog', 'function openBessPad', 'function placeBessPad']
          for i, line in enumerate(lines):
              if any(t in line for t in terms):
                  print('\n--- editor.html line', i+1, '---')
                  print('\n'.join(str(j+1)+': '+lines[j] for j in range(max(0,i-8),min(len(lines),i+100))))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-source-workspace
          retention-days: 1
          path: |
            editor.html
            CLAUDE.md
            package.json
            package-lock.json
            vercel.json
            omega-*.js
            scripts/
            api/
