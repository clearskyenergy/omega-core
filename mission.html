<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS // Mission Control</title>
<style>
:root{--bg:#020813;--panel:rgba(6,18,36,.6);--glow-cyan:#00f3ff;--glow-blue:#0044ff;
      --ink:#c1e7ff;--dim:#5f7d99;--good:#00ff66;--warn:#ffaa00;--bad:#ff4d4d;
      --edge:1px solid rgba(0,243,255,.3)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',Courier,monospace}
body{background:var(--bg);color:var(--ink);height:100vh;padding:16px;display:flex;
     flex-direction:column;gap:14px;overflow:hidden}
body::before{content:" ";position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%),
             linear-gradient(90deg,rgba(255,0,0,.06),rgba(0,255,0,.02),rgba(0,0,255,.06));
  background-size:100% 4px,6px 100%}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;
       border-bottom:var(--edge);padding-bottom:10px;flex:none}
.title{font-size:20px;font-weight:bold;letter-spacing:3px;color:var(--glow-cyan);
       text-shadow:0 0 10px rgba(0,243,255,.5)}
.badge{font-size:11px;padding:5px 10px;border:var(--edge);border-radius:4px;
       background:rgba(0,243,255,.1);letter-spacing:1px}
.badge.err{border-color:var(--bad);color:var(--bad)}
button{background:transparent;border:var(--edge);color:var(--glow-cyan);font-family:inherit;
       font-size:11px;letter-spacing:1px;padding:7px 12px;cursor:pointer;border-radius:4px}
button:hover{background:rgba(0,243,255,.12)}
button.on{background:rgba(255,60,60,.18);border-color:var(--bad);color:#ff9d9d}

.grid{display:grid;grid-template-columns:300px 1fr 400px;gap:14px;flex:1;min-height:0}
/* Stacked, the fixed panel heights plus a 100vh body with overflow hidden
   pile on top of each other. Below the breakpoint the page scrolls instead. */
@media(max-width:1200px){
  .grid{grid-template-columns:1fr}
  body{height:auto;min-height:100vh;overflow-y:auto}
  .panel{min-height:180px}
  .arcWrap{min-height:240px}
}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{background:var(--panel);border:var(--edge);border-radius:6px;padding:14px;
       position:relative;box-shadow:inset 0 0 15px rgba(0,68,255,.2);min-height:0;
       display:flex;flex-direction:column;gap:9px}
.panel::before{content:'';position:absolute;top:0;left:0;width:10px;height:10px;
  border-top:2px solid var(--glow-cyan);border-left:2px solid var(--glow-cyan)}
.panel::after{content:'';position:absolute;bottom:0;right:0;width:10px;height:10px;
  border-bottom:2px solid var(--glow-cyan);border-right:2px solid var(--glow-cyan)}
.ptitle{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--glow-cyan);
        border-bottom:1px solid rgba(0,243,255,.12);padding-bottom:5px;flex:none}
.row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.row .k{color:var(--dim)} .row .v{color:var(--ink);text-align:right}
.v.cy{color:var(--glow-cyan)} .v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
.scroll{overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:5px}
.scroll::-webkit-scrollbar-thumb{background:rgba(0,243,255,.3);border-radius:4px}
.alert{border:1px solid var(--warn);color:var(--warn);padding:9px;font-size:11.5px;line-height:1.5}

.core{align-items:center;justify-content:center;gap:0}
#arc{width:100%;flex:1;min-height:0;display:block}
.coreName{font-size:26px;letter-spacing:8px;color:var(--glow-cyan);
          text-shadow:0 0 16px rgba(0,243,255,.6);margin-top:4px}
.coreState{font-size:12px;color:var(--dim);letter-spacing:1px;margin-top:8px;text-align:center}
.coreState.awake{color:var(--good)}
.coreBtns{display:flex;gap:10px;margin-top:12px}
.queue{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.queue .n{font-size:30px;color:var(--glow-cyan);text-shadow:0 0 12px var(--glow-cyan)}
.queue .l{font-size:9px;color:var(--dim);letter-spacing:2px}
.arcWrap{position:relative;flex:1;width:100%;min-height:0;display:flex}

.thread{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.msg{padding:9px 11px;border-radius:5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.you{background:rgba(0,68,255,.14);border:1px solid rgba(0,68,255,.35);align-self:flex-end;max-width:88%}
.msg.jarvis{background:rgba(0,243,255,.06);border:1px solid rgba(0,243,255,.18);max-width:96%}
.msg .meta{font-size:10px;color:var(--dim);margin-top:5px}
.ask{display:flex;gap:8px;align-items:center;border-top:1px solid rgba(0,243,255,.12);padding-top:10px;flex:none}
.ask input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px;font-family:inherit}
.ask .p{color:var(--glow-cyan);font-weight:bold}
.foot{font-size:10.5px;color:var(--dim);letter-spacing:1px;flex:none}
.gate{max-width:420px;margin:16vh auto;text-align:center}
.gate p{color:var(--dim);font-size:13px;line-height:1.6;margin:10px 0 18px}
.caps{position:fixed;left:0;right:0;bottom:0;background:rgba(2,8,19,.97);
      border-top:1px solid var(--glow-blue);padding:11px 18px;z-index:99;display:none}
.caps.on{display:block}
.capwho{font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:3px}
.capwho.awake{color:var(--good)}
#captext{font-size:14px;color:var(--ink);line-height:1.4;max-height:80px;overflow-y:auto}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="title">J.A.R.V.I.S</div>
  <p>Every figure here is read from the twin. Nothing is simulated.</p>
  <button id="signin">AUTHENTICATE</button>
  <p id="gateErr" style="color:var(--bad)"></p>
</div>

<div id="app" hidden style="display:none;flex-direction:column;gap:14px;flex:1;min-height:0;width:100%">
  <header>
    <div class="title">J.A.R.V.I.S // COGNITIVE INTERFACE</div>
    <div class="badge" id="badge">CONNECTING</div>
    <div style="display:flex;gap:8px">
      <button id="mic">🎙 VOICE OFF</button>
      <button id="refresh">REFRESH</button>
    </div>
  </header>

  <div class="grid">
    <!-- LEFT -->
    <div class="col">
      <div class="panel" style="flex:none;max-height:36%">
        <div class="ptitle">Today</div>
        <div id="schedule" class="scroll"></div>
        <div id="alert"></div>
      </div>
      <div class="panel" style="flex:1;min-height:0">
        <div class="ptitle">To do — ranked</div>
        <div id="todos" class="scroll"></div>
      </div>
      <div class="panel" style="flex:none;max-height:26%">
        <div class="ptitle">Waiting to go out</div>
        <div id="drafts" class="scroll"></div>
      </div>
    </div>

    <!-- CENTRE -->
    <div class="col">
      <div class="panel core">
        <div class="arcWrap">
          <canvas id="arc"></canvas>
          <div class="queue"><div class="n" id="queueN">—</div><div class="l">IN QUEUE</div></div>
        </div>
        <div class="coreName">J.A.R.V.I.S</div>
        <div class="coreState" id="coreState">voice off</div>
        <div class="coreBtns">
          <button id="micBig">🎙 TALK</button>
          <button id="focusInput">⌨ TYPE</button>
        </div>
      </div>
      <div class="panel" style="height:190px">
        <div class="ptitle">Agent Activity — last 8 runs</div>
        <div class="scroll" id="logStream" style="font-size:12px;color:#79b6df;line-height:1.7"></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="col">
      <div class="panel" style="flex:1;min-height:0">
        <div class="ptitle">Conversation</div>
        <div class="thread scroll" id="thread"></div>
        <div class="ask">
          <span class="p">&gt;</span>
          <input id="ask" placeholder="Ask Jarvis, or say his name" autocomplete="off">
        </div>
      </div>
      <div class="panel" style="flex:none">
        <div class="ptitle">System</div>
        <div id="pipeline"></div>
        <details style="margin-top:8px">
          <summary style="cursor:pointer;font-size:11px;letter-spacing:1px;color:var(--dim)">SPEND &amp; SUBSYSTEMS</summary>
          <div id="spend" style="margin-top:8px"></div>
          <div id="features" style="margin-top:8px"></div>
        </details>
      </div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div class="caps" id="caps"><div class="capwho" id="capwho"></div><div id="captext"></div></div>

<script type="module">
/* Public web config — the endpoint's allowlist is what gates access. */
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyABoM1lgOYUnd5ZadaoTMhYmA9cHa8Tyo0",
  authDomain:"clearsky-portal.firebaseapp.com",
  projectId:"clearsky-portal",
  storageBucket:"clearsky-portal.firebasestorage.app",
  messagingSenderId:"742134484347",
  appId:"1:742134484347:web:ab0f95fd221536158481de"
};
const ENDPOINT = 'https://us-central1-clearsky-portal.cloudfunctions.net/twinChat/status';

const V='https://www.gstatic.com/firebasejs/10.12.5/';
const [appMod,authMod]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js')]);
const app=appMod.getApps().length?appMod.getApp():appMod.initializeApp(FIREBASE_CONFIG);
const auth=authMod.getAuth(app);
const el=id=>document.getElementById(id);

/* Never invent a number. A missing value renders as a dash, so a broken loop
   looks broken instead of looking like 42 degrees. */
const dash='—';
const money=n=>n==null?dash:(n===0?'$0':(n<0.01?'<$0.01':'$'+Number(n).toFixed(2)));
const num=n=>n==null?dash:String(n);
const clock=iso=>{const d=new Date(iso);return isNaN(d)?dash:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};

function rows(host, list){
  host.textContent='';
  for (const [k,v,cls] of list){
    const r=document.createElement('div'); r.className='row';
    const a=document.createElement('span'); a.className='k'; a.textContent=k;
    const b=document.createElement('span'); b.className='v'+(cls?' '+cls:''); b.textContent=v;
    r.appendChild(a); r.appendChild(b); host.appendChild(r);
  }
}

/* ══ THE REACTOR ═════════════════════════════════════════════════════════
   Concentric particle rings whose radius is displaced by summed sines — three
   harmonics at different frequencies and drift rates, which is what produces
   the lobed, breathing shape rather than a circle with noise on it.

   It is driven by real state: `energy` rises with the analyse queue and with
   how recently a loop ran, so a busy twin visibly churns and an idle one
   settles. A decorative animation that looks identical whether the system is
   working or dead is a screensaver. */
const arc = (() => {
  const cv = document.getElementById('arc');
  if (!cv) return { set(){} };
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let energy = 0.15, target = 0.15, t = 0;

  const RINGS = [
    { n: 220, r: 0.86, amp: 0.055, spin: 0.00022, hue: '0,243,255', size: 1.5, a: 0.85 },
    { n: 180, r: 0.74, amp: 0.075, spin: -0.00031, hue: '0,220,210', size: 1.3, a: 0.62 },
    { n: 140, r: 0.62, amp: 0.095, spin: 0.00041, hue: '0,180,190', size: 1.1, a: 0.40 },
    { n: 90,  r: 0.30, amp: 0.130, spin: -0.00055, hue: '0,243,255', size: 1.0, a: 0.22 }
  ];

  function resize() {
    const rect = cv.getBoundingClientRect();
    if (!rect.width || !rect.height) return;     /* still hidden behind the gate */
    W = rect.width; H = rect.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  /* The canvas is measured while the app is still hidden, so it comes back
     0x0 and nothing ever draws. Observing the element covers both that
     transition and ordinary window resizes. */
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  window.addEventListener('resize', resize);
  resize();

  function frame() {
    if (!W || !H) { resize(); requestAnimationFrame(frame); return; }
    t += 1;
    energy += (target - energy) * 0.02;      /* ease, so it never snaps */
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.42;

    for (const ring of RINGS) {
      const spin = t * ring.spin * 1000;
      ctx.beginPath();
      for (let i = 0; i < ring.n; i++) {
        const th = (i / ring.n) * Math.PI * 2 + spin;
        /* three harmonics — the lobes, the wobble, the fine tremor */
        const d = ring.amp * (
            Math.sin(th * 3 + t * 0.006) * 1.0 +
            Math.sin(th * 5 - t * 0.009) * 0.55 +
            Math.sin(th * 11 + t * 0.014) * 0.28
          ) * (0.55 + energy);
        const rr = R * ring.r * (1 + d);
        const x = cx + Math.cos(th) * rr;
        const y = cy + Math.sin(th) * rr;
        const a = ring.a * (0.45 + 0.55 * energy);
        ctx.fillStyle = 'rgba(' + ring.hue + ',' + a.toFixed(3) + ')';
        ctx.fillRect(x, y, ring.size, ring.size);
      }
      ctx.closePath();
    }

    /* core glow */
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.5);
    g.addColorStop(0, 'rgba(0,243,255,' + (0.10 + energy * 0.14).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,243,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.5, 0, Math.PI * 2); ctx.fill();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return { set(v) { target = Math.max(0.12, Math.min(1, v)); } };
})();

/* The dashboard is about the day, not about the machine. Schedule and the
   ranked backlog get the room; spend and subsystem toggles fold away behind a
   summary, because you look at those when something is wrong, not while you
   are working. */
function listInto(host, rows, fmt, empty){
  const b=el(host); if(!b) return;
  b.textContent='';
  if(!rows || !rows.length){
    const d=document.createElement('div'); d.className='row';
    const k=document.createElement('span'); k.className='k'; k.textContent=empty;
    d.appendChild(k); b.appendChild(d); return;
  }
  rows.forEach(r=>{
    const d=document.createElement('div'); d.className='row';
    const a=document.createElement('span'); a.className='k'; a.textContent=fmt(r).left;
    const c=document.createElement('span'); c.className='v'+(fmt(r).cls?' '+fmt(r).cls:'');
    c.textContent=fmt(r).right||'';
    d.appendChild(a); d.appendChild(c); b.appendChild(d);
  });
}

async function load(){
  const u=auth.currentUser; if(!u) return;
  const badge=el('badge');
  try{
    const tok=await u.getIdToken();
    const res=await fetch(ENDPOINT,{headers:{Authorization:'Bearer '+tok}});
    if(res.status===403) throw new Error('ACCOUNT NOT PERMITTED');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const s=await res.json();

    badge.className='status-badge'; badge.textContent='● SYSTEM_ONLINE';

    /* today */
    const nowMs=Date.now();
    listInto('schedule', (s.schedule||[]), e=>{
      const past = e.startsAt && new Date(e.startsAt).getTime() < nowMs;
      return { left: e.when + '  ' + e.title,
               right: e.others ? e.others+'' : '',
               cls: past ? '' : 'cy' };
    }, 'nothing on the calendar');

    listInto('todos', (s.todos||[]), t=>({
      left: t.title || '(untitled)',
      right: (t.size||''), cls:'cy'
    }), 'backlog is empty');

    listInto('drafts', (s.draftList||[]), d=>({
      left: d.subject || '(no subject)',
      right: d.to ? '→' : 'no recipient',
      cls: d.to ? 'good' : 'warn'
    }), 'nothing waiting');

    const ing=s.ingest;
    rows(el('pipeline'), ing ? [
      ['LAST INGEST', clock(ing.at),'cy'],
      ['FETCHED', num(ing.fetched)],
      ['WRITTEN', num(ing.written)],
      ['MEETINGS SEEN', num(ing.meetings)],
      ['MEETINGS', num(s.counts.meetings)],
      ['BACKLOG', num(s.counts.backlog)],
      ['QUEUE', num(s.counts.queued), (s.counts.queued||0)?'warn':'good']
    ] : [['LAST INGEST','no run recorded','bad']]);

    el('alert').textContent='';
    if(ing&&ing.alert){const d=document.createElement('div');d.className='alert';d.textContent=ing.alert;el('alert').appendChild(d);}

    el('queueN').textContent=num(s.counts.queued);
    /* Energy from the work actually outstanding, plus a lift for a loop that
       ran in the last five minutes, so a run visibly registers. */
    const q=s.counts.queued||0;
    const last=s.runs && s.runs[0] && s.runs[0].at ? Date.now()-new Date(s.runs[0].at).getTime() : 1e9;
    if(!audioOwns) arc.set(Math.min(1, q/12) + (last<300000?0.35:0) + 0.12);

    rows(el('spend'), [
      ['PER DAY', money(s.spend.perDay),'cy'],
      ['PER MONTH', money(s.spend.perMonth)],
      ['TO DATE', money(s.spend.measuredToDate),'good']
    ]);

    rows(el('features'), s.features.map(f=>[
      f.label.toUpperCase(),
      f.blocked?'BLOCKED':(f.enabled?'ON '+money(f.perDay):'OFF'),
      f.blocked?'bad':(f.enabled?'good':'')
    ]));

    const log=el('logStream'); log.textContent='';
    if(!s.runs.length){log.textContent='no runs recorded';}
    s.runs.slice().reverse().forEach(r=>{
      const line=document.createElement('div');
      const t=document.createElement('span'); t.className='t'; t.textContent='['+clock(r.at)+'] ';
      line.appendChild(t);
      const body=document.createElement('span');
      if(r.errors){body.className='e';}
      body.textContent=r.loop.toUpperCase()+(r.detail?' — '+r.detail:'')+
                       (r.costUsd?'  '+money(r.costUsd):'')+
                       (r.errors?'  '+r.errors+' error(s)':'');
      line.appendChild(body); log.appendChild(line);
    });
    log.scrollTop=log.scrollHeight;

    el('foot').textContent='LAST READ '+new Date(s.now).toLocaleTimeString()+
      '  ·  every figure measured, none simulated';
  }catch(e){
    badge.className='status-badge err'; badge.textContent='● '+e.message;
  }
}

/* ══ VOICE ═══════════════════════════════════════════════════════════════
   Same twin, same endpoint. The difference here is that the reactor already
   on screen becomes the level meter: while listening or speaking its energy
   comes from live amplitude instead of queue depth, and reverts the moment
   the audio stops. One object doing two jobs beats a second orb competing
   with it for attention. */
const CHAT = 'https://us-central1-clearsky-portal.cloudfunctions.net/twinChat';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE = /\bjarvis\b/i;
let rec=null, listening=false, awake=false, speaking=false, audioOwns=false;
/* After he answers, the conversation stays open briefly. A real exchange has
   follow-ups, and making you say his name before every one of them is the
   difference between talking to someone and operating a machine. Silence past
   the window ends the turn — which is also what stops him answering the room. */
const FOLLOW_MS = 14000;
let followUntil = 0, followTimer = null;
let actx=null, micStream=null, meterStop=null;

function caps(who, text, isAwake){
  el('caps').classList.add('on');
  el('capwho').textContent = who;
  el('capwho').className = 'capwho' + (isAwake?' awake':'');
  el('captext').textContent = text || '';
}
function capsOff(){ el('caps').classList.remove('on'); }

function ctxOf(){
  if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }
  if(actx&&actx.state==='suspended') actx.resume().catch(()=>{});
  return actx;
}
function meter(node){
  const c=ctxOf(); if(!c) return null;
  const an=c.createAnalyser(); an.fftSize=1024; node.connect(an);
  const buf=new Uint8Array(an.fftSize); let alive=true; audioOwns=true;
  (function poll(){
    if(!alive) return;
    an.getByteTimeDomainData(buf);
    let sum=0; for(let i=0;i<buf.length;i++) sum+=Math.abs(buf[i]-128);
    arc.set(Math.min(1,(sum/buf.length)/30));
    requestAnimationFrame(poll);
  })();
  return ()=>{ alive=false; audioOwns=false; try{node.disconnect(an);}catch(_){} };
}

async function token(){ const u=auth.currentUser; return u?u.getIdToken():null; }

async function speakReply(text){
  speaking=true; try{ if(rec) rec.stop(); }catch(_){}
  try{
    const t=await token();
    const r=await fetch(CHAT+'/speak',{method:'POST',
      headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify({text})});
    if(!r.ok) throw new Error('speak '+r.status);
    const url=URL.createObjectURL(await r.blob());
    const a=new Audio(url); let stop=null;
    try{ const c=ctxOf(); if(c){ const src=c.createMediaElementSource(a); src.connect(c.destination); stop=meter(src);} }catch(_){}
    await new Promise(d=>{ a.onended=a.onerror=d; a.play().catch(d); });
    if(stop) stop();
    URL.revokeObjectURL(url);
  }catch(e){ console.warn('[jarvis] voice out:', e.message); }
  finally{ speaking=false; if(listening){ try{rec.start();}catch(_){} } }
}

async function ask(said){
  await submit(said);
  awake=false;
  if(!listening) return;
  /* open the follow-up window */
  followUntil = Date.now() + FOLLOW_MS;
  caps('STILL LISTENING — follow up, or stay quiet', '', true);
  coreState('still listening…', true);
  clearTimeout(followTimer);
  followTimer = setTimeout(()=>{
    if(!listening || Date.now() < followUntil) return;
    caps('LISTENING — say “Jarvis”','',false);
    coreState('listening — say “Jarvis”', false);
  }, FOLLOW_MS + 200);
}

function startVoice(){
  if(!SR){ alert('Voice needs Chrome.'); return; }
  rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='en-US';
  rec.onresult=ev=>{
    if(speaking) return;
    let interim='', final='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal) final+=t; else interim+=t;
    }
    const heard=(final||interim).trim();

    /* Inside the follow-up window, treat speech as continuation — no wake
       word. Two characters of noise is not a follow-up, so require something
       that could plausibly be a sentence. */
    if(!awake && Date.now() < followUntil && heard.length > 3 && !WAKE.test(heard)){
      caps('FOLLOW-UP', heard, true); coreState('go on…', true);
      if(final){ followUntil = 0; ask(heard); }
      return;
    }

    if(!awake){
      if(WAKE.test(heard)){
        awake=true;
        const after=heard.replace(/^.*?\bjarvis\b[\s,.:-]*/i,'').trim();
        caps('AWAKE — go ahead', after, true); coreState('awake — go ahead', true);
        if(final&&after) ask(after);
      } else caps('LISTENING — say “Jarvis”', heard, false);
      return;
    }
    caps('AWAKE — go ahead', heard, true);
    if(final&&heard) ask(heard);
  };
  rec.onerror=e=>{ if(e.error==='not-allowed'){ alert('Chrome blocked the microphone.'); stopVoice(); } };
  rec.onend=()=>{ if(listening&&!speaking){ try{rec.start();}catch(_){} } };
  rec.start(); listening=true;
  el('mic').classList.add('on'); el('mic').textContent='🎙 LISTENING';
  el('micBig').classList.add('on'); el('micBig').textContent='⏹ STOP';
  coreState('listening — say “Jarvis”', false);
  caps('LISTENING — say “Jarvis”','',false);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
      micStream=st; const c=ctxOf(); if(c) meterStop=meter(c.createMediaStreamSource(st));
    }).catch(()=>{});
  }
}
function stopVoice(){
  listening=false; awake=false; followUntil=0; clearTimeout(followTimer);
  if(meterStop){ meterStop(); meterStop=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  try{ if(rec) rec.stop(); }catch(_){}
  el('mic').classList.remove('on'); el('mic').textContent='🎙 VOICE OFF';
  el('micBig').classList.remove('on'); el('micBig').textContent='🎙 TALK';
  coreState('voice off', false);
  capsOff(); load();
}
/* ---- conversation ---- */
function coreState(text, awakeNow){
  const e=el('coreState'); if(!e) return;
  e.textContent=text; e.className='coreState'+(awakeNow?' awake':'');
}
function say(role, text, cost){
  const box=el('thread'); if(!box) return null;
  const d=document.createElement('div');
  d.className='msg '+(role==='you'?'you':'jarvis');
  d.textContent=text;
  const m=document.createElement('div'); m.className='meta';
  m.textContent=[new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),
                 cost!=null?money(cost):''].filter(Boolean).join('  ·  ');
  d.appendChild(m); box.appendChild(d); box.scrollTop=box.scrollHeight;
  return d;
}
async function loadThread(){
  try{
    const t=await token(); if(!t) return;
    const r=await fetch(CHAT,{headers:{Authorization:'Bearer '+t}});
    if(!r.ok) return;
    const j=await r.json();
    const box=el('thread'); box.textContent='';
    (j.messages||[]).slice(-30).forEach(m=>say(m.role, m.text, m.costUsd));
  }catch(_){}
}

/* One path for typed and spoken. A second code path for the keyboard is how
   the two drift until only one of them works. */
async function submit(said){
  said=(said||'').trim(); if(!said) return;
  say('you', said);
  coreState('thinking…', false);
  const pending=say('jarvis','…');
  try{
    const t=await token();
    const r=await fetch(CHAT,{method:'POST',
      headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify({message:said})});
    const j=await r.json().catch(()=>({}));
    const reply=r.ok?(j.reply||'No answer.'):(j.error||('HTTP '+r.status));
    pending.remove(); say('jarvis', reply, j.costUsd);
    caps('JARVIS', reply, false);
    if(r.ok && listening) await speakReply(reply);
    load();
  }catch(e){ pending.remove(); say('jarvis', e.message); }
  coreState(listening?'listening — say “Jarvis”':'voice off', false);
}

el('ask').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value; e.target.value=''; submit(v); }
});
el('focusInput').addEventListener('click',()=>el('ask').focus());
el('micBig').addEventListener('click',()=>listening?stopVoice():startVoice());
el('mic').addEventListener('click',()=>listening?stopVoice():startVoice());

el('refresh').addEventListener('click',load);
el('signin').addEventListener('click',async()=>{
  try{await authMod.signInWithPopup(auth,new authMod.GoogleAuthProvider());}
  catch(e){el('gateErr').textContent=e.message;}
});

authMod.onAuthStateChanged(auth,u=>{
  el('gate').hidden=!!u;
  el('app').hidden=!u;
  el('app').style.display = u ? 'flex' : 'none';
  if(u){ load(); loadThread(); setInterval(load,30000); }
});
</script>
