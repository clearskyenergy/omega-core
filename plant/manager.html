<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant manager</title><link rel="stylesheet" href="/omega-logic-theme.css"><style>body{margin:0}header{padding:22px 4%;display:flex;justify-content:space-between}main{min-width:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 18px;border:1px solid var(--line);background:white}input,select,textarea{width:100%}textarea{min-height:85px}td button{white-space:nowrap}.flow-step{padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.flow-step button{margin:8px 4px 0 0}.line-row{display:grid;grid-template-columns:1fr 2fr 2fr;gap:10px;margin:10px 0}.note{font-size:12px;color:var(--ink2)}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:750px){.two,.line-row{grid-template-columns:1fr}}</style></head><body class="logic-theme"><header><b data-brand-name>Plant manager</b><a id="office">Order office</a></header><div class="logic-shell"><nav class="logic-nav" aria-label="Plant"><p class="eyebrow">Production</p><a href="#overview">Plant overview</a><a href="#works">Work orders</a><a href="#stations">Station screens</a><a id="materials">Materials plan</a><a href="#flow" id="flow-link" hidden>Production flow</a><a id="records">Serial records & quality</a></nav><main class="logic-main"><h1>Plant manager</h1><p>Every line, work order and station in one workspace. Edits are audited; scan history and machine evidence remain unchanged.</p><p id="status" class="logic-status" role="status">Checking access…</p><div id="content"></div><section id="detail" class="panel" hidden></section></main></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="/config.js"></script><script src="/omega-brand.js"></script><script src="/omega-tenant.js"></script><script src="/omega-logic-theme.js"></script><script>
(function(){'use strict';var cfg=window.CLEARSKY_CONFIG||{};if(!firebase.apps.length)firebase.initializeApp(cfg.firebase||cfg);var auth=firebase.auth(),org=new URLSearchParams(location.search).get('org')||'',base='?org='+encodeURIComponent(org),data=null,cache={works:[],units:[],stations:[]},next={},loaded={};
function $(id){return document.getElementById(id);}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function error(e){$('status').textContent=e.message||String(e);}
$('office').href='/omega-logic'+base;$('materials').href='/logic-materials.html'+base;$('records').href='/plant'+base;
var unitLink=document.createElement('a');unitLink.href='#units';unitLink.textContent='All units';$('records').before(unitLink);
function api(body,query){if(!auth.currentUser)return Promise.reject(new Error('Sign in through your office account.'));return auth.currentUser.getIdToken().then(function(t){return fetch('/api/logic-plant'+(body?'':base+(query||'')),{method:body?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(Object.assign({org:org},body)):undefined});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error);return d;});});}
function page(kind,more){return api(null,'&page='+kind+(more&&next[kind]?'&after='+encodeURIComponent(next[kind]):'')).then(function(d){cache[kind]=more?cache[kind].concat(d.rows):d.rows;next[kind]=d.next;loaded[kind]=true;});}
function options(value){return data.flow.lines.map(function(l){return '<option value="'+esc(l.id)+'"'+(value===l.id?' selected':'')+'>'+esc(l.name)+'</option>';}).join('');}
function linesOverview(){return '<section class="panel"><h2>Lines</h2>'+data.flow.lines.map(function(l){var count=cache.works.filter(function(w){return w.lineId===l.id;}).length;return '<p><strong>'+esc(l.name)+'</strong> · '+esc(l.location)+' · '+count+' loaded work orders</p>';}).join('')+'<p class="note">Counts cover loaded records. Load further pages in Work orders to include older jobs.</p></section>';}
function draw(){if(!data)return;var view=location.hash.slice(1)||'overview';$('detail').hidden=true;document.querySelectorAll('.logic-nav a').forEach(function(a){if(a.hash)a.setAttribute('aria-current',a.hash==='#'+view?'page':'false');});
if(view==='units'){drawUnits();return;}
if(view==='flow'){if(!data.owner){$('content').textContent='Only the ClearSky owner can publish production templates.';return;}drawFlow();return;}
if(view==='overview'){$('content').innerHTML=linesOverview()+'<section class="panel"><h2>Live floor</h2><p>'+cache.units.length+' loaded units · '+cache.units.filter(function(u){return !!u.hold;}).length+' on hold</p><p>Use Serial records & quality to review genealogy, measurements, holds and disposition.</p><button id="refresh">Refresh plant</button></section>';$('refresh').onclick=function(){start().catch(error);};return;}
var kind=view==='stations'?'stations':'works',rows=cache[kind];$('content').innerHTML='<section class="panel"><h2>'+ (kind==='stations'?'Station screens':'Work orders')+'</h2><label>Find in loaded records<input id="filter" placeholder="Line, ID, order or station"></label><div class="logic-scroll"><table class="logic-table"><thead><tr><th>Record</th><th>Line / state</th><th>Action</th></tr></thead><tbody id="list"></tbody></table></div><button id="more" '+(!next[kind]?'hidden':'')+'>Load next 100</button><p class="note">'+rows.length+' records loaded'+(next[kind]?' · more available':' · end of list')+'</p>'+(kind==='stations'?'<p><a href="/plant'+base+'">Create a station credential</a>. Open its station screen on the tablet, then pair it once. Never put pairing tokens in website links.</p>':'')+'</section>';
function list(){var query=$('filter').value.toLowerCase();$('list').innerHTML=rows.filter(function(r){return JSON.stringify([r.id,r.lineId,r.orderNo,r.label,r.status]).toLowerCase().indexOf(query)>=0;}).map(function(r){return '<tr><td>'+esc(r.orderNo||r.label||r.id)+'<br><small>'+esc(r.id)+'</small></td><td>'+esc(r.lineId||'Unassigned')+' · '+esc(kind==='stations'?(r.active?'Active':'Disabled'):r.status)+'</td><td><button data-id="'+esc(r.id)+'">Manage</button></td></tr>';}).join('');document.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){(kind==='stations'?station(rows.filter(function(r){return r.id===b.dataset.id;})[0]):work(b.dataset.id)).catch(error);};});}list();$('filter').oninput=list;$('more').onclick=function(){page(kind,true).then(draw).catch(error);};}
function commit(body){$('status').textContent='Saving…';return api(body).then(function(){ $('status').textContent='Saved and audited.';return Promise.all([page('works'),page('stations')]);}).then(draw).catch(error);}
function drawUnits(){var rows=cache.units;$('content').innerHTML='<section class="panel"><h2>All units</h2><label>Find in loaded records<input id="unit-filter" placeholder="Serial, SKU or work order"></label><div id="unit-list"></div><button id="unit-more" '+(!next.units?'hidden':'')+'>Load next 100</button><p>'+rows.length+' records loaded'+(next.units?' · more available':' · end of list')+'</p></section>';function list(){var q=$('unit-filter').value.toLowerCase();$('unit-list').innerHTML=rows.filter(function(u){return [u.serial,u.sku,u.woId].join(' ').toLowerCase().indexOf(q)>=0;}).map(function(u){return '<p><a href="/plant'+base+'&serial='+encodeURIComponent(u.serial)+'">'+esc(u.serial)+'</a> · '+esc(u.sku)+' · '+esc(u.woId)+' · '+esc(u.at||'Not started')+(u.hold?' · HOLD':'')+'</p>';}).join('');}list();$('unit-filter').oninput=list;$('unit-more').onclick=function(){page('units',true).then(draw).catch(error);};}
function work(id){return api(null,'&workOrder='+encodeURIComponent(id)).then(function(d){var w=d.workOrder;$('detail').hidden=false;$('detail').innerHTML='<h2>'+esc(w.orderNo||w.id)+'</h2><p>Flow version '+esc(w.flowVersion||0)+' · '+esc(w.status)+'</p><div class="two"><label>Line<select id="w-line">'+options(w.lineId)+'</select></label><label>Priority<select id="w-priority"><option>normal</option><option>urgent</option><option>low</option></select></label><label>Target date<input id="w-due" type="date" value="'+esc(w.dueDate||'')+'"></label></div><label>Manager notes<textarea id="w-notes">'+esc(w.managerNotes||'')+'</textarea></label><button id="w-save">Save work-order details</button><h3>Routing</h3><p>'+esc((w.routing||[]).map(function(s){return s.label||s.key;}).join(' → '))+'</p><h3>Units</h3>'+d.units.map(function(u){return '<p><a href="/plant'+base+'&serial='+encodeURIComponent(u.serial)+'">'+esc(u.serial)+'</a> · '+esc(u.at||'Not started')+(u.hold?' · HOLD':'')+'</p>';}).join('')+(d.limited?'<p>First 400 units shown. Use exact serial lookup for further units.</p>':'');$('w-priority').value=w.priority||'normal';$('w-save').onclick=function(){commit({action:'work-order',workOrderId:id,revision:w.managerRevision||0,lineId:$('w-line').value,priority:$('w-priority').value,dueDate:$('w-due').value,notes:$('w-notes').value});};$('detail').scrollIntoView({block:'start'});});}
function station(s){$('detail').hidden=false;$('detail').innerHTML='<h2>'+esc(s.label)+'</h2><p>Bound operation: '+esc(s.station)+(s.machine?' · Machine evidence only':' · Arrival scanner')+'</p><div class="two"><label>Screen title<input id="s-label" value="'+esc(s.label)+'"></label><label>Line<select id="s-line">'+options(s.lineId)+'</select></label><label>Location / workspace<input id="s-location" value="'+esc(s.location)+'"></label><label>State<select id="s-active"><option value="true">Active</option><option value="false">Disabled</option></select></label></div><label>Screen instructions<textarea id="s-instructions">'+esc(s.instructions)+'</textarea></label><button id="s-save">Save station</button><p><a target="_blank" rel="noopener" href="/plant/station?stationId='+encodeURIComponent(s.id)+'">Open station screen ↗</a></p><p class="note">Instructions refresh on the screen every minute. Work-order-specific instructions take precedence when a unit arrives. Operation binding cannot be changed; create another station for a different operation.</p>';$('s-active').value=String(s.active);$('s-save').onclick=function(){commit({action:'station-edit',stationId:s.id,revision:s.revision,lineId:$('s-line').value,label:$('s-label').value,location:$('s-location').value,instructions:$('s-instructions').value,active:$('s-active').value==='true'});};$('detail').scrollIntoView({block:'start'});return Promise.resolve();}
function materialsFor(id){return auth.currentUser.getIdToken().then(function(t){return fetch('/api/logic-materials'+base+'&workOrder='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+t}});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error);return d;});});}
var openWorkM=work;work=function(id){return openWorkM(id).then(function(){return materialsFor(id);}).then(function(m){var section=document.createElement('section');var head='<h3>Materials</h3>';
  if(!m.hasBom)section.innerHTML=head+'<p class="note">No bill of materials on this work order\'s products yet — add components and bills in the <a href="/logic-catalog.html'+base+'">product catalog</a> to see whether it can be built from stock.</p>';
  else if(m.feasible)section.innerHTML=head+'<p>Every component is on hand or on order for this work order, taken on its own. <a href="/logic-materials.html'+base+'">Open the materials plan</a> to see it against everything else in the queue.</p>';
  else section.innerHTML=head+'<p>Short of '+m.short.length+' component'+(m.short.length===1?'':'s')+' on its own (other open work is not competing in this view):</p><div class="logic-scroll"><table class="logic-table"><thead><tr><th>Component</th><th>Short</th><th>On hand</th><th>On order</th><th>Order by</th></tr></thead><tbody>'+m.short.map(function(c){return '<tr><td>'+esc(c.sku)+'<br><small>'+esc(c.name)+'</small></td><td>'+esc(c.short)+' '+esc(c.unit)+'</td><td>'+esc(c.onHand)+'</td><td>'+esc(c.onOrder)+'</td><td>'+(c.orderBy?esc(c.orderBy)+(c.late?' · <b>late</b>':''):'—')+'</td></tr>';}).join('')+'</tbody></table></div><p><a href="/logic-materials.html'+base+'">Open the materials plan →</a></p>';
  $('detail').appendChild(section);}).catch(function(e){var section=document.createElement('section');section.innerHTML='<h3>Materials</h3><p class="note">'+esc(e.message)+'</p>';$('detail').appendChild(section);});};
var openWork=work;work=function(id){return openWork(id).then(function(){return api(null,'&workOrder='+encodeURIComponent(id));}).then(function(d){var w=d.workOrder;if(!(w.serviceRequirements||[]).length)return;var section=document.createElement('section');section.innerHTML='<h3>Services</h3>'+w.serviceRequirements.map(function(s){return '<p>'+esc(s.qty)+' × '+esc(s.name||s.sku)+'</p>';}).join('');if(w.serviceCompletion){section.innerHTML+='<p>Completion recorded by '+esc(w.serviceCompletion.by)+' · '+esc(w.serviceCompletion.at)+'</p><p>'+esc(w.serviceCompletion.evidence)+'</p>';}else{section.innerHTML+='<label>Completion evidence<textarea id="service-evidence" placeholder="Work performed, acceptance record or document reference"></textarea></label><button id="service-complete">Record services completed</button>';} $('detail').appendChild(section);if($('service-complete'))$('service-complete').onclick=function(){if(confirm('Record all listed services as completed? This creates an immutable audit entry.'))commit({action:'services-complete',workOrderId:id,evidence:$('service-evidence').value});};});};
function drawFlow(){var f=JSON.parse(JSON.stringify(data.flow));$('content').innerHTML='<section class="panel"><h2>Production flow · version '+f.version+'</h2><p>Publishing applies to new work orders only. Existing work orders keep their routing and parameter snapshot. EOL, QA, Pack and Ready remain mandatory quality gates.</p><h3>Lines / locations</h3><div id="lines"></div><button id="add-line">Add line</button><h3>Ordered operations</h3><div id="steps"></div><button id="add-step">Add operation</button><button id="publish">Publish next version</button></section>';
function render(){ $('lines').innerHTML=f.lines.map(function(l,i){return '<div class="line-row"><input aria-label="Line ID" data-line="'+i+'" data-key="id" value="'+esc(l.id)+'"><input aria-label="Line name" data-line="'+i+'" data-key="name" value="'+esc(l.name)+'"><input aria-label="Line location" data-line="'+i+'" data-key="location" value="'+esc(l.location||'')+'"></div>';}).join('');$('steps').innerHTML=f.routing.map(function(s,i){return '<div class="flow-step"><div class="two"><label>Stable operation key<input data-step="'+i+'" data-key="key" value="'+esc(s.key)+'"></label><label>Screen label<input data-step="'+i+'" data-key="label" value="'+esc(s.label)+'"></label></div><label>Work instructions<textarea data-step="'+i+'" data-key="instructions">'+esc(s.instructions||'')+'</textarea></label><label>Parameters / acceptance instructions<textarea data-step="'+i+'" data-key="parameters">'+esc(s.parameters||'')+'</textarea></label><button data-move="'+i+'" data-direction="-1">↑ Up</button><button data-move="'+i+'" data-direction="1">↓ Down</button><button data-remove="'+i+'">Remove step</button></div>';}).join('');
document.querySelectorAll('[data-line],[data-step]').forEach(function(e){e.oninput=function(){var list=e.hasAttribute('data-step')?f.routing:f.lines,index=Number(e.getAttribute(e.hasAttribute('data-step')?'data-step':'data-line'));list[index][e.dataset.key]=e.value;};});document.querySelectorAll('[data-move]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.move),j=i+Number(b.dataset.direction);if(j<0||j>=f.routing.length)return;var s=f.routing.splice(i,1)[0];f.routing.splice(j,0,s);render();};});document.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){f.routing.splice(Number(b.dataset.remove),1);render();};});}
render();$('add-line').onclick=function(){f.lines.push({id:'line_'+(f.lines.length+1),name:'New line',location:''});render();};$('add-step').onclick=function(){f.routing.splice(Math.max(0,f.routing.length-1),0,{key:'operation_'+f.routing.length,label:'New operation',instructions:'',parameters:''});render();};$('publish').onclick=function(){if(!confirm('Publish this flow for future work orders? Existing work orders will not change.'))return;api({action:'flow',version:data.flow.version,flow:f}).then(function(d){data.flow=d.flow;$('status').textContent='Production flow published and audited.';draw();}).catch(error);};}
function start(){return api().then(function(d){data=d;OmegaLogicTheme.apply(d.brand);$('flow-link').hidden=!d.owner;return Promise.all([page('works'),page('units'),page('stations')]);}).then(function(){$('status').textContent='';draw();});}window.addEventListener('hashchange',draw);auth.onAuthStateChanged(function(u){data=null;$('content').textContent='';$('detail').hidden=true;if(u)start().catch(error);else $('status').textContent='Sign in through your Omega Logic office to open the plant manager.';});})();
</script></body></html>
