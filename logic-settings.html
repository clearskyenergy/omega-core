<!doctype html>
<!-- © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.
     logic-settings.html — every setting the office can see, in one place,
     with what it means and who changes it. Nothing is edited here that has
     its own page: this page points at the page and says why. -->
<html lang="en"><head><meta charset="utf-8"><script src="/omega-splash.js?v=1"></script>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="/omega-logic-theme.css"><style>body{margin:0}header{padding:22px 4%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}main{min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:16px 0}.card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:white}.card h3{margin:0 0 6px}.card p{margin:6px 0;font-size:14px;color:var(--ink2)}.card .who{font-size:12px;color:var(--ink3)}.card a.go{display:inline-block;margin-top:8px;font-weight:600}.card b.v{font-size:20px}.kv{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}.kv span{font-size:13px;color:var(--ink2)}.kv span b{display:block;font-size:18px;color:var(--ink)}</style></head><body class="logic-theme"><header><b data-product-name>Settings</b><span><a id="office">Office</a></span></header><div class="logic-shell"><nav class="logic-nav" aria-label="Settings"></nav><main class="logic-main"><h1>Settings</h1><p>Everything that shapes how this workspace runs. Each card says what the setting does and who changes it; the link opens the page where it lives.</p><p id="status" class="logic-status" role="status">Checking access…</p><div id="content"></div></main></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="/config.js"></script><script src="/omega-brand.js"></script><script src="/omega-tenant.js"></script><script src="/omega-logic-theme.js"></script><script>
(function(){'use strict';var org=new URLSearchParams(location.search).get('org')||'',cfg=window.CLEARSKY_CONFIG||{};if(!firebase.apps.length)firebase.initializeApp(cfg.firebase||cfg);var auth=firebase.auth();function $(id){return document.getElementById(id);}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var q='?org='+encodeURIComponent(org);($('office')||{}).href='/omega-logic'+q;
function api(){return auth.currentUser.getIdToken().then(function(t){return fetch('/api/logic-office'+q,{headers:{Authorization:'Bearer '+t}});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Request failed');return d;});});}
function card(title,meaning,who,href,linkText,extra){return '<div class="card"><h3>'+esc(title)+'</h3><p>'+meaning+'</p>'+(extra||'')+'<p class="who">'+esc(who)+'</p>'+(href?'<a class="go" href="'+esc(href)+'">'+esc(linkText||'Open')+' →</a>':'')+'</div>';}
function draw(d){var t=d.config.terms||{},owner=d.owner;
  $('content').innerHTML='<h2>Your business</h2><div class="cards">'
  +card('Company & brand','The name and colours your customers see — the customer app and portal, Editor Lite and the website sizer. The office, the plant app and the bench tablets are Omega Logic’s own.','ClearSky sets these under your white-label contract. Ask ClearSky to change them.',owner?'/omega-logic'+q+'#tenant-theme':null,'Tenant theme','<div class="kv"><span>Name<b>'+esc((d.brand&&d.brand.name)||d.name)+'</b></span><span>Workspace<b>'+esc(d.org)+'</b></span><span>Status<b>'+(d.active?'Enabled':'Setup required')+'</b></span></div>')
  +card('Customer terms','The default deposit and payment-due days applied when an order is priced. A customer account can carry its own terms, which win for that customer’s future orders.','Defaults: ClearSky. Per-customer terms: you, under Customers → the account → Terms.','/portals/customer/admin.html'+q,'Customers','<div class="kv"><span>Default deposit<b>'+esc(t.depositPct)+'%</b></span><span>Due<b>'+(Number(t.dueDays)?esc(t.dueDays)+' days':'on receipt')+'</b></span></div>')
  +card('People','Who works in this workspace: your office and plant staff, each as owner, administrator, member or viewer. Nobody is deleted; a person who leaves is turned off, and the workspace always keeps an active owner.','Your owner or an administrator, on Team (an administrator never changes an owner).','/logic-team.html'+q,'Team')
  +card('Products & bills of materials','Your product list: what you sell, what each product is made of, and which bench fits each part. One list feeds the storefront, the materials plan and the bench screens.','You. Components and bills are never published.','/logic-catalog.html'+q,'Products & bills')
  +card('Vendors, prices & safety stock','Who you buy each part from, at what price, minimum order and lead time; and how much of each part to keep on the shelf. Prices live only here — never in the product list or a spreadsheet you send anyone.','You, under Materials plan → Suppliers.','/logic-materials.html'+q+'#suppliers','Vendors & prices')
  +'</div><h2>Your plant</h2><div class="cards">'
  +card('Production flow','The operations every unit goes through, in order, with work instructions and check-only steps per operation; and your lines. Work orders keep the flow they were released with.','ClearSky publishes changes with you; you can read the current flow on the plant board.','/plant/manager.html'+q+'#flow','Production flow')
  +card('Stations & tablets','One paired tablet per bench. Create a station credential, open the station screen on the tablet and pair it once; a lost tablet is disabled here.','You (a plant administrator).','/plant/manager.html'+q+'#stations','Station screens')
  +card('Quality holds','Who may place or release a quality hold on a unit, and the rule that a failed machine test needs a passing retest before the unit moves.','Plant administrators, under Quality & holds on the plant board.','/plant/manager.html'+q+'#quality','Quality & holds')
  +'</div><h2>Your subscription</h2><div class="cards">'
  +card('Omega Logic bundle','What your subscription includes: '+esc((d.bundle&&d.bundle.included||[]).join(', '))+'. '+((d.config&&d.config.accounting)==='tenant'?'Your company invoices its customers on its own paper; Omega Logic adds no processing fee to their orders.':'ClearSky invoices your orders from its QuickBooks; its processing fee is added to each order’s customer total and shown on the invoice.'),(d.bundle&&d.bundle.subscriptionDue?'Next subscription due '+esc(String(d.bundle.subscriptionDue).slice(0,10))+'. ':'')+'Billing questions go to ClearSky.',owner?'/account-settings.html':null,'Account')
  +'</div>'+(owner?'<h2>ClearSky only</h2><div class="cards">'
  +card('Accounting & fees','QuickBooks connection, the installment item, the added processing fee, and whether accounting has approved the setup.','ClearSky owner.','/omega-logic'+q,'Office settings panel')
  +card('Website & installation','The customer-facing storefront on the tenant’s own site: catalog publishing, branding, the embed snippet and publishable key.','ClearSky maintains this for the tenant.','/whitelabel-setup.html'+q,'Website installation')
  +card('Links & QR codes','Every URL a tenant hands out — storefront, portal, PO inbox, bench pairing — generated in one place.','ClearSky.','/logic-urls.html'+q,'URL generator')
  +'</div>':'');}
auth.onAuthStateChanged(function(u){$('content').textContent='';if(!u){$('status').textContent='Sign in through your office to open settings.';return;}if(!org){$('status').textContent='Open settings from your office workspace.';return;}
  api().then(function(d){OmegaLogicTheme.chrome({org:org,current:'settings',owner:d.owner,team:!!(d.access&&d.access.team),parts:d.access&&d.access.parts,brand:d.brand,who:u.email});$('status').textContent='';draw(d);})['catch'](function(e){$('status').textContent=e.message;});});})();
</script></body></html>
