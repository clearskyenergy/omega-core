<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logistics and receiving</title><link rel="stylesheet" href="/omega-logic-theme.css"><style>body{margin:0}header{padding:24px 4%;display:flex;justify-content:space-between}main{max-width:1100px;padding:30px;margin:auto}section{padding:22px;margin:20px 0;border:1px solid var(--line);border-radius:14px}label{display:block;margin:12px 0}input,select,textarea{width:100%}button{padding:10px 18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}small{display:block}#status{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body class="logic-theme"><header><b data-product-name>Omega Logic</b><a id="back">Office</a></header><main><h1>Logistics and receiving</h1><p>Record the actual carrier, shipping-unit serials, handoffs and receiving condition. This ledger does not book a carrier or provide live GPS tracking.</p><p id="status" role="status">Checking office access…</p><div id="workspace" hidden><label>Order<select id="order"></select></label><div id="detail"></div></div></main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="/config.js"></script><script src="/omega-brand.js"></script><script src="/omega-tenant.js"></script><script src="/omega-logic-theme.js"></script><script>
(function(){'use strict';var org=new URLSearchParams(location.search).get('org')||'',cfg=window.CLEARSKY_CONFIG||{},data=null,busy=false,epoch=0;if(!firebase.apps.length)firebase.initializeApp(cfg.firebase||cfg);var auth=firebase.auth();function $(id){return document.getElementById(id);}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}($('back')||{}).href='/omega-logic?org='+encodeURIComponent(org);
function api(b){if(!auth.currentUser)return Promise.reject(new Error('Sign in through the office first'));return auth.currentUser.getIdToken().then(function(t){return fetch('/api/logic-logistics'+(b?'':'?org='+encodeURIComponent(org)),{method:b?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Request failed');return d;});});}
function selected(){return data&&data.orders.filter(function(o){return o.id===$('order').value;})[0];}function fail(e){$('status').textContent=e.message||String(e);}
function load(){var e=epoch,old=$('order').value;return api().then(function(d){if(e!==epoch)return;data=d;OmegaLogicTheme.chrome({org:org,current:'shipping',owner:d.owner,brand:d.brand,who:auth.currentUser&&auth.currentUser.email});$('workspace').hidden=false;$('order').innerHTML=d.orders.map(function(o){return '<option value="'+esc(o.id)+'">'+esc(o.orderNo)+' · '+esc(o.poNumber||'legacy order')+'</option>';}).join('');if(d.orders.some(function(o){return o.id===old;}))$('order').value=old;$('status').textContent=d.notice+(d.limited?' Showing latest 100 orders.':'');render();});}
function render(){var o=selected();if(!o){$('detail').textContent='No orders yet.';return;}if(!o.destinations.length){$('detail').textContent='This legacy order needs a reviewed destination plan. Use its existing order workflow; no allocation is inferred.';return;}
$('detail').innerHTML='<section><h2>Destinations</h2>'+o.destinations.map(function(d){return '<p><b>'+esc(d.id)+' · '+esc(d.address.name)+'</b><br>'+esc(d.address.line1)+', '+esc(d.address.city)+'<br>'+d.items.map(function(i){return esc(i.qty)+' × '+esc(i.sku);}).join('; ')+'</p>';}).join('')+'</section><div class="grid"><section><h2>Plan a shipment leg</h2><form id="plan"><label>Load identifier<input id="leg" required pattern="[A-Za-z0-9_-]{1,120}"></label><label>Destination<select id="destination">'+o.destinations.map(function(d){return '<option value="'+esc(d.id)+'">'+esc(d.address.name)+'</option>';}).join('')+'</select></label><label>Carrier<input id="carrier" required maxlength="120"></label><label>Booking / bill of lading reference<input id="tracking" required maxlength="160"></label><label>Shipping-unit serials separated by commas<textarea id="serials" required></textarea></label><label>Booking evidence reference<textarea id="plan-evidence" required minlength="12" maxlength="1200"></textarea></label><button>Record planned load</button></form></section><section><h2>Record a handoff or inspection</h2><form id="event"><label>Load<select id="event-leg">'+o.legs.map(function(l){return '<option value="'+esc(l.id)+'">'+esc(l.id)+' · '+esc(OmegaLogicTheme.words(l.status))+'</option>';}).join('')+'</select></label><label>Action<select id="action"><option value="pickup">Pickup</option><option value="location">Last confirmed location</option><option value="delivered">Carrier delivered</option><option value="inspect">Receiving inspection</option></select></label><label>Reported location<input id="location" maxlength="200"></label><div id="receipts"></div><label>Evidence reference / inspection details<textarea id="event-evidence" required minlength="12" maxlength="1200"></textarea></label><button '+(!o.legs.length?'disabled':'')+'>Record event</button></form></section></div><section><h2>Loads</h2>'+o.legs.map(function(l){return '<p><b>'+esc(l.id)+' · '+esc(OmegaLogicTheme.words(l.status))+'</b><br>'+esc(l.carrier)+' / '+esc(l.tracking)+'<br>'+esc(l.serials.join(', '))+'<small>Last confirmed location: '+esc((l.lastConfirmedLocation||{}).label||'not reported')+'</small></p>';}).join('')+'</section>';
function receipts(){var l=o.legs.filter(function(x){return x.id===$('event-leg').value;})[0];$('receipts').innerHTML=$('action').value==='inspect'&&l?l.serials.map(function(s){return '<label>'+esc(s)+'<select data-serial="'+esc(s)+'"><option value="">Choose condition</option><option value="accepted">Received intact</option><option value="damaged">Damaged</option><option value="missing">Missing</option></select></label>';}).join(''):'';}$('action').onchange=receipts;$('event-leg').onchange=receipts;
$('plan').onsubmit=function(e){e.preventDefault();submit({action:'plan',legId:$('leg').value,destinationId:$('destination').value,carrier:$('carrier').value,tracking:$('tracking').value,serials:$('serials').value.split(',').map(function(s){return s.trim();}),evidence:$('plan-evidence').value});};$('event').onsubmit=function(e){e.preventDefault();submit({action:$('action').value,legId:$('event-leg').value,location:$('location').value,evidence:$('event-evidence').value,receipts:Array.prototype.map.call($('receipts').querySelectorAll('select'),function(s){return {serial:s.getAttribute('data-serial'),condition:s.value};})});};}
function submit(b){if(busy)return;var o=selected();b.org=org;b.orderId=o.id;b.revision=o.revision;busy=true;$('status').textContent='Saving…';api(b).then(function(r){return load().then(function(){$('status').textContent=(r&&r.note)||(b.action==='plan'?'Recorded: load '+b.legId+' planned.':'Recorded.');});})['catch'](fail).then(function(){busy=false;});}$('order').onchange=render;auth.onAuthStateChanged(function(u){epoch++;data=null;$('detail').textContent='';$('workspace').hidden=true;if(u)load()['catch'](fail);else $('status').textContent='Sign in through the office link, then return here.';});
})();</script></body></html>
