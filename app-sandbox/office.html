<!--
  ═══════════════════════════════════════════════════════════════════════════
  office/app.html — the office in a pocket
  © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.

  Four people run the business — a project manager, a procurement officer,
  a commissioning engineer and the builder — and none of them sits at the
  desk all day. This is the app they install: what needs a person today,
  every order and where it is, a stack of purchase orders keyed in from a
  customer's email while it is still open, each customer's terms and
  balance, and a finished unit assigned to an order from the shelf.

  It is the same office data through the same signed-in endpoints
  (api/logic-office.js, api/logic-plant.js, api/logic-materials.js,
  api/buyers.js, api/po-intake.js). The phone adds nothing a browser could
  not do; it only puts the daily decisions where the person is. Pricing,
  acceptance, shipment and wire settlement stay on the desktop, where the
  QuickBooks evidence is in front of whoever signs.

  Same shape as plant/app.html, on purpose: an org remembered once, a
  bottom tab bar, Omega Logic's manifest and icon on every workspace's phone
  (api/app-manifest.js, app=office), a shell service worker so it opens and says "offline" instead
  of a browser error. Office data is never served from cache.
  ═══════════════════════════════════════════════════════════════════════════
-->

<script>
(function () {

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* ── data ─────────────────────────────────────────────────────────────── */
  function loadAll() {

  function menuPanels() {

    return [
      { key: 'sales', icon: '▤', name: 'Sales & orders', rows: [['go', 'orders', 'Orders', 'Every order, its stage, money and requests'], ['go', 'pos', 'PO loads', 'Key in a stack of customer purchase orders'], ['href', '/po-inbox' + d + '&office=1', 'Company POs', 'Uploaded POs to review and map'], ['href', '/omega-logic' + d, 'Price & accept', 'Approve a price, accept, record shipment']] },

      { key: 'plant', icon: '⚙', name: 'Plant', rows: [['href', '/plant/app' + d, 'Plant app', 'Work orders, units, quality'], ['href', '/app-sandbox/bench', 'Bench scan station', 'Scan a unit in, issue parts, finish steps'], ['href', '/plant/work-orders.html' + d, 'Work orders', 'Progress, holds, what is short'], ['href', '/plant/manager.html' + d, 'Plant board', 'The line, dwell times, the bottleneck']] },
      { key: 'deliver', icon: '◎', name: 'Deliver & sites', rows: [['go', 'sites', 'Sites & custody', 'What the customer says, receive a load, passports'], ['href', '/logic-register.html' + d, 'Fleet register', 'Every unit on one sheet'], ['href', '/logic-logistics.html' + d, 'Shipping & receiving', 'Loads, carriers, BOLs, receipts'], ['href', '/logic-custody.html' + d, 'Sites & imports', 'Sites, spreadsheet import, coverage templates']] },
      { key: 'stock', icon: '▦', name: 'Stock & supply', rows: [['go', 'stock', 'Stock', 'Finished units, parts short, open POs'], ['href', '/logic-materials.html' + d, 'Materials plan', 'What to buy and when'], ['href', '/logic-materials.html' + d + '#po', 'Purchase orders', 'Supplier orders and receipts'], ['href', '/logic-inventory.html' + d, 'Inventory', 'Units on the shelf, assign to orders']] },
      { key: 'money', icon: '$', name: 'Money', rows: [['href', '/omega-logic' + d + '#cash', 'Cash flow', 'Invoiced, received, outstanding'], ['go', 'orders', 'Invoices & payments', 'Record an invoice issued or a payment received on the order']] },
      { key: 'setup', icon: '✎', name: 'Setup', rows: [['href', '/logic-catalog.html' + d, 'Products & bills', 'Catalog, bills of materials, coverage'], ['href', '/logic-settings.html' + d, 'Settings', 'Terms, billing mode, workspace']] },
      { key: 'help', icon: '?', name: 'Help & guides', rows: [['href', '/guides/Omega-Logic-Office-App.pdf', 'Omega Logic app guide', 'Install and use, PDF'], ['href', '/guides/Omega-Logic-Customer-App.pdf', 'Customer app guide', 'Send it to a customer, PDF'], ['href', '/guides/Omega-Logic-Plant-App.pdf', 'Plant app guide', 'For the builders, PDF']] }
    ];
  }
  /* Home opens on the hubs: sign in, pick where you are working. A hub is a

  function hubsHtml() { return '<h1>Where to?</h1><div class="panels" id="hubs">' + menuPanels().map(function (p) { return '<button type="button" class="panel" data-hub="' + p.key + '"><i>' + p.icon + '</i><b>' + esc(p.name) + '</b></button>'; }).join('') + '</div>'; }
  function bindHubs() { Array.prototype.forEach.call(document.querySelectorAll('[data-hub]'), function (b) { b.onclick = function () { MENU_OPEN = b.dataset.hub; TAB = 'menu'; draw(); window.scrollTo(0, 0); }; }); }
  function rowHtml(r) { var inner = '<div><b>' + esc(r[2]) + '</b><small>' + esc(r[3]) + '</small></div><span class="go">›</span>'; return r[0] === 'go' ? '<button type="button" data-go="' + esc(r[1]) + '">' + inner + '</button>' : '<a href="' + esc(r[1]) + '">' + inner + '</a>'; }

    var panels = menuPanels(), f = String(filter || '').toLowerCase().trim();
