<!--
  ═══════════════════════════════════════════════════════════════════════════
  portals/customer/app.html — the customer's account in a pocket
  © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.

  The SUPPLIER's app for the supplier's customer (docs/OMEGA-LOGIC-
  ECOSYSTEM.md): it wears the tenant's name, colours and icon, never ours.
  It opens on the HEX HUB (omega-hexhub.js), the same seven cells the
  supplier's own app opens on, with the customer's words in them:

      centre   Fleet     every unit on the account, its site, where it is
      ring     Size · Design · POs · Pay · Shipping · Warranty

  and under the hub, the way QuickBooks' home does it, three short lists:
  what is arriving, what to pay, and what needs the customer. A badge on a
  cell is a count of things waiting for a person on this account (a unit
  to receive, place or commission; a PO the supplier asked about; an open
  invoice; a load on the road; a warranty waiting for a site), nothing else.

  Tabs: Home · Orders · POs · Fleet · Account. The other hubs are reached
  from Home and carry a way back to it.

    Size       one site (quick size against the supplier's catalog, or the
               sizer from a utility bill) or a portfolio (portfolio.js, the
               same module the desktop portal mounts)
    Design     Site Map · Editor Lite, and the monthly or yearly
               subscription (api/customer-subscribe.js) — the one thing a
               supplier's customer pays the platform for; a trial comes
               from the supplier. Checkout returns with ?checkout=done|
               cancelled, said once and taken off the address.
    POs        the PO sheet (omega-po-bulk.js → api/po-intake.js
               submit-many) and a PO DOCUMENT uploaded through
               api/my-files.js (category 'po'), which lands on the account
               in the supplier's CRM
    Pay        every open invoice on the account: number, amount, due date
               (issued + the account's terms) and the pay link the server
               allowed (api/_lib/portal.js publicOrder decides; the page
               also refuses anything that is not a plain https link)
    Shipping   loads on their way: carrier, tracking, where each is
    Warranty   coverage per unit, derived by api/_lib/custody.js at read
               time; pending until the unit is bound to a site. A question
               is a warranty request on the unit's order (api/my-orders.js)
    Fleet      sites and units, and the customer's moves on them
    Account    the company, its people, terms, and documents both ways
               (api/my-files.js)

  Everything here is what the supplier's CRM shows: nothing is typed twice.

  IT DOES NOT LOAD omega-tenant.js, like portals/customer/index.html and for
  the same reason: the customer is not a tenant member, may be on any email
  address, and must never be routed to a workspace. Branding comes from
  /api/customer-portal (public, presentation only); everything else from
  the same signed-in customer endpoints the desktop portal reads —
  api/my-account.js, api/my-orders.js, api/my-sites.js, api/my-files.js,
  api/customer-design.js, api/customer-subscribe.js,
  api/customer-portfolio.js, api/po-intake.js — which project key by key.
  The phone reads Firestore never, and computes no price, size, coverage or
  eligibility itself: it counts and sorts what the endpoints returned.

  Sign-in is the email magic link plus Google, as on the portal. The link
  returns into this app's own scope so the installed app completes it.
  Manifest and icon per tenant from api/app-manifest.js (app=customer); a
  shell service worker so it opens offline and says so. Account data is
  never served from cache.
  ═══════════════════════════════════════════════════════════════════════════
-->

      + (o.fixed ? '' : '<select id="' + p + '-cat" aria-label="What it is">' + DOC_CATS.map(function (c) { return '<option value="' + esc(c[0]) + '">' + esc(c[1]) + '</option>'; }).join('') + '</select>')
      + '<input id="' + p + '-note" maxlength="500" placeholder="' + esc(o.notePlaceholder || 'Note (optional): which site, which order') + '">'
      + '<button type="button" class="big" id="' + p + '-up"' + (o.fixed ? ' data-cat="' + esc(o.fixed) + '"' : '') + '>Upload</button>'
      + '<p class="status" id="' + p + '-msg" role="status" aria-live="polite"></p></div>';
  }
  /* Every word about an upload lands under its own Upload button: the page's
     #status is a screen away from it on a phone, and a tap that shows
     nothing reads as a dead button. The line is looked up on every call,
     because Account's `after` redraws the card it sits in. */
  function bindUpload(p, after) {
    var btn = $(p + '-up'); if (!btn) return;
    function say(t, bad) { var m = $(p + '-msg'); if (!m) return status(t); m.className = 'status' + (bad ? ' err' : ''); m.textContent = t || ''; }
    btn.onclick = function () {
      var input = $(p + '-file'), file = input.files && input.files[0], cat = btn.getAttribute('data-cat') || ($(p + '-cat') ? $(p + '-cat').value : 'other'), note = $(p + '-note').value;
      if (!file) { say('Choose a file first.', true); return; }
      if (file.size > MAX_DOC) { say(file.name + ' is ' + kb(file.size) + '; the limit is 2 MB. Send a smaller copy, or ask ' + brandName() + ' for another way.', true); return; }
      btn.disabled = true; say('Uploading ' + file.name + '…');
      readBase64(file).then(function (b64) { return api('/api/my-files', { action: 'upload', file: { name: file.name, base64: b64 }, category: cat, note: note }); })
        .then(function (r) {
          if (missing(r)) throw new Error('Documents are not switched on for this account yet.');
          var j = must(r, 'Could not upload.'); FILES = null; input.value = ''; if ($(p + '-note')) $(p + '-note').value = '';
          var done = j.duplicate ? 'That document is already on your account.' : 'Uploaded. ' + brandName() + ' sees it on your account.';
          btn.disabled = false; if (after) after(); say(done);
        })['catch'](function (e) { say(e.message || String(e), true); btn.disabled = false; });
    };
  }
  /* The account's documents: what the supplier shared, and what anybody on
     the account uploaded — two lists, one endpoint. */
  function drawDocs() {
    var el = $('docs-body'); if (!el) return;
    el.innerHTML = '<div id="docs-list"><p class="note">Loading…</p></div>' + uploadCard('doc');
    bindUpload('doc', drawDocs);
    loadFiles().then(function (d) {
      var box = $('docs-list'); if (!box) return;
      var files = d.files || [], idx = files.map(function (f, i) { return i; });
      var theirs = idx.filter(function (i) { return files[i].source !== 'customer'; }), ours = idx.filter(function (i) { return files[i].source === 'customer'; });
      box.innerHTML = '<p class="sub-h">From ' + esc(brandName()) + ' · ' + theirs.length + '</p>' + (theirs.map(function (i) { return docRow(files[i], i, 'doc'); }).join('') || '<p class="note">Nothing shared with you yet.</p>')
        + '<p class="sub-h">From your company · ' + ours.length + '</p>' + (ours.map(function (i) { return docRow(files[i], i, 'doc'); }).join('') || '<p class="note">Nothing uploaded yet.</p>')
        + (d.limited ? '<p class="note">Newest shown.</p>' : '');
      bindDownloads(box, 'doc', files);
    })['catch'](function (e) { var x = $('docs-list'); if (x) x.innerHTML = '<p class="note err">' + esc(e.message) + '</p>'; });
  }
  /* The purchase-order documents on the account, under the POs upload. */
  function drawPoDocs() {
    var el = $('po-docs'); if (!el) return;
    loadFiles().then(function (d) {
      el = $('po-docs'); if (!el) return;
      var files = (d.files || []).filter(function (f) { return f.category === 'purchase-order'; });
      el.innerHTML = files.length ? '<p class="sub-h">PO documents · ' + files.length + '</p>' + files.slice(0, 10).map(function (f, i) { return docRow(f, i, 'podoc'); }).join('') + (files.length > 10 ? '<p class="note">All of them are in Account → Documents.</p>' : '') : '';
      bindDownloads(el, 'podoc', files);
    })['catch'](function () { var x = $('po-docs'); if (x) x.innerHTML = ''; });
  }
  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { reject(new Error('Could not read ' + file.name)); };
      r.readAsDataURL(file);
    });
  }
  function download(path, name) {
    return tok().then(function (t) { return fetch(path, { headers: { Authorization: 'Bearer ' + t } }); }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || 'Download failed'); }, function () { throw new Error('Download failed'); });
      return r.blob();
    }).then(function (blob) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name || 'document'; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); if (a.parentNode) a.parentNode.removeChild(a); }, 2000);
    });
  }

  /* ── sign in ──────────────────────────────────────────────────────────── */
  $('g-create').onclick = function () { $('g-h').textContent = 'Create a customer account'; $('g-p').textContent = 'Verify your work email. If your company already has an account here, you are asked to join it and its owner lets you in; otherwise a free customer account opens for you.'; $('g-link').textContent = 'Verify email and continue'; $('g-email').focus(); };
  function sendLink() {
    var e = String($('g-email').value || '').trim();
    if (!e || e.indexOf('@') < 0) { $('g-msg').textContent = 'Please enter your email address.'; return; }
    try { localStorage.setItem(LS_EMAIL, e); } catch (x) {}
    /* The link comes back into THIS app's scope, so the installed app
       finishes the sign-in instead of the browser. */
    auth.sendSignInLinkToEmail(e, { url: location.origin + '/portals/customer/app' + q, handleCodeInApp: true })
      .then(function () { $('g-msg').className = 'note'; $('g-msg').textContent = 'Check your inbox — we have emailed a link to ' + e + '.'; }, function (err) { $('g-msg').className = 'note err'; $('g-msg').textContent = (err && err.message) || 'Could not send the link.'; });
  }
  $('g-link').onclick = sendLink;
  $('g-email').onkeydown = function (ev) { if (ev.key === 'Enter') sendLink(); };
  $('g-google').onclick = function () { var p = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p)['catch'](function () { return auth.signInWithRedirect(p); })['catch'](function (err) { $('g-msg').className = 'note err'; $('g-msg').textContent = (err && err.message) || 'Could not sign in.'; }); };
  $('signout').onclick = function () { auth.signOut().then(function () { location.reload(); }, function () { location.reload(); }); };
  try {
    if (typeof auth.isSignInWithEmailLink === 'function' && auth.isSignInWithEmailLink(location.href)) {
      var saved = ''; try { saved = localStorage.getItem(LS_EMAIL) || ''; } catch (x) {}
      if (!saved) saved = window.prompt('Confirm the email address you used') || '';
      auth.signInWithEmailLink(saved, location.href).then(function () { history.replaceState(null, '', location.pathname + q); try { localStorage.removeItem(LS_EMAIL); } catch (e) {} })['catch'](function (err) { $('g-msg').className = 'note err'; $('g-msg').textContent = (err && err.message) || 'That link has expired. Please ask for a new one.'; });
    }
  } catch (e) {}

  /* ── shell ────────────────────────────────────────────────────────────── */
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.onclick = function () { go(b.dataset.tab); }; });
  $('home').onclick = function (e) { e.preventDefault(); go('home'); };
  $('refresh').onclick = refresh;
  function paintNet() { $('offline').hidden = navigator.onLine !== false; }
  window.addEventListener('online', paintNet); window.addEventListener('offline', paintNet); paintNet();
  auth.onAuthStateChanged(function (u) {
    paint();
    $('gate').hidden = !!u; $('nav').hidden = !u; $('signout').hidden = !u; $('view').innerHTML = '';
    $('who').textContent = u ? (u.email || '') : '';
    if (!u) return;
    portalReady.then(function () { refresh(); })['catch'](function (e) { $('view').innerHTML = '<p class="note err">' + esc(e.message) + '</p>'; });
  });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('/app-sandbox/sw.js', { scope: '/app-sandbox/' })['catch'](function () {}); } catch (e) {} }
})();
</script>
