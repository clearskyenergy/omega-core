<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Queue · ClearSky-OMEGA</title>
<!--
  © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.

  DESIGN QUEUE — work another workspace has asked this org to draw.

  ── WHY THIS READS `projects` AND NOT THE ASSIGNING WORKSPACE'S BOOK ──────
  OSA records its assignments on `deals`, which is OSA's private pipeline and
  should stay that way — a design partner has no business reading who else OSA
  is talking to, at what price. So the assignment is stamped onto the PROJECT,
  which is the one document both sides can already reach: firestore.rules gives
  any org named in orgsInvolved[] read AND update on it (isCollaborator +
  rosterAndOwnerUnchanged). That is the Silmarillion JDA model doing the job it
  was built for.

  It also means there is no second copy of the work to keep in step. The
  drawing, the brief, the due date and the completion all live on the project
  the drawing is in.

  ── COMPLETION IS A CLAIM, NOT A GATE ────────────────────────────────────
  "Mark complete" says the drawing is ready for the assigning team to look at.
  It does not move anybody's pipeline stage on its own — OSA reads it, opens
  the drawing, and decides. A partner marking their own work approved would be
  a partner approving their own work.

  ⚠ orgId AND orgsInvolved ARE HANDED BACK UNCHANGED. The rule requires it, and
  the reason is worth remembering: without it a collaborator could add itself
  to any project it can see, or take the project off its owner.
-->
<style>
:root{--cs-navy:#0A1628;--cs-blue:#0070F2;--cs-teal:#00A9A4;--cs-border:#E1E6EC;--cs-text:#0F2733;--cs-muted:#6B7C8C;--cs-bg:#F6F8FA}
*{box-sizing:border-box}
body{margin:0;background:var(--cs-bg);color:var(--cs-text);font:400 14px/1.5 'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{background:var(--cs-navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
.top a{color:#9fd4ff;text-decoration:none;font-weight:600;font-size:13px}
.top h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px}
.wrap{max-width:1080px;margin:0 auto;padding:22px}
.sub{color:var(--cs-muted);font-size:12.5px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--cs-border);border-radius:12px;padding:18px;margin-bottom:14px}
.rowhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rowhead .t{font-size:15px;font-weight:700;margin:0}
.meta{color:var(--cs-muted);font-size:12.5px;margin:3px 0 0}
.acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font:600 11px/1.6 inherit;background:#EAF2FF;color:var(--cs-blue)}
.chip.ok{background:#E6F7EE;color:#1F7A45}.chip.warn{background:#FFF4E5;color:#9A6300}
.chip.bad{background:#FDECEC;color:#A32020}.chip.none{background:#EEF1F4;color:var(--cs-muted)}
button{background:var(--cs-blue);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:600 12.5px inherit;cursor:pointer}
button.ghost{background:#fff;color:var(--cs-text);border:1px solid var(--cs-border)}
button:disabled{opacity:.5;cursor:not-allowed}
.brief{background:#FBFCFD;border:1px solid var(--cs-border);border-radius:9px;padding:12px;margin-top:11px;font-size:13px;white-space:pre-wrap}
.empty{color:var(--cs-muted);padding:26px;text-align:center}
.msg{font-size:12.5px;margin-top:9px;min-height:16px}
.msg.bad{color:#A32020}.msg.good{color:#1F7A45}
.grp{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--cs-muted);margin:22px 0 9px}
@media (max-width:760px){ .wrap{padding:14px} .card{padding:14px} .acts{margin-left:0;width:100%} }
</style>
</head>
<body>
<div class="top">
  <a href="/">&#8592; Portal</a>
  <h1>Design Queue</h1>
  <span id="who" style="margin-left:auto;font-size:12.5px;opacity:.8"></span>
</div>
<div class="wrap">
  <p class="sub">Projects another workspace has asked your team to draw. Open one in the site
    map editor, and mark it complete when the drawing is ready for them to review.</p>
  <div id="list"><div class="card"><div class="empty">Loading…</div></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/omega-brand.js"></script>
<script src="/omega-tenant.js"></script>
<script>
'use strict';
var cfg = (window.CLEARSKY_CONFIG || {});
var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg.firebase || cfg);
var auth = firebase.auth(), db = firebase.firestore();
var ME = null, MYORG = '', ROWS = [];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function orgOf(e){ var d=String(e||'').toLowerCase().split('@')[1]||''; return d==='fenecon.de'||d==='fenecon.us'?'fenecon.com':d; }
function when(t){
  if(!t) return '';
  var ms = t && t.toMillis ? t.toMillis() : Date.parse(t);
  return isFinite(ms) ? new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '';
}
function setMsg(id,text,bad){ var e=document.getElementById(id); if(!e) return;
  e.className='msg '+(bad?'bad':'good'); e.textContent=text; }

var STATUS = {
  in_design: { label:'To draw',        cls:'warn' },
  revise:    { label:'Changes asked',  cls:'warn' },
  complete:  { label:'Marked complete',cls:'ok'   },
  returned:  { label:'With the client',cls:''     }
};
function chip(s){ var m=STATUS[s]||{label:s||'—',cls:'none'};
  return '<span class="chip '+m.cls+'">'+esc(m.label)+'</span>'; }

/* A null on the first callback is the SDK restoring, not a signed-out user —
   the same guard every other page carries. Nothing here signs anybody out. */
var _nulls = 0;
auth.onAuthStateChanged(function(u){
  if(!u){
    var had = !!(window.OmegaTenant && OmegaTenant.hadSession && OmegaTenant.hadSession());
    var cap = had ? 20 : 4;
    if(_nulls++ < cap && !auth.currentUser){
      setTimeout(function(){ if(!auth.currentUser && _nulls>=cap) location.href='/'; }, 400);
      return;
    }
    if(!auth.currentUser) location.href='/';
    return;
  }
  _nulls = 0;
  ME=u; MYORG=orgOf(u.email);
  document.getElementById('who').textContent = u.email + ' · ' + MYORG;
  load();
});

/* array-contains on orgsInvolved is the query the rule can prove: every
   document it returns names this org, which is exactly what isCollaborator()
   checks. A query the rule cannot prove is refused whole, not filtered. */
function load(){
  db.collection('projects').where('orgsInvolved','array-contains',MYORG).get()
    .then(function(sn){
      ROWS=[];
      sn.forEach(function(d){
        var v=d.data()||{}; var dz=v.design||{};
        if(!dz.status) return;                     /* not a design handoff */
        ROWS.push({ id:d.id, name:v.name||v.address||d.id, address:v.address||'',
                    ownerOrg:v.orgId||'', dz:dz });
      });
      ROWS.sort(function(a,b){
        var rank={in_design:0,revise:1,complete:2,returned:3};
        var ra=rank[a.dz.status]==null?9:rank[a.dz.status];
        var rb=rank[b.dz.status]==null?9:rank[b.dz.status];
        if(ra!==rb) return ra-rb;
        return String(a.name).localeCompare(String(b.name));
      });
      render();
    })
    ['catch'](function(e){
      document.getElementById('list').innerHTML='<div class="card"><div class="empty">'
        + (/permission/i.test(e.message||'')
            ? 'Your account is not permitted to read assigned projects. If that is wrong, '
              + 'the workspace that assigned the work has to add your organisation to it.'
            : 'Could not load: '+esc(e.message))+'</div></div>';
    });
}

function render(){
  var host=document.getElementById('list');
  if(!ROWS.length){
    host.innerHTML='<div class="card"><div class="empty">Nothing assigned to '+esc(MYORG)
      +' yet. When a workspace assigns your team a design, it lands here.</div></div>';
    return;
  }
  var open=ROWS.filter(function(r){ return r.dz.status==='in_design'||r.dz.status==='revise'; });
  var done=ROWS.filter(function(r){ return r.dz.status!=='in_design'&&r.dz.status!=='revise'; });
  host.innerHTML =
      (open.length ? '<div class="grp">To draw ('+open.length+')</div>'+open.map(card).join('') : '')
    + (done.length ? '<div class="grp">Sent back ('+done.length+')</div>'+done.map(card).join('') : '');
}

function card(r){
  var i=ROWS.indexOf(r), dz=r.dz;
  var bits=[];
  if(r.address) bits.push(esc(r.address));
  if(dz.fromOrg) bits.push('from '+esc(String(dz.fromOrg).toUpperCase()));
  if(dz.sentAt) bits.push('sent '+when(dz.sentAt));
  if(dz.dueAt){
    var late = Date.parse(dz.dueAt) < Date.now() && (dz.status==='in_design'||dz.status==='revise');
    bits.push('due '+when(dz.dueAt)+(late?' — overdue':''));
  }
  if(dz.lead) bits.push('lead '+esc(String(dz.lead).split('@')[0]));
  var live = dz.status==='in_design'||dz.status==='revise';
  return '<div class="card">'
    + '<div class="rowhead"><div>'
    +   '<p class="t">'+esc(r.name)+'</p>'
    +   '<p class="meta">'+bits.join(' · ')+'</p></div>'
    +   '<div class="acts">'+chip(dz.status)
    +     '<button class="ghost" onclick="openEditor('+i+')">Open in editor</button>'
    +     (live ? '<button onclick="markComplete('+i+')" id="done'+i+'">Mark complete</button>' : '')
    +   '</div></div>'
    + (dz.brief ? '<div class="brief">'+esc(dz.brief)+'</div>' : '')
    + (dz.completedAt
        ? '<p class="meta" style="margin-top:9px">Marked complete '+when(dz.completedAt)
          + (dz.completedBy?' by '+esc(dz.completedBy):'')+'.</p>' : '')
    + '<div class="msg" id="m'+i+'"></div></div>';
}

function openEditor(i){ location.href='/editor.html?id='+encodeURIComponent(ROWS[i].id); }

/* Dot paths only. The rule requires orgId and orgsInvolved to come back
   unchanged, and the surest way to hand them back unchanged is never to send
   them — see the note at the top of this file for why the rule exists. */
function markComplete(i){
  var r=ROWS[i];
  if(!confirm('Mark "'+r.name+'" complete?\n\nThe team that assigned it will see the drawing '
      + 'is ready to review. It does not move their pipeline on its own.')) return;
  var btn=document.getElementById('done'+i); if(btn) btn.disabled=true;
  setMsg('m'+i,'Saving…');
  db.collection('projects').doc(r.id).update({
    'design.status':      'complete',
    'design.completedAt': new Date().toISOString(),
    'design.completedBy': (ME && ME.email) || '',
    updatedAt:            new Date().toISOString()
  }).then(function(){
    setMsg('m'+i,'Marked complete.');
    load();
  })['catch'](function(e){
    if(btn) btn.disabled=false;
    setMsg('m'+i, /permission/i.test(e.message||'')
      ? 'Firestore refused the write — your organisation is on this project but not permitted '
        + 'to update it. Ask the assigning workspace to check the roster.'
      : 'Could not save: '+e.message, true);
  });
}
</script>
</body>
</html>
