 el.innerHTML='<p class="note">Units at each operation</p><div class="ops">'+ops+'</div><div class="gridf"><label>Stage<select data-filter="stage">'+options('stage')+'</select></label><label>Line<select data-filter="line">'+options('line')+'</select></label><label>Priority<select data-filter="priority">'+options('priority')+'</select></label><label>Holds<select data-filter="holds">'+options('holds')+'</select></label><label>Target date<select data-filter="due">'+options('due')+'</select></label></div><button type="button" id="clear" style="margin-top:10px">Clear filters</button>';

function strip(u,routing){var at=u.at||'',i=-1;routing.forEach(function(s,k){if(s.key===at)i=k;});return '<div class="strip" title="'+esc(at?routing[i]?routing[i].label:at:'Not started')+'">'+routing.map(function(s,k){return '<i class="'+(u.hold&&k===i?'hold':k<i?'past':k===i?'here':'')+'"></i>';}).join('')+'</div>';}
function placeText(a){if(!a)return '';var city=[a.city,a.state].filter(Boolean).join(', ');if(a.zip)city=city?city+' '+a.zip:a.zip;return [a.name,a.line1,city].filter(Boolean).join(', ');}
function linesMatch(a,b){a=a||[];b=b||[];if(a.length!==b.length)return false;for(var i=0;i<a.length;i++){if(a[i].sku!==b[i].sku||a[i].qty!==b[i].qty)return false;}return true;}
function blockBits(units,p,mats){var bits=[];(units||[]).forEach(function(u){if(u.hold)bits.push(u.hold);});
 (units||[]).forEach(function(u){if(u.test&&u.test.result==='fail'&&!u.hold)bits.push(u.test.failureCode||'Failed test');});
 if(mats&&mats.hasBom&&mats.short&&mats.short.length)bits.push('Short '+(mats.short.length===1?mats.short[0].name||mats.short[0].sku:mats.short.length+' components'));

 return bits;}

function journeyBlock(s,orderId,r,units){var p=r.progress,gap='<p>Purchase order: the customer, what is being built, and the ship-to are not on the purchase order.</p>';
 var who='',built='',ship='',po='';

  if(s.projectName&&s.projectName!==who)who=(who?who+' · ':'')+s.projectName;
  var items=s.items||[];built=items.length?items.map(builtLine).join(', '):'';
  var sites=s.sites||[];
  if(sites.length>1)ship=sites.map(function(site){return placeText(site.address)||'Ship-to is not on the purchase order';}).join('; ');
  else ship=s.address?placeText(s.address):'';

 return '<section class="journey" id="journey"><h3>This order</h3>'+head+'<p class="k">Progress</p><div class="big">'+(p.units?p.percent+'% complete':'Awaiting serials')+'</div><div class="bar '+(p.held?'bad':p.percent===100?'ok':'')+'" style="margin:8px 0"><i style="width:'+p.percent+'%"></i></div><p id="block"></p></section>';}
function qualityBlock(units){var holds=[],fails=[];(units||[]).forEach(function(u){if(u.hold)holds.push(u);if(u.test&&u.test.result==='fail')fails.push(u);});var factory=(data.links&&data.links.factory)||'';
 function link(u){return '<a href="'+esc(factory)+'&serial='+encodeURIComponent(u.serial)+'">'+esc(u.serial)+'</a>';}
 var body=(!holds.length&&!fails.length)?'<p class="note">No holds and no failed tests on the units loaded for this work order.</p>':'';
 if(holds.length)body+='<p class="note">On hold</p><table><thead><tr><th>Serial</th><th>Reason</th></tr></thead><tbody>'+holds.map(function(u){return '<tr><td>'+link(u)+'</td><td>'+esc(u.hold)+(u.ncr?' · '+esc(u.ncr):'')+'</td></tr>';}).join('')+'</tbody></table>';
 if(fails.length)body+='<p class="note">Failed tests</p><table><thead><tr><th>Serial</th><th>Result</th></tr></thead><tbody>'+fails.map(function(u){var t=u.test||{};return '<tr><td>'+link(u)+'</td><td>'+esc(t.failureCode||'Failed')+(t.station?' · '+esc(t.station):'')+'</td></tr>';}).join('')+'</tbody></table>';
 return '<section id="quality"><h3>Quality</h3>'+body+'</section>';}
function issuedBlock(wo){var issued=wo&&wo.issued;if(!issued||typeof issued!=='object')return '';var bad={__proto__:1,constructor:1,prototype:1},keys=Object.keys(issued).filter(function(k){return !bad[k]&&issued[k]!=null&&issued[k]!=='';});if(!keys.length)return '';
 return '<section id="issued"><h3>Issued from stock</h3><table><thead><tr><th>Component</th><th>Qty</th></tr></thead><tbody>'+keys.map(function(k){var q=issued[k],n=q&&typeof q==='object'?q.qty:q;return '<tr><td>'+esc(k)+'</td><td>'+esc(n)+'</td></tr>';}).join('')+'</tbody></table><p class="note">Components taken off the shelf onto this work order.</p></section>';}
function matsHtml(m){var head='<h3>Materials</h3>';if(!m||!m.hasBom)return head+'<p class="note">No bill of materials on this work order\'s products yet. Add components and bills in the product catalog to see whether it can be built from stock.</p>';if(m.feasible)return head+'<p>Every component is on hand or on order for this work order, taken on its own.</p>';var short=m.short||[];

function loadMaterials(id){if(!auth.currentUser)return;auth.currentUser.getIdToken().then(function(t){return fetch('/api/logic-materials'+base+'&workOrder='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+t}});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Materials unavailable');return d;});}).then(function(m){if(selected!==id)return;materials=m;var el=$('mats');if(el)el.innerHTML=matsHtml(m);paintBlock();}).catch(function(e){if(selected!==id)return;var el=$('mats');if(el)el.innerHTML='<h3>Materials</h3><p class="note">'+esc(e.message)+'</p>';});}
/* A floating figure must not sit on the order. Hide a small fixed image
   that overlaps the drawer. The loading mark and the office nav stay. */
function tuck(){var detailEl=$('detail');if(!detailEl||detailEl.hidden)return;var box=detailEl.getBoundingClientRect();
 var guide=document.getElementById('lg-guide');if(guide)guide.hidden=true;
 Array.prototype.forEach.call(document.body.querySelectorAll('img,canvas,svg'),function(el){if(detailEl.contains(el))return;var host=el;
  while(host&&host!==document.body){var pos=window.getComputedStyle(host).position;if(pos==='fixed'||pos==='absolute')break;host=host.parentNode;}
  if(!host||host===document.body||host.id==='omega-splash')return;
  var r=host.getBoundingClientRect();if(r.width>240||r.height>240||r.width<12||r.height<12)return;
  if(r.right>box.left+4&&r.left<box.right-4&&r.bottom>box.top+4&&r.top<box.bottom-4)host.style.setProperty('display','none','important');});}
function drawDetail(){var d=detail,r=d.board,p=r.progress,units=d.units||[];
 var here='';r.routing.forEach(function(s,i){var q=p.queues[i]||{count:0};if(q.count&&!here)here=s.label;});

 var svc=r.services.required.length?'<section><h3>Services</h3>'+r.services.required.map(function(s){return '<p>'+s.qty+' × '+esc(s.name||s.sku)+'</p>';}).join('')+(r.services.completion?'<p class="note">Completed by '+esc(r.services.completion.by)+' · '+esc(r.services.completion.at)+'<br>'+esc(r.services.completion.evidence)+'</p>':''+(data.canControl===false?'<p class="note">The workspace owner or an administrator records the services as completed.</p>':'<label>Completion evidence<textarea id="svc-evidence" placeholder="Work performed, acceptance record or document reference"></textarea></label><button type="button" id="svc-done">Record services completed</button>')+'')+'</section>':'';
 var lines=(data.flow&&data.flow.lines||[]).map(function(l){return '<option value="'+esc(l.id)+'"'+(l.id===r.lineId?' selected':'')+'>'+esc(l.name)+'</option>';}).join('');
 var factory=(data.links&&data.links.factory)||'',office=(data.links&&data.links.office)||'';
 var record='';if(d.source&&(d.source.poNumber||d.source.projectId))record='<details class="fold" id="record"><summary>Purchase order record</summary><div class="in">'+(d.source.poNumber?'<p>PO '+esc(d.source.poNumber)+'</p>':'')+(d.source.projectId?'<p class="note">Project record '+esc(d.source.projectId)+'</p>':'')+'</div></details>';
 $('detail').innerHTML='<button type="button" id="back">← Back to board</button><button type="button" id="close" aria-label="Close">✕</button><p class="eyebrow">Work order</p><h2>'+esc(r.orderNo)+'</h2><p><span class="badge '+STAGE_CLASS[r.stage]+'">'+esc(r.stageLabel)+'</span> '+(r.late?'<span class="badge bad">Late</span> ':'')+(r.priority==='urgent'?'<span class="badge warn">Urgent</span> ':'')+'<span class="note">'+esc(lineName(r.lineId))+'</span></p>'

 +'<section><h3>Parts</h3>'+parts+'<div class="row"><a class="btn" href="'+esc(factory)+'&wo='+encodeURIComponent(r.id)+'#register">Register serials</a>'+(r.orderId?'<a class="btn" href="'+esc(office)+'&order='+encodeURIComponent(r.orderId)+'">Open the order</a>':'')+'</div></section>'

 +'<section id="mats"><h3>Materials</h3><p class="note">Checking stock…</p></section>'+svc
 +'<section><h3>Units'+(d.limited?' · first 400':'')+'</h3>'+(units.length?'<table>'+units.map(function(u){var lbl='';r.routing.forEach(function(s){if(s.key===u.at)lbl=s.label;});return '<tr><td><a href="'+esc(factory)+'&serial='+encodeURIComponent(u.serial)+'">'+esc(u.serial)+'</a></td><td>'+(u.hold?'<span class="badge bad">Hold</span> ':'')+esc(lbl||'Not started')+strip(u,r.routing)+'</td></tr>';}).join('')+'</table>':'<p class="note">No serials registered yet.</p>')+'</section>'+record;

 var out=[cols.map(function(c){return c.label;}).join(',')].concat(list.map(function(r){var p=r.progress;return cols.map(function(c){switch(c.key){case 'wo':return r.orderNo;case 'line':return lineName(r.lineId);case 'stage':return r.stageLabel+(r.late?' (late)':'');case 'priority':return r.priority;case 'due':return r.due||'';case 'progress':return p.units?p.percent+'%':'';case 'ready':return p.readyRoots+'/'+p.expectedRoots;case 'holds':return p.held;case 'next':return p.nextUp?p.nextUp.label:'';case 'assignee':return r.assignee;case 'updated':return r.updatedAt||'';}return '';}).map(q).join(',');})).join('\r\n');
 var blob=new Blob(['﻿'+out],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='work-orders-'+org+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);};
