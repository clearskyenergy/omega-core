<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OMEGA">
  <!-- © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.
       Neon omega for LIGHT grounds (white topbars, the marketplace auth panel).
       Same glyph, deeper pigment, no white core and a much fainter halo. A
       white core on paper reads as two thin parallel lines once the mark is
       down at 22 px, and a halo with nothing to glow against just goes muddy. -->
  <defs>
    <linearGradient id="csoGL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8F52"/>
      <stop offset=".34" stop-color="#0E8FA8"/>
      <stop offset="1" stop-color="#2B5FA8"/>
    </linearGradient>
    <filter id="csoBL" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 80H26C33 79 34.8 71 33.4 63.3A27 27 0 1 1 66.6 63.3C65.2 71 67 79 74 80H90" stroke="url(#csoGL)" stroke-width="13" filter="url(#csoBL)" opacity=".3"/>
    <path d="M10 80H26C33 79 34.8 71 33.4 63.3A27 27 0 1 1 66.6 63.3C65.2 71 67 79 74 80H90" stroke="url(#csoGL)" stroke-width="8"/>
  </g>
</svg>
