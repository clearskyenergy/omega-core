<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS // Mission Control</title>
<!-- Hosted copy of ~/jarvis/index.html. Same telemetry endpoint; no local
     server needed. Edit one, copy to the other. -->
<style>
:root{--glow-cyan:#00f3ff;--glow-blue:#0044ff;--bg-dark:#050b14;--panel-bg:rgba(10,25,47,.7);
      --ink:#e2f1ff;--dim:#5f7d99;--good:#56ff1a;--warn:#ffb020;--bad:#ff4d4d}
*{box-sizing:border-box}
body{background:var(--bg-dark);color:var(--ink);font-family:'Courier New',Courier,monospace;
     margin:0;padding:20px;overflow-x:hidden}
body::before{content:" ";display:block;position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%),
             linear-gradient(90deg,rgba(255,0,0,.06),rgba(0,255,0,.02),rgba(0,0,255,.06));
  background-size:100% 4px,3px 100%}
header{border-bottom:2px solid var(--glow-cyan);padding-bottom:10px;margin-bottom:20px;
       display:flex;justify-content:space-between;align-items:center;gap:16px;
       box-shadow:0 0 15px rgba(0,243,255,.2)}
h1{margin:0;font-size:22px;letter-spacing:4px;text-shadow:0 0 10px var(--glow-cyan)}
.status-badge{color:var(--glow-cyan);animation:blink 2s infinite;font-size:13px}
.status-badge.err{color:var(--bad);animation:none}
button{background:transparent;border:1px solid var(--glow-blue);color:var(--glow-cyan);
       font-family:inherit;font-size:12px;padding:7px 14px;cursor:pointer;letter-spacing:1px}
button:hover{background:rgba(0,68,255,.18)}
.dashboard-grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:20px}
@media(max-width:1100px){.dashboard-grid{grid-template-columns:1fr}}
.panel{background:var(--panel-bg);border:1px solid var(--glow-blue);
       box-shadow:0 0 15px rgba(0,68,255,.15);padding:18px;border-radius:4px;position:relative}
.panel::before{content:'';position:absolute;top:0;left:0;width:10px;height:10px;
  border-top:2px solid var(--glow-cyan);border-left:2px solid var(--glow-cyan)}
.panel h2{font-size:14px;margin:0 0 10px;color:var(--glow-cyan);letter-spacing:2px;
  border-bottom:1px solid rgba(0,243,255,.3);padding-bottom:5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13px}
.row .k{color:var(--dim)}
.row .v{color:var(--ink);text-align:right}
.v.cy{color:var(--glow-cyan)} .v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
.alert{margin-top:10px;border:1px solid var(--warn);color:var(--warn);padding:9px;font-size:12px;line-height:1.5}
.arc-container{display:flex;justify-content:center;align-items:center;height:190px;position:relative}
.arc-ring{width:150px;height:150px;border:4px dashed var(--glow-cyan);border-radius:50%;
  animation:spin 20s linear infinite;box-shadow:0 0 30px rgba(0,243,255,.4)}
.arc-ring.idle{animation-duration:90s;opacity:.45;box-shadow:none}
.arc-core{position:absolute;text-align:center}
.arc-core .n{font-size:30px;color:var(--glow-cyan);text-shadow:0 0 12px var(--glow-cyan)}
.arc-core .l{font-size:10px;color:var(--dim);letter-spacing:2px}
.log-display{background:rgba(0,0,0,.5);height:260px;overflow-y:auto;padding:10px;
  border:1px solid rgba(0,243,255,.2);font-size:12.5px;color:#79c0ff;line-height:1.7}
.log-display .t{color:var(--dim)}
.log-display .e{color:var(--bad)}
.gate{max-width:420px;margin:16vh auto;text-align:center}
.gate p{color:var(--dim);font-size:13px;line-height:1.6}
.foot{margin-top:16px;font-size:11px;color:var(--dim);letter-spacing:1px}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <h1>JARVIS // CORE_PORTAL</h1>
  <p>Every figure on this panel is read from the twin. Sign in to see them.</p>
  <button id="signin">AUTHENTICATE</button>
  <p id="gateErr" style="color:var(--bad)"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>JARVIS // CORE_PORTAL_v1.0</h1>
    <div class="status-badge" id="badge">● CONNECTING</div>
    <button id="refresh">REFRESH</button>
  </header>

  <div class="dashboard-grid">
    <div class="panel">
      <h2>PIPELINE</h2>
      <div id="pipeline"></div>
      <div id="alert"></div>
    </div>

    <div class="panel" style="grid-column:2">
      <h2>ORCHESTRATION</h2>
      <div class="arc-container">
        <div class="arc-ring" id="ring"></div>
        <div class="arc-core"><div class="n" id="queueN">—</div><div class="l">IN QUEUE</div></div>
      </div>
      <h2>AGENT ACTIVITY — LAST 8 RUNS</h2>
      <div class="log-display" id="logStream"></div>
    </div>

    <div class="panel">
      <h2>SPEND</h2>
      <div id="spend"></div>
      <h2 style="margin-top:16px">SUBSYSTEMS</h2>
      <div id="features"></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script type="module">
/* Public web config — the endpoint's allowlist is what gates access. */
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyABoM1lgOYUnd5ZadaoTMhYmA9cHa8Tyo0",
  authDomain:"clearsky-portal.firebaseapp.com",
  projectId:"clearsky-portal",
  storageBucket:"clearsky-portal.firebasestorage.app",
  messagingSenderId:"742134484347",
  appId:"1:742134484347:web:ab0f95fd221536158481de"
};
const ENDPOINT = 'https://us-central1-clearsky-portal.cloudfunctions.net/twinChat/status';

const V='https://www.gstatic.com/firebasejs/10.12.5/';
const [appMod,authMod]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js')]);
const app=appMod.getApps().length?appMod.getApp():appMod.initializeApp(FIREBASE_CONFIG);
const auth=authMod.getAuth(app);
const el=id=>document.getElementById(id);

/* Never invent a number. A missing value renders as a dash, so a broken loop
   looks broken instead of looking like 42 degrees. */
const dash='—';
const money=n=>n==null?dash:(n===0?'$0':(n<0.01?'<$0.01':'$'+Number(n).toFixed(2)));
const num=n=>n==null?dash:String(n);
const clock=iso=>{const d=new Date(iso);return isNaN(d)?dash:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};

function rows(host, list){
  host.textContent='';
  for (const [k,v,cls] of list){
    const r=document.createElement('div'); r.className='row';
    const a=document.createElement('span'); a.className='k'; a.textContent=k;
    const b=document.createElement('span'); b.className='v'+(cls?' '+cls:''); b.textContent=v;
    r.appendChild(a); r.appendChild(b); host.appendChild(r);
  }
}

async function load(){
  const u=auth.currentUser; if(!u) return;
  const badge=el('badge');
  try{
    const tok=await u.getIdToken();
    const res=await fetch(ENDPOINT,{headers:{Authorization:'Bearer '+tok}});
    if(res.status===403) throw new Error('ACCOUNT NOT PERMITTED');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const s=await res.json();

    badge.className='status-badge'; badge.textContent='● SYSTEM_ONLINE';

    const ing=s.ingest;
    rows(el('pipeline'), ing ? [
      ['LAST INGEST', clock(ing.at),'cy'],
      ['FETCHED', num(ing.fetched)],
      ['WRITTEN', num(ing.written)],
      ['MEETINGS SEEN', num(ing.meetings)],
      ['SOURCES', num(s.counts.sources),'cy'],
      ['MEETINGS', num(s.counts.meetings)],
      ['BACKLOG', num(s.counts.backlog)],
      ['DRAFTS WAITING', num(s.counts.drafts), s.counts.drafts?'warn':''],
      ['TODAY', s.calendar.count==null?dash:s.calendar.count+' meetings'],
      ['NEXT', s.calendar.next||'clear','cy']
    ] : [['LAST INGEST','no run recorded','bad']]);

    el('alert').textContent='';
    if(ing&&ing.alert){const d=document.createElement('div');d.className='alert';d.textContent=ing.alert;el('alert').appendChild(d);}

    el('queueN').textContent=num(s.counts.queued);
    el('ring').className='arc-ring'+((s.counts.queued||0)>0?'':' idle');

    rows(el('spend'), [
      ['PER DAY', money(s.spend.perDay),'cy'],
      ['PER MONTH', money(s.spend.perMonth)],
      ['TO DATE', money(s.spend.measuredToDate),'good']
    ]);

    rows(el('features'), s.features.map(f=>[
      f.label.toUpperCase(),
      f.blocked?'BLOCKED':(f.enabled?'ON '+money(f.perDay):'OFF'),
      f.blocked?'bad':(f.enabled?'good':'')
    ]));

    const log=el('logStream'); log.textContent='';
    if(!s.runs.length){log.textContent='no runs recorded';}
    s.runs.slice().reverse().forEach(r=>{
      const line=document.createElement('div');
      const t=document.createElement('span'); t.className='t'; t.textContent='['+clock(r.at)+'] ';
      line.appendChild(t);
      const body=document.createElement('span');
      if(r.errors){body.className='e';}
      body.textContent=r.loop.toUpperCase()+(r.detail?' — '+r.detail:'')+
                       (r.costUsd?'  '+money(r.costUsd):'')+
                       (r.errors?'  '+r.errors+' error(s)':'');
      line.appendChild(body); log.appendChild(line);
    });
    log.scrollTop=log.scrollHeight;

    el('foot').textContent='LAST READ '+new Date(s.now).toLocaleTimeString()+
      '  ·  every figure measured, none simulated';
  }catch(e){
    badge.className='status-badge err'; badge.textContent='● '+e.message;
  }
}

el('refresh').addEventListener('click',load);
el('signin').addEventListener('click',async()=>{
  try{await authMod.signInWithPopup(auth,new authMod.GoogleAuthProvider());}
  catch(e){el('gateErr').textContent=e.message;}
});

authMod.onAuthStateChanged(auth,u=>{
  el('gate').hidden=!!u; el('app').hidden=!u;
  if(u){load(); setInterval(load,30000);}
});
</script>
</body>
</html>
