<title>Clean Cell Sandbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F2F6F8; --panel:#FFFFFF; --ink:#101E27; --ink2:#41565F; --ink3:#71888F;
    --line:#DBE5EA; --line2:#EDF2F4;
    --accent:#0E7C8B; --accent-soft:#E4F4F7;
    --ok:#17794A; --ok-bg:#E4F4EB; --warn:#9E6208; --warn-bg:#FBF0DC; --bad:#AC2318; --bad-bg:#FBE8E6;
    --f:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
    --m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-brand="cs"]{ --accent:#12657F; --accent-soft:#E2EFF4; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --paper:#0A1319; --panel:#101D25; --ink:#E6EEF1; --ink2:#AFC3CB; --ink3:#7E949C;
    --line:#22343E; --line2:#18272F;
    --accent:#42C6D8; --accent-soft:#0F2F38;
    --ok:#4ECB85; --ok-bg:#0F2C1D; --warn:#E0A94D; --warn-bg:#2F2410; --bad:#F0796B; --bad-bg:#331714;
  }}
  :root[data-theme="dark"]{
    --paper:#0A1319; --panel:#101D25; --ink:#E6EEF1; --ink2:#AFC3CB; --ink3:#7E949C;
    --line:#22343E; --line2:#18272F; --accent:#42C6D8; --accent-soft:#0F2F38;
    --ok:#4ECB85; --ok-bg:#0F2C1D; --warn:#E0A94D; --warn-bg:#2F2410; --bad:#F0796B; --bad-bg:#331714;
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);margin:0;font:400 15px/1.55 var(--f)}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top .bd{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
  .top .who{font-size:13px;color:var(--ink3)}
  .top .sp{flex:1}
  .tabs{display:flex;gap:5px;flex-wrap:wrap}
  .tabs button{font:600 13px var(--f);color:var(--ink2);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer}
  .tabs button:hover{border-color:var(--accent);color:var(--accent)}
  .tabs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs button:focus-visible,.btn:focus-visible,.g:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  main{max-width:940px;margin:0 auto;padding:22px 18px 60px;display:grid;grid-template-columns:1fr;gap:18px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
  .lede{color:var(--ink2);margin:0 0 16px;max-width:62ch;font-size:14.5px}
  .fine{color:var(--ink3);font-size:13px;margin:10px 0 0;max-width:62ch}
  .empty{color:var(--ink3);padding:18px 0;font-size:14.5px}
  .mut{color:var(--ink3)}
  code{font:500 13px var(--m);background:var(--accent-soft);padding:2px 5px;border-radius:4px}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
  label{display:flex;flex-direction:column;gap:5px;font:600 11px var(--f);letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink3)}
  label.chk{flex-direction:row;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:13.5px}
  input,select{font:400 15px var(--f);color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:120px}
  .btn{font:600 14px var(--f);color:var(--ink2);background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.p:hover{opacity:.9;color:#fff}
  .rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line2);
    border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:4px 0 14px}
  .rec>div{background:var(--panel);padding:12px 14px}
  .k{font:600 10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .v{font-weight:600;font-size:15px;margin-top:4px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
  .ord{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px}
  .ord:last-child{margin-bottom:0}
  .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .no{font:600 14.5px var(--m)}
  .sp{flex:1}
  .pill{font:700 11.5px var(--f);border-radius:999px;padding:5px 11px;white-space:nowrap}
  .pill.go{background:var(--ok-bg);color:var(--ok)} .pill.wait{background:var(--warn-bg);color:var(--warn)}
  .pill.stop{background:var(--bad-bg);color:var(--bad)}
  .say{margin:9px 0 0;color:var(--ink2);font-size:14.5px}
  .track{display:flex;gap:4px;margin-top:12px}
  .track i{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .track i.on{background:var(--accent)} .track i.done{background:var(--ok)}
  .lines{margin-top:11px;display:flex;flex-direction:column;gap:4px;font-size:14px}
  .lines b{font-variant-numeric:tabular-nums}
  .meta{margin-top:10px;display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
  .docs{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
  .docs a{font:600 12.5px var(--f);color:var(--accent);text-decoration:none;
    border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .acts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  /* bench */
  .vd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;border:1px solid var(--line);
    border-radius:12px;padding:15px;margin-bottom:14px;background:var(--line2)}
  .vd .mark{font:700 19px var(--m);width:26px;text-align:center}
  .vd b{font:600 15px var(--m)}
  .vd.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .vd.dup{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .vd.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .guns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .g{font:600 12.5px var(--m);background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left}
  .g:hover{border-color:var(--accent)}
  .g small{display:block;font:400 11px var(--f);color:var(--ink3);margin-top:2px}
  .g.hold{border-color:var(--bad)} .g.hold small{color:var(--bad)}
  .board{display:grid;grid-template-columns:repeat(10,minmax(62px,1fr));gap:5px;overflow-x:auto}
  .col{background:var(--line2);border-radius:8px;padding:7px 5px;min-height:70px}
  .ch{font:600 9px var(--m);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);
    margin-bottom:6px;line-height:1.2}
  .u{font:600 10.5px var(--m);background:var(--accent);color:#fff;border-radius:5px;
    padding:4px 3px;margin-bottom:3px;text-align:center}
  .u.hold{background:var(--bad)}
  /* estate */
  .sf{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2)}
  .sf:first-of-type{border-top:none}
  .sf .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
  .s-ok .dot{background:var(--ok)} .s-warn .dot{background:var(--warn)} .s-off .dot{background:var(--ink3)}
  .sf .st{font:700 10px var(--m);letter-spacing:.08em;text-transform:uppercase;font-style:normal}
  .s-ok .st{color:var(--ok)} .s-warn .st{color:var(--warn)} .s-off .st{color:var(--ink3)}
  .pre{font:400 12px/1.5 var(--m);background:var(--line2);border:1px solid var(--line);border-radius:10px;
    padding:14px;overflow-x:auto;white-space:pre;color:var(--ink2);max-height:420px}
  /* log */
  .log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
  .lg{display:flex;gap:10px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line2);color:var(--ink2)}
  .lg:first-child{border-top:none}
  .lg .t{font:500 12px var(--m);color:var(--ink3);flex:none}
  .lg .w{font:600 12px var(--f);color:var(--accent);min-width:72px;flex:none}
  @media (max-width:640px){ .board{grid-template-columns:repeat(10,72px)} main{padding:16px 14px 50px} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <span class="bd" id="brand">Clean Cell Power Platform</span>
  <span class="who" id="who"></span>
  <span class="sp"></span>
  <nav class="tabs" id="tabs" aria-label="Who you are">
    <button type="button" data-role="customer">Buyer</button>
    <button type="button" data-role="tenant">Clean Cell</button>
    <button type="button" data-role="bench">Plant floor</button>
    <button type="button" data-role="staff">ClearSky</button>
  </nav>
  <button type="button" class="btn" id="reset">Reset</button>
</header>

<main>
  <div id="view"></div>
  <div class="log"><h2>What has happened</h2><div id="logbody"></div></div>
</main>
