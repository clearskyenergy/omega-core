<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/omega-splash.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site · ClearSky-OMEGA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cs-navy:#16202B;--cs-blue:#2B5FA8;--cs-text:#14171A;--cs-sub:#5B6672;
  --cs-bg:#F5F4F0;--cs-border:#DCD9D2;--cs-red:#D9482B;
  --sap-blue:#2B5FA8;--sap-blue-hi:#3F76C4;--sap-page:#F5F4F0;--sap-card-border:#E4E8EC;
  --sap-ink:#16202B;--sap-ink-2:#5B6672;
}
body{font-family:'DM Sans',sans-serif;background:var(--sap-page);color:var(--cs-text);min-height:100vh}
#topbar{display:flex;align-items:center;background:#fff;padding:0 24px;height:60px;position:sticky;top:0;z-index:200;border-bottom:1px solid var(--sap-card-border)}
.tb-logo{text-decoration:none}.tb-logo-txt{color:var(--sap-ink);font-weight:700;font-size:15px}.tb-logo-txt span{color:var(--sap-blue)}
.tb-sep{width:1px;height:22px;background:var(--sap-card-border);margin:0 16px}
.tb-portal{color:var(--sap-ink-2);font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tb-nav{display:flex;align-items:center;gap:2px;margin-left:20px;height:56px}
.tb-tab{display:flex;align-items:center;gap:6px;text-decoration:none;border-bottom:3px solid transparent;color:var(--sap-ink);padding:0 14px;height:56px;font:500 13.5px/1 'DM Sans',sans-serif;white-space:nowrap}
.tb-tab:hover{color:var(--sap-blue)}
.tb-tab.active{color:var(--sap-blue);border-bottom-color:var(--sap-blue-hi);font-weight:600}
.tb-spacer{flex:1}.tb-user{display:flex;align-items:center;gap:10px}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--sap-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.tb-name{font-size:13px;font-weight:500}
#main{max-width:1100px;margin:0 auto;padding:32px 24px}
.crumb{font-size:12.5px;color:var(--cs-sub);margin-bottom:10px}
.crumb a{color:var(--sap-blue);text-decoration:none}
.site-head{background:#fff;border:1px solid var(--sap-card-border);border-radius:14px;padding:24px;margin-bottom:0}
.site-head h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.site-head .loc{font-size:13.5px;color:var(--cs-sub);margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px}
.fact .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--cs-sub)}
.fact .v{font-size:16px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.fact .n{font-size:11.5px;color:var(--cs-sub);margin-top:2px;line-height:1.4}
.t-mut{color:#9AA3AD;font-style:italic;font-weight:400}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill-ok{background:rgba(0,169,164,.13);color:#00736F}
.pill-no{background:rgba(217,72,43,.10);color:#B03A1E}
.pill-unk{background:#EEF1F4;color:var(--cs-sub)}
.pill-warn{background:rgba(217,119,6,.12);color:#B45309}
.tabs{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--sap-card-border)}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 16px;font:600 13.5px 'DM Sans',sans-serif;color:var(--cs-sub);cursor:pointer}
.tab.active{color:var(--sap-blue);border-bottom-color:var(--sap-blue-hi)}
.tabpane{display:none;padding:22px 0}
.tabpane.active{display:block}
.card{background:#fff;border:1px solid var(--sap-card-border);border-radius:12px;padding:18px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input[type=text],input[type=number],input[type=date],select,textarea{border:1.5px solid var(--cs-border);border-radius:8px;padding:8px 11px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--cs-text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cs-sky)}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{background:var(--sap-blue);border:none;color:#fff;border-radius:7px;padding:8px 16px;cursor:pointer;font:600 12.5px 'DM Sans',sans-serif}
.btn:hover{background:var(--sap-blue-hi)}
.btn-ghost{background:#fff;border:1px solid var(--sap-card-border);color:var(--sap-ink);border-radius:7px;padding:8px 14px;cursor:pointer;font:500 12.5px 'DM Sans',sans-serif}
.btn-danger{background:none;border:1px solid #F3C4B5;color:var(--cs-red);border-radius:7px;padding:6px 12px;cursor:pointer;font:500 12px 'DM Sans',sans-serif}
.list-item{border-bottom:1px solid rgba(0,0,0,.05);padding:12px 0}
.list-item:last-child{border-bottom:none}
.li-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.li-title{font-size:13.5px;font-weight:600}
.li-meta{font-size:11.5px;color:var(--cs-sub)}
.li-body{font-size:13px;color:var(--cs-text);margin-top:6px;white-space:pre-wrap;line-height:1.5}
.err{background:#FDF0EC;border:1px solid #F3C4B5;color:#B03A1E;border-radius:9px;padding:12px 16px;font-size:13px;margin:14px 0}
.okmsg{background:#EDF7F6;border:1px solid #BFE3E0;color:#00736F;border-radius:9px;padding:12px 16px;font-size:13px;margin:14px 0}
.loading{display:flex;align-items:center;justify-content:center;padding:50px;gap:10px;color:var(--cs-sub)}
.spin{width:18px;height:18px;border:2px solid var(--cs-border);border-top-color:var(--cs-sky);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
table.cf{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.cf th,table.cf td{text-align:right;padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.05)}
table.cf th:first-child,table.cf td:first-child{text-align:left}
table.cf th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--cs-sub)}
.assume{font-size:12px;color:var(--cs-sub);line-height:1.6;background:#FAFBFC;border:1px solid var(--sap-card-border);border-radius:9px;padding:12px 14px;margin-top:12px}
.assume b{color:var(--cs-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
select.inline,input.inline{padding:6px 9px;font-size:12.5px}
label.fl{display:block;font-size:11.5px;font-weight:600;color:var(--cs-sub);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.tb-burger{display:none;background:#fff;border:1px solid var(--sap-card-border);border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;margin-left:auto}
.tb-burger svg{width:20px;height:20px;stroke:var(--sap-ink);stroke-width:2;fill:none;stroke-linecap:round}
.tb-scrim{position:fixed;inset:0;background:rgba(8,25,40,.5);z-index:999;opacity:0;pointer-events:none;transition:opacity .2s}
.tb-scrim.open{opacity:1;pointer-events:auto}
@media(max-width:900px){
#topbar{height:54px;padding:0 12px;gap:8px}
.tb-burger{display:flex}
.tb-sep,.tb-portal,.tb-name{display:none}
.tb-nav{position:fixed;top:0;right:0;bottom:0;left:auto;width:270px;max-width:82vw;height:100vh;height:100dvh;background:#fff;flex-direction:column;align-items:stretch;gap:0;margin:0;padding:64px 0 20px;box-shadow:-8px 0 30px rgba(0,0,0,.28);transform:translateX(100%);transition:transform .24s ease;z-index:1000;overflow-y:auto}
.tb-nav.open{transform:translateX(0)}
.tb-tab{height:auto;padding:15px 22px;border-bottom:1px solid var(--sap-card-border);border-left:3px solid transparent;font-size:15px;justify-content:flex-start}
.tb-tab.active{border-bottom-color:var(--sap-card-border);border-left-color:var(--sap-blue);background:rgba(0,112,242,.06)}
#main{padding:24px 14px 48px}
.tabs{overflow-x:auto}
.tab{white-space:nowrap;padding:10px 12px}
.site-head{padding:18px}
.site-head h1{font-size:20px}
}
@media(max-width:600px){
#main{padding:20px 12px 44px}
input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
.facts{grid-template-columns:1fr 1fr;gap:10px}
}
</style>
</head>
<body>
<div id="topbar">
  <a class="tb-logo" href="/"><span class="tb-logo-txt">ClearSky<span>OMEGA</span></span></a>
  <div class="tb-sep"></div><span class="tb-portal">EnergyOS</span>
  <div class="tb-nav">
    <a class="tb-tab" href="/">Portal</a>
    <a class="tb-tab" href="/marketplace.html">Marketplace</a>
    <a class="tb-tab" href="/projects.html">Projects</a>
    <a class="tb-tab active" href="/portfolio.html">Portfolio</a>
  </div>
  <div class="tb-spacer"></div>
  <div class="tb-user"><div class="tb-avatar" id="tb-avatar">–</div><span class="tb-name" id="tb-name"></span></div>
</div>
<div id="main">
  <div class="crumb"><a href="/portfolio.html">Portfolio</a> · <span id="crumb-site">…</span></div>
  <div id="msg"></div>
  <div class="site-head" id="site-head"><div class="loading"><div class="spin"></div>Loading the site…</div></div>
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-t="overview">Overview</button>
    <button class="tab" data-t="contacts">Contacts</button>
    <button class="tab" data-t="activity">Activity</button>
    <button class="tab" data-t="files">Files</button>
    <button class="tab" data-t="proforma">Pro forma</button>
  </div>
  <div class="tabpane active" id="pane-overview"></div>
  <div class="tabpane" id="pane-contacts"></div>
  <div class="tabpane" id="pane-activity"></div>
  <div class="tabpane" id="pane-files"></div>
  <div class="tabpane" id="pane-proforma"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/omega-tenant.js"></script>
<script>
(function () {
  'use strict';
  firebase.initializeApp((window.CLEARSKY_CONFIG||window.CFG||{}).firebase);
  var auth = firebase.auth();
  var ORG = '', SITE = '', DATA = null, CANEDIT = false, CANARCHIVE = false, TAB = 'overview';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function msg(html, ok) { document.getElementById('msg').innerHTML = html ? '<div class="' + (ok ? 'okmsg' : 'err') + '">' + html + '</div>' : ''; }
  function unk(v) { return v == null || v === ''; }
  function notProvided() { return '<span class="t-mut">Not provided</span>'; }
  function needsVer() { return '<span class="t-mut">Needs verification</span>'; }
  function org() {
    var w = window.OMEGA_WORKSPACE || {};
    if (w.orgId) return w.orgId;
    var u = auth.currentUser;
    return u && u.email ? (u.email.split('@')[1] || '').toLowerCase() : '';
  }
  function api(path, opts) {
    return auth.currentUser.getIdToken().then(function (t) {
      var h = { 'Authorization': 'Bearer ' + t };
      if (opts && opts.json) h['Content-Type'] = 'application/json';
      return fetch(path, { method: (opts && opts.method) || 'GET', headers: h, body: opts && opts.json ? JSON.stringify(opts.json) : undefined });
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && (j.message || j.error)) || ('HTTP ' + r.status));
        return j;
      });
    });
  }
  function post(action, extra) {
    var body = Object.assign({ org: ORG, site: SITE, action: action }, extra || {});
    return api('/api/site-crm', { method: 'POST', json: body });
  }
  function money(n) {
    if (!isFinite(n)) return '–';
    var a = Math.abs(n);
    var s = a >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : n.toFixed(0);
    return (n < 0 ? '−$' : '$') + s.replace('-', '');
  }
  function pct(n, d) {
    if (!isFinite(n)) return '–';
    return (n * 100).toFixed(d == null ? 2 : d) + '%';
  }

  /* ── header ── */
  function renderHead() {
    var s = DATA.site;
    document.getElementById('crumb-site').textContent = s.name || 'Site';
    document.title = (s.name || 'Site') + ' · ClearSky-OMEGA';
    var meter = s.meterOwned === true ? '<span class="pill pill-ok">Meter owned</span>'
      : s.meterOwned === false ? '<span class="pill pill-no">No meter</span>'
      : '<span class="pill pill-unk">Meter: needs verification</span>';
    var term = unk(s.termYearsRemaining) ? needsVer() : esc(s.termYearsRemaining) + ' years <span class="n">remaining (snapshot)</span>';
    var pods = s.screening && !unk(s.screening.pods) ? esc(s.screening.pods) + ' pods' : notProvided();
    var availKw = s.availablePowerMw != null ? Number(s.availablePowerMw) * 1000
      : (s.serviceCapacityKw != null && s.existingPeakKw != null ? Math.max(0, Number(s.serviceCapacityKw) - Number(s.existingPeakKw)) : null);
    var availBasis = s.availablePowerMw != null ? 'as entered'
      : (availKw != null ? 'service \u2212 peak, derived' : null);
    document.getElementById('site-head').innerHTML =
      '<h1>' + esc(s.name || 'Unnamed site') + '</h1>' +
      '<div class="loc">' + esc([s.city, s.state].filter(Boolean).join(', ') || 'Location not provided') + '</div>' +
      '<div class="facts">' +
      '<div class="fact"><div class="k">Installed chargers</div><div class="v">' + (unk(s.installedKw) ? notProvided() : esc(s.installedKw) + ' kW') + '</div><div class="n">nameplate, not approved capacity</div></div>' +
      '<div class="fact"><div class="k">Reported peak</div><div class="v">' + (unk(s.reportedPeakKw) ? notProvided() : esc(s.reportedPeakKw) + ' kW ' + (s.peakUnresolved ? '<span class="pill pill-warn">unresolved</span>' : '')) + '</div><div class="n">workbook statistic; definition in dispute</div></div>' +
      '<div class="fact"><div class="k">Meter</div><div class="v">' + meter + '</div><div class="n">ownership at this site</div></div>' +
      '<div class="fact"><div class="k">Remaining term</div><div class="v">' + term + '</div></div>' +
      '<div class="fact"><div class="k">Available power</div><div class="v">' + (availKw == null ? notProvided() : esc(availKw) + ' kW') + '</div><div class="n">' + (availBasis ? esc(availBasis) : 'for new load') + '</div></div>' +
      '<div class="fact"><div class="k">Screened pods</div><div class="v">' + pods + '</div><div class="n">Screening proxy \u00b7 unverified</div></div>' +
      '</div>';
    document.getElementById('tabs').style.display = 'flex';
  }

  /* ── overview ── */
  function renderOverview() {
    var s = DATA.site, sc = s.screening || {}, cm = s.commercial || {};
    var open = (DATA.followUps || []).length;
    document.getElementById('pane-overview').innerHTML =
      '<div class="grid2"><div class="card"><h3>Site facts</h3>' +
      fact('Address', s.address) + fact('External IDs', Object.keys(s.externalSiteIds || {}).map(function (k) { return k + ': ' + s.externalSiteIds[k]; }).join('; ')) +
      fact('Status', s.status) + fact('Tags', (s.tags || []).join(', ')) +
      (s.notes ? '<div style="margin-top:10px"><div class="li-meta">Notes</div><div class="li-body">' + esc(s.notes) + '</div></div>' : '') +
      '</div><div class="card"><h3>Screening · ' + esc(sc.label || 'none') + '</h3>' +
      fact('Screened kW', sc.screenKw) + fact('Pods', sc.pods) + fact('Reserve kW', sc.reserveKw) +
      '<div class="assume">A legacy screening proxy (75 kW IT per pod, PUE 1.2). <b>Not verified capacity.</b> ' + esc(sc.note || '') + '</div>' +
      '</div></div>' +
      '<div class="grid2"><div class="card"><h3>Commercial</h3>' +
      fact('Rent / month', cm.rentMonthly, '$') + fact('Revenue share', cm.revenueShare != null ? pct(cm.revenueShare) : null) + fact('kWh share', cm.kwhShare != null ? pct(cm.kwhShare) : null) +
      '</div><div class="card"><h3>Attention</h3>' +
      '<div class="li-body">' + (open ? '<span class="pill pill-warn">' + open + ' open follow-up' + (open > 1 ? 's' : '') + '</span>' : 'No open follow-ups.') + '</div>' +
      ((s.flags && s.flags.peakExceedsInstalled) ? '<div class="li-body" style="margin-top:8px"><span class="pill pill-warn">Reported peak exceeds installed kW</span> — surfaced, not clamped.</div>' : '') +
      ((s.flags && s.flags.meterUnknown) ? '<div class="li-body" style="margin-top:8px">Meter ownership ' + needsVer() + '.</div>' : '') +
      '</div></div>' +
      '<div class="grid2">' + usageCardHtml(s, fact) + (CANEDIT ? '<div class="card"><h3>Edit site facts</h3>' + editFormHtml(s) + '</div>' : '<div></div>') + '</div>';
    wireEditForm();
    function fact(k, v, pre) {
      return '<div style="margin-bottom:8px"><div class="li-meta">' + esc(k) + '</div><div style="font-size:13.5px">' + (unk(v) ? notProvided() : esc((pre || '') + v)) + '</div></div>';
    }
  }

  /* ── power & usage card ── */
  function usageCardHtml(s, fact) {
    var mu = s.monthlyUsageKwh, muHtml = '';
    if (Array.isArray(mu)) {
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      muHtml = '<div class="li-meta" style="margin:10px 0 4px">Monthly kWh</div><div style="font-size:12px;line-height:1.9">' +
        months.map(function (m, i) {
          return '<span style="display:inline-block;min-width:88px">' + m + ' <b>' + (mu[i] == null ? '\u2013' : Number(mu[i]).toLocaleString('en-US')) + '</b></span>';
        }).join('') + '</div>';
    }
    var lf = (s.annualUsageKwh != null && s.existingPeakKw) ? (Number(s.annualUsageKwh) / (Number(s.existingPeakKw) * 8760)) : null;
    return '<div class="card"><h3>Power &amp; usage</h3>' +
      fact('Available power', s.availablePowerMw != null ? s.availablePowerMw + ' MW' : null) +
      fact('Service capacity', s.serviceCapacityKw != null ? Number(s.serviceCapacityKw).toLocaleString('en-US') + ' kW' : null) +
      fact('Existing peak', s.existingPeakKw != null ? Number(s.existingPeakKw).toLocaleString('en-US') + ' kW' : null) +
      fact('Power price', s.powerPricePerKwh != null ? '$' + s.powerPricePerKwh + '/kWh' : null) +
      fact('Annual usage', s.annualUsageKwh != null ? Number(s.annualUsageKwh).toLocaleString('en-US') + ' kWh' : null) +
      fact('Load factor', lf != null && isFinite(lf) ? (lf * 100).toFixed(1) + '%' : null) +
      muHtml +
      (s.usageNotes ? '<div style="margin-top:10px"><div class="li-meta">Usage notes</div><div class="li-body">' + esc(s.usageNotes) + '</div></div>' : '') +
      '<div class="assume">Available power drives pod sizing on the Pro forma tab: one pod takes 90 kW of facility power (75 kW IT \u00d7 PUE 1.2).</div>' +
      '</div>';
  }

  /* ── edit site facts form ── */
  function editFormHtml(s) {
    function val(v) { return v == null ? '' : String(v); }
    function numIn(id, label, v, step) {
      return '<label class="fl">' + label + '</label><input type="number" id="' + id + '" value="' + esc(val(v)) + '"' + (step ? ' step="' + step + '"' : '') + ' style="width:100%">';
    }
    function txtIn(id, label, v) {
      return '<label class="fl">' + label + '</label><input type="text" id="' + id + '" value="' + esc(val(v)) + '" style="width:100%">';
    }
    var mu = Array.isArray(s.monthlyUsageKwh) ? s.monthlyUsageKwh.map(function (x) { return x == null ? '' : x; }).join(', ') : '';
    return '<div class="grid2"><div>' +
      txtIn('ef-name', 'Site name *', s.name) + txtIn('ef-city', 'City', s.city) + txtIn('ef-state', 'State', s.state) +
      txtIn('ef-address', 'Address', s.address) + txtIn('ef-status', 'Status', s.status) +
      txtIn('ef-tags', 'Tags (comma-separated)', (s.tags || []).join(', ')) + '</div><div>' +
      numIn('ef-installedKw', 'Installed chargers (kW)', s.installedKw) + numIn('ef-reportedPeakKw', 'Reported peak (kW)', s.reportedPeakKw) +
      '<label class="fl">Meter owned</label><select id="ef-meterOwned" class="inline" style="width:100%">' +
      '<option value=""' + (s.meterOwned == null ? ' selected' : '') + '>Unknown</option>' +
      '<option value="true"' + (s.meterOwned === true ? ' selected' : '') + '>Yes</option>' +
      '<option value="false"' + (s.meterOwned === false ? ' selected' : '') + '>No</option></select>' +
      numIn('ef-termYearsRemaining', 'Remaining term (years)', s.termYearsRemaining) + '</div></div>' +
      '<div class="grid2"><div>' +
      numIn('ef-availablePowerMw', 'Available power (MW)', s.availablePowerMw, '0.01') +
      numIn('ef-serviceCapacityKw', 'Service capacity (kW)', s.serviceCapacityKw) +
      numIn('ef-existingPeakKw', 'Existing peak (kW)', s.existingPeakKw) +
      numIn('ef-powerPricePerKwh', 'Power price ($/kWh)', s.powerPricePerKwh, '0.001') + '</div><div>' +

        termYearsRemaining: num('ef-termYearsRemaining'),
        availablePowerMw: num('ef-availablePowerMw'), serviceCapacityKw: num('ef-serviceCapacityKw'),
        existingPeakKw: num('ef-existingPeakKw'), powerPricePerKwh: num('ef-powerPricePerKwh'),
        annualUsageKwh: num('ef-annualUsageKwh'), monthlyUsageKwh: str('ef-monthlyUsageKwh'),
        usageNotes: str('ef-usageNotes')
      }).then(function (j) { msg(esc(j.note), true); load(true); })
        .catch(function (e) { msg(esc(e.message)); });

  }

        '<input type="text" id="lg-subject" placeholder="Subject" style="flex:2;min-width:180px">' +
        '<select id="lg-contact" class="inline"><option value="">No contact</option>' +

        '<textarea id="lg-body" placeholder="What happened, what was agreed…"></textarea>' +

  /* ── files ── */
  function renderFiles() {
    var html = '<div class="card"><h3>Documents</h3>';
    if (!DATA.files.length) html += '<div class="li-meta">No documents yet.</div>';
    html += DATA.files.map(function (f) {
      return '<div class="list-item"><div class="li-head"><span class="li-title">' + esc(f.name) + '</span>' +
        (f.shared ? '<span class="pill pill-ok">Shared</span>' : '<span class="pill pill-unk">Workspace only</span>') +
        '<span class="li-meta">' + esc(f.type || '') + ' · ' + esc(f.size || '') + '</span></div>' +

        '<div class="row" style="margin-top:6px;margin-bottom:0">' +
        '<a class="btn-ghost" style="text-decoration:none" href="/api/site-crm?org=' + encodeURIComponent(ORG) + '&site=' + encodeURIComponent(SITE) + '&file=' + encodeURIComponent(f.id) + '" data-tok>Download</a>' +
        (CANEDIT ? '<button class="btn-ghost" data-share="' + esc(f.id) + '" data-s="' + (f.shared ? '0' : '1') + '">' + (f.shared ? 'Unshare' : 'Share') + '</button>' : '') +

        '<div class="row"><input type="file" id="up-file">' +
        '<select id="up-cat" class="inline"><option value="">No category</option><option>agreement</option><option>bill</option><option>design</option><option>photo</option><option>report</option><option>other</option></select>' +
        '<label style="font-size:12.5px"><input type="checkbox" id="up-shared"> Shared</label></div>' +
        '<input type="text" id="up-note" placeholder="Note (optional)" style="width:100%;margin-bottom:10px">' +
        '<button class="btn" id="up-add">Upload</button> <span class="li-meta">PDF, PNG, JPG, XLSX, DOCX, CSV, TXT · up to 2 MB</span></div>';

    Array.prototype.forEach.call(document.querySelectorAll('[data-tok]'), function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        auth.currentUser.getIdToken().then(function (t) {
          return fetch(a.getAttribute('href'), { headers: { 'Authorization': 'Bearer ' + t } }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.blob();
          }).then(function (blob) {
            var u = URL.createObjectURL(blob), l = document.createElement('a');
            l.href = u; l.download = a.textContent.trim() || 'document'; document.body.appendChild(l); l.click();
            setTimeout(function () { URL.revokeObjectURL(u); l.remove(); }, 4000);
          });
        }).catch(function (e) { msg(esc(e.message)); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-share]'), function (b) {
      b.addEventListener('click', function () {
        post('file-share', { id: b.getAttribute('data-share'), shared: b.getAttribute('data-s') === '1' })
          .then(function (j) { msg(esc(j.note), true); load(); }).catch(function (e) { msg(esc(e.message)); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-farch]'), function (b) {
      b.addEventListener('click', function () {

      rd.onload = function () {
        var b64 = String(rd.result).split(',')[1] || '';
        msg('Uploading…', true);
        post('file-upload', { file: { name: f.name, base64: b64 }, category: document.getElementById('up-cat').value, note: document.getElementById('up-note').value, shared: document.getElementById('up-shared').checked })
          .then(function (j) { msg(esc(j.note), true); load(); }).catch(function (e) { msg(esc(e.message)); });
      };
      rd.readAsDataURL(f);
    });
  }

  /* ── pro forma ── */
  var SCEN = null;
  function irrText(r) {
    if (!r) return '<span class="t-mut">–</span>';
    return r.defined ? pct(r.annual) : '<span class="t-mut">Not defined</span>';
  }
  function renderProforma() {
    var s = DATA.site, sc = s.screening || {};
    var defPods = sc.pods != null ? sc.pods : 1;
    var availKw = s.availablePowerMw != null ? Number(s.availablePowerMw) * 1000
      : (s.serviceCapacityKw != null && s.existingPeakKw != null ? Math.max(0, Number(s.serviceCapacityKw) - Number(s.existingPeakKw)) : null);
    var availLine = availKw == null ? 'No available power entered \u2014 add it on the Overview tab to size from power.'
      : 'Available: ' + availKw.toLocaleString('en-US') + ' kW \u2192 ' + Math.floor(availKw / 90) + ' pods at 90 kW each' +
        (s.availablePowerMw != null ? ' (as entered)' : ' (service \u2212 peak, derived)');
    var hist = (DATA.proforma || []).map(function (p) {
      return '<div class="list-item"><div class="li-head"><span class="li-title">' + esc(p.label || p.scenarioId) + '</span>' +
        '<span class="li-meta">' + esc(p.createdAt || '') + ' · ' + esc(p.assumptionVersion || '') + '</span></div>' +
        '<div class="li-meta">Investor IRR ' + irrText(p.results && p.results.investorIrr) +
        ' · payback ' + (p.results && p.results.paybackMonth != null ? p.results.paybackMonth + ' mo' : '–') +
        ' · <a href="#" data-scen="' + esc(p.scenarioId) + '">open</a></div></div>';
    }).join('');
    var html = '<div class="card"><h3>Size it</h3>' +
      '<div class="row"><label class="fl" style="margin:0">Pods</label>' +
      '<input type="number" id="pf-pods" class="inline" min="1" max="100000" value="' + esc(defPods) + '" style="width:110px">' +
      (CANEDIT ? '<button class="btn-ghost" id="pf-size">Size pods from available power</button>' : '') +
      '<span class="li-meta" id="pf-avail">' + esc(availLine) + '</span></div>' +
      '<div class="row"><label class="fl" style="margin:0">Discount rate</label>' +
      '<input type="number" id="pf-disc" class="inline" min="0" max="1" step="0.01" value="0.08" style="width:90px">' +
      '<label class="fl" style="margin:0">Assumptions</label>' +
      '<select id="pf-ver" class="inline"><option value="omega-compute-v1">omega-compute-v1</option><option value="evcs-compute-v1">evcs-compute-v1 (legacy workbook)</option></select>' +
      '<input type="text" id="pf-label" placeholder="Scenario label (optional)" style="flex:1;min-width:160px">' +
      (CANEDIT ? '<button class="btn" id="pf-run">Run pro forma</button>' : '') + '</div>' +
      (s.powerPricePerKwh != null && CANEDIT ?
        '<div class="row"><label style="font-size:12.5px"><input type="checkbox" id="pf-useprice" checked> Use this site\u2019s power price ($' + esc(s.powerPricePerKwh) + '/kWh) instead of the $0.15 default</label></div>' : '') +
      '<div class="assume"><b>Assumption set <span id="pf-vername">omega-compute-v1</span></b>: 75 kW IT/pod \u00b7 PUE 1.2 (90 kW facility per pod) \u00b7 48 GPUs/pod \u00b7 $2.46375/GPU-hr \u00b7 85% billable \u00b7 98% uptime \u00b7 \u22128%/yr GPU price \u00b7 $0.15/kWh power \u00b7 3%/yr escalation \u00b7 $5,000/mo fixed opex \u00b7 8% network + 2% maintenance of revenue \u00b7 capex $1,986,375 + $100,000 BESS + $25,000 liquidity per pod \u00b7 100% to investor until capital recovered, then 80/20. 60 months. A screening case, not a return promise.</div></div>';
    html += '<div id="pf-result"></div>';
    html += '<div class="card"><h3>Saved scenarios</h3>' + (hist || '<div class="li-meta">No runs yet.</div>') + '</div>';
    document.getElementById('pane-proforma').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-scen]'), function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        var id = a.getAttribute('data-scen');
        api('/api/site-crm?org=' + encodeURIComponent(ORG) + '&site=' + encodeURIComponent(SITE) + '&action=proforma-get&scenarioId=' + encodeURIComponent(id))
          .then(function (j) { SCEN = j.scenario; renderScen(); })
          .catch(function (e) { msg(esc(e.message)); });
      });
    });
    var verSel = document.getElementById('pf-ver');
    if (verSel) verSel.addEventListener('change', function () {
      document.getElementById('pf-vername').textContent = verSel.value;
    });
    function pfOverrides() {
      var use = document.getElementById('pf-useprice');
      if (use && use.checked && s.powerPricePerKwh != null) return { powerPricePerKwh: Number(s.powerPricePerKwh) };
      return null;
    }
    function pfBody(extra) {
      return Object.assign({
        discountRateAnnual: Number(document.getElementById('pf-disc').value),
        label: document.getElementById('pf-label').value,
        assumptionVersion: verSel ? verSel.value : 'omega-compute-v1',
        overrides: pfOverrides()
      }, extra || {});
    }
    var sizeBtn = document.getElementById('pf-size');
    if (sizeBtn) sizeBtn.addEventListener('click', function () {
      msg('Sizing from available power\u2026', true);
      post('proforma-run', pfBody({ sizeFromPower: true }))
        .then(function (j) { SCEN = j.scenario; msg(esc(j.note), true); load(true); renderScen(); })
        .catch(function (e) { msg(esc(e.message)); });
    });
    var run = document.getElementById('pf-run');
    if (run) run.addEventListener('click', function () {
      msg('Running\u2026', true);
      post('proforma-run', pfBody({ pods: Number(document.getElementById('pf-pods').value) }))
        .then(function (j) { SCEN = j.scenario; msg(esc(j.note), true); load(true); renderScen(); })
        .catch(function (e) { msg(esc(e.message)); });
    });
    if (SCEN) renderScen();
  }
  function renderScen() {
    var el = document.getElementById('pf-result');
    if (!el || !SCEN) return;
    var r = SCEN.results || {};
    var sz = r.sizing || (SCEN.inputs && SCEN.inputs.sizeFromPowerKw != null
      ? { pods: r.pods, powerKwAvailable: SCEN.inputs.sizeFromPowerKw, powerKwPerPod: 90, basis: SCEN.inputs.sizeBasis } : null);
    var sizingHtml = sz ? '<div class="li-meta" style="margin:6px 0 10px">Sized <b>' + esc(sz.pods) + ' pods</b> from ' +
      Number(sz.powerKwAvailable).toLocaleString('en-US') + ' kW available (' +
      (sz.basis === 'direct' ? 'as entered' : 'service \u2212 peak, derived') + ') at ' + esc(sz.powerKwPerPod) + ' kW per pod.</div>' : '';
    var rows = (SCEN.cashFlows || []).filter(function (f, i) { return i % 12 === 0 || f.month === 60; }).map(function (f) {
      return '<tr><td>' + f.month + '</td><td>' + money(f.revenue) + '</td><td>' + money(f.powerCost) + '</td><td>' + money(f.otherCost) + '</td><td>' + money(f.spvCash) + '</td><td>' + money(f.investorCash) + '</td></tr>';
    }).join('');
    el.innerHTML = '<div class="card"><h3>' + esc(SCEN.label || SCEN.scenarioId) + ' <span class="li-meta">' + esc(SCEN.assumptionVersion || '') + ' \u00b7 ' + esc(SCEN.createdAt || '') + '</span></h3>' +
      sizingHtml +
      '<div class="facts">' +
      '<div class="fact"><div class="k">Project IRR</div><div class="v">' + irrText(r.projectIrr) + '</div><div class="n">annualized, pre-tax, no exit value</div></div>' +
      '<div class="fact"><div class="k">Investor IRR</div><div class="v">' + irrText(r.investorIrr) + '</div><div class="n">annualized, after the waterfall</div></div>' +
      '<div class="fact"><div class="k">NPV</div><div class="v">' + money(r.npv) + '</div><div class="n">at ' + pct(r.discountRateAnnual, 0) + ' discount</div></div>' +
      '<div class="fact"><div class="k">Payback</div><div class="v">' + (r.paybackMonth != null ? r.paybackMonth + ' mo' : '<span class="t-mut">–</span>') + '</div><div class="n">capital recovered</div></div>' +
      '<div class="fact"><div class="k">Investor capital</div><div class="v">' + money(r.investorCapital) + '</div><div class="n">' + esc(r.pods) + ' pods · ' + esc(r.itKw) + ' kW IT</div></div>' +
      '</div>' +
      '<h3 style="margin-top:16px">Annual cash flows</h3><table class="cf"><tr><th>Mo</th><th>Revenue</th><th>Power</th><th>Opex+res</th><th>SPV</th><th>Investor</th></tr>' + rows + '</table>' +
      '<div class="assume">Scenario <b>' + esc(SCEN.scenarioId) + '</b> · inputs hash <span style="font-family:monospace">' + esc((SCEN.inputsHash || '').slice(0, 16)) + '…</span> · immutable: a re-run creates a new scenario, this one never changes.</div></div>';
  }

  /* ── boot ── */
  function showTab(t) {
    TAB = t;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('active', b.getAttribute('data-t') === t); });
    Array.prototype.forEach.call(document.querySelectorAll('.tabpane'), function (p) { p.classList.toggle('active', p.id === 'pane-' + t); });
    if (t === 'overview') renderOverview();
    if (t === 'contacts') renderContacts();
    if (t === 'activity') renderActivity();
    if (t === 'files') renderFiles();
    if (t === 'proforma') renderProforma();
  }
  function load(keepTab) {
    msg('');
    api('/api/site-crm?org=' + encodeURIComponent(ORG) + '&site=' + encodeURIComponent(SITE)).then(function (j) {
      DATA = j; CANEDIT = !!j.canEdit; CANARCHIVE = !!j.canArchive;
      renderHead();
      showTab(keepTab ? TAB : 'overview');
    }).catch(function (e) {
      document.getElementById('site-head').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.addEventListener('click', function () { showTab(b.getAttribute('data-t')); });
  });
  auth.onAuthStateChanged(function (u) {
    if (!u) { window.location.href = '/'; return; }
    document.getElementById('tb-avatar').textContent = (u.email || '?').charAt(0).toUpperCase();
    document.getElementById('tb-name').textContent = u.displayName || u.email;
    var m = /[?&]site=([^&]+)/.exec(window.location.search);
    SITE = m ? decodeURIComponent(m[1]) : '';
    if (!SITE) { document.getElementById('site-head').innerHTML = '<div class="err">No site selected. <a href="/portfolio.html">Back to the portfolio</a>.</div>'; return; }
    if (window.OmegaTenant && OmegaTenant.boot) {
      OmegaTenant.boot().then(function () { ORG = org(); load(); }).catch(function () { ORG = org(); load(); });
    } else { ORG = org(); load(); }
  });
})();

/* ── mobile nav drawer (same pattern as projects.html) ── */
(function () {
  var bar = document.getElementById('topbar'), nav = document.querySelector('.tb-nav');
  if (!bar || !nav || document.getElementById('tb-burger')) return;
  var b = document.createElement('button');
  b.id = 'tb-burger'; b.className = 'tb-burger'; b.setAttribute('aria-label', 'Menu'); b.setAttribute('aria-expanded', 'false');
  b.innerHTML = '<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
  bar.appendChild(b);
  var s = document.createElement('div'); s.className = 'tb-scrim'; s.id = 'tb-scrim'; document.body.appendChild(s);
  var navHome = nav.parentNode, navNext = nav.nextSibling;
  function closeNav() { nav.classList.remove('open'); s.classList.remove('open'); b.setAttribute('aria-expanded', 'false'); }
  function toggleNav() { var o = nav.classList.toggle('open'); s.classList.toggle('open', o); b.setAttribute('aria-expanded', o ? 'true' : 'false'); }
  function place() {
    if (window.innerWidth <= 900) { if (nav.parentNode !== document.body) document.body.appendChild(nav); }
    else { closeNav(); if (nav.parentNode !== navHome) { if (navNext && navNext.parentNode === navHome) navHome.insertBefore(nav, navNext); else navHome.appendChild(nav); } }
  }
  place(); window.addEventListener('resize', place);
  b.addEventListener('click', toggleNav); s.addEventListener('click', closeNav);
  nav.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.tb-tab')) closeNav(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
})();
</script>
