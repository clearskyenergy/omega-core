<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sponsor console · SkyFund</title>
<link rel="icon" type="image/svg+xml" href="/portals/skyfund/brand/skyfund-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  ═══════════════════════════════════════════════════════════════════════════
  ClearSky-OMEGA · SkyFund — sponsor console
  © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.

  Where a developer (a tenant user) lists a project for community
  investment, and where ClearSky reviews, launches, closes and declares
  distributions. Same standalone footing as index.html next to it: no
  omega-tenant.js, org resolved from the signed-in email with the same alias
  fold the rules use, staff may act in any org via ?org=.

  WHAT THE BROWSER MAY WRITE (firestore.rules → cf_campaigns)
    · a DRAFT campaign, all of it, except the counters and the status
    · narrative fields on a LIVE one (story, tagline, images, faq, documents, risks)
    · an update post under a live campaign
  EVERYTHING ELSE is a POST to /api/invest: submit for review, launch,
  return, close, confirm a manual payment, refund, declare a distribution.
  The buttons are hidden by role here as a courtesy; the server is the gate.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#F5F4F0;--surface:#fff;--ink:#14171A;--sub:#5B6672;--faint:#8A94A0;--line:rgba(20,23,26,.16);--soft:rgba(20,23,26,.09);--navy:#16202B;--blue:#2B5FA8;--blue-hi:#3F76C4;--blue-dim:rgba(43,95,168,.10);--gold:#C77A00;--gold-dim:rgba(199,122,0,.12);--green:#2E7D5B;--green-dim:rgba(46,125,91,.12);--red:#D9482B;--red-dim:rgba(217,72,43,.10);--purple:#6D5BD0;--r:6px;--rs:4px;--mono:'IBM Plex Mono',ui-monospace,monospace;--head:'Archivo','Inter',sans-serif}
body{margin:0;font:400 14px/1.5 'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(rgba(43,95,168,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,95,168,.05) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
h1,h2,h3{font-family:var(--head);letter-spacing:-.02em;margin:0}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;position:sticky;top:0;z-index:20}
.top .brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--head);font-weight:800;font-size:15px}
.top .brand img{width:26px;height:26px;border-radius:6px;display:block}
.top .brand small{display:block;font:500 10px/1 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:3px}
.top a.lnk{color:rgba(255,255,255,.75);font-weight:600;font-size:13px}
.top .who{margin-left:auto;font-size:12.5px;color:rgba(255,255,255,.7)}
.top .who b{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:9px 14px;font-weight:600;font-size:13px;line-height:1;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-hi)}
.btn-gold{background:var(--gold);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn-ghost:hover{background:rgba(20,23,26,.04)}
.btn-light{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.16)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;max-width:1360px;margin:0 auto;padding:20px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;align-self:start;position:sticky;top:72px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}
.list .h{padding:12px 14px;border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:8px}
.list .h h2{font-size:14px;flex:1}
.list .items{overflow:auto;flex:1}
.item{display:block;padding:11px 14px;border-bottom:1px solid var(--soft);cursor:pointer}
.item:hover{background:rgba(20,23,26,.03)}
.item.on{background:var(--blue-dim);box-shadow:inset 3px 0 0 var(--blue)}
.item b{display:block;font-size:13.5px;line-height:1.3}
.item .m{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:8px;align-items:center}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:rgba(20,23,26,.08);color:var(--sub)}
.pill.draft{background:rgba(20,23,26,.08)}.pill.review{background:var(--gold-dim);color:var(--gold)}.pill.live{background:var(--green-dim);color:var(--green)}.pill.funded{background:var(--blue-dim);color:var(--blue)}.pill.closed{background:var(--red-dim);color:var(--red)}
.pill.pending{background:var(--gold-dim);color:var(--gold)}.pill.paid,.pill.verified,.pill.active,.pill.on{background:var(--green-dim);color:var(--green)}.pill.refunded,.pill.cancelled,.pill.failed,.pill.suspended,.pill.off{background:var(--red-dim);color:var(--red)}.pill.processing,.pill.paying{background:var(--blue-dim);color:var(--blue)}.pill.refunding,.pill.unbanked,.pill.partial,.pill.declared,.pill.document,.pill.none{background:var(--gold-dim);color:var(--gold)}
.adm-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.adm-h h2{flex:1}.adm-h input[type=text]{width:240px}
td .mini{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}td select{padding:4px 6px;font-size:12px;width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.seg button{background:#fff;border:0;padding:6px 10px;font-size:12px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--navy);color:#fff}
.main{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:4px}
.card .sub{color:var(--sub);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .wide{grid-column:1/-1}
label{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:4px;letter-spacing:.02em}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--rs);background:#fff}
textarea{min-height:90px;resize:vertical}
.hint{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.msg{font-size:12.5px;color:var(--sub);min-height:18px}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--bg);border:1px solid var(--soft);border-radius:var(--r);padding:12px}
.tile span{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile b{font-family:var(--mono);font-size:19px;font-weight:500}
.rows{border:1px solid var(--soft);border-radius:var(--rs);overflow:hidden}
.rows .r{display:grid;grid-template-columns:2fr 1fr 3fr 1fr auto;gap:8px;padding:8px;border-bottom:1px solid var(--soft);align-items:center}
.rows .r:last-child{border-bottom:0}
.rows .r input{padding:6px 8px;font-size:13px}
.rows .r.faq{grid-template-columns:1fr 2fr auto}
.rows .r.doc{grid-template-columns:1fr 2fr auto}
.rows .r.risk{grid-template-columns:1fr auto}
.rows .r button{background:none;border:0;color:var(--red);font-size:16px;line-height:1}
.add{margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
td.num,th.num{text-align:right;font-family:var(--mono)}
.note{background:var(--gold-dim);border:1px solid rgba(199,122,0,.3);border-radius:var(--r);padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.staff{border-color:rgba(109,91,208,.4)}
.staff h2::before{content:'STAFF';font:700 10px 'Inter',sans-serif;letter-spacing:.1em;color:#fff;background:var(--purple);padding:3px 6px;border-radius:3px;margin-right:8px;vertical-align:middle}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:120px;aspect-ratio:16/9;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line);background:var(--navy)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:3px;font-size:12px;padding:2px 6px}
.empty{padding:40px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.gate{max-width:440px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px}
.gate h1{font-size:22px;margin-bottom:6px}
.gate p{color:var(--sub);font-size:13.5px;margin:0 0 16px}
.gate input{margin-bottom:8px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.list{position:static;max-height:none}.rows .r{grid-template-columns:1fr 1fr}.rows .r.faq,.rows .r.doc{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/portals/skyfund/"><img src="/portals/skyfund/brand/skyfund-icon.svg" alt=""><span>SkyFund<small>Sponsor console</small></span></a>
  <a class="lnk" href="/portals/skyfund/" target="_blank" rel="noopener">Storefront ↗</a>
  <a class="lnk" href="/" id="backPortal">Portal</a>
  <div class="who" id="who"></div>
  <button class="btn btn-light btn-sm hide" id="btnOut">Sign out</button>
</header>

<div id="gate" class="gate hide">
  <h1>Sponsor sign-in</h1>
  <p>Sign in with your ClearSky-OMEGA workspace email. Campaigns are listed under your organisation.</p>
  <button class="btn btn-ghost" id="gGoogle" style="width:100%;margin-bottom:12px">Continue with Google</button>
  <input type="text" id="gEmail" placeholder="you@company.com" autocomplete="email">
  <input type="password" id="gPass" placeholder="Password" autocomplete="current-password" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--rs)">
  <button class="btn btn-primary" id="gEmailBtn" style="width:100%">Sign in</button>
  <div class="msg" id="gMsg"></div>
</div>

<div id="app" class="layout hide">
  <aside class="list">
    <div class="h"><h2 id="listTitle">My campaigns</h2><button class="btn btn-ghost btn-sm hide" id="btnAdmin">Admin</button><button class="btn btn-primary btn-sm" id="btnNew">+ New</button></div>
    <div class="h hide" id="staffSeg"><div class="seg"><button class="on" data-scope="mine">Mine</button><button data-scope="review">Review queue</button><button data-scope="live">Live</button><button data-scope="all">All</button></div></div>
    <div class="items" id="items"><div class="empty" style="border:0">Loading…</div></div>
  </aside>
  <main class="main" id="main"><div class="empty">Pick a campaign on the left, or start a new one.</div></main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="/config.js"></script>
<script>
(function () {
'use strict';
var cfg = window.CLEARSKY_CONFIG || {};
/* No SDK (blocked CDN, offline kiosk) must not be a blank page: show the gate
   and say why, instead of dying on the first `firebase.` below. */
if (typeof firebase === 'undefined') {
  document.getElementById('gate').className = 'gate';
  document.getElementById('gMsg').textContent = 'Sign-in is unavailable: the Firebase SDK did not load. Check the connection and reload.';
  document.getElementById('gMsg').className = 'msg err';
  return;
}
if (!firebase.apps.length) firebase.initializeApp(cfg.firebase || cfg);
var auth = firebase.auth(), db = firebase.firestore(), storage = firebase.storage();
var FV = firebase.firestore.FieldValue;
var STAFF = ['csebuilders.com', 'clearsky-usa.com'];
var TYPES = [['compute','Compute container / data center'],['microgrid','Microgrid'],['bess','Battery storage'],['solar','Solar'],['ev','EV charging']];
var KINDS = [['ppa','PPA revenue'],['compute','Compute / hosting revenue'],['hybrid','PPA + compute']];

var S = { user: null, org: '', staff: false, scope: 'mine', list: [], cur: null, pledges: [], dists: [], updates: [] };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function usd(n) { return '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
function orgOf(e) { var d = String(e || '').toLowerCase().split('@')[1] || ''; return d === 'fenecon.de' || d === 'fenecon.us' ? 'fenecon.com' : d; }
function val(id) { var el = $(id); return el ? el.value : ''; }
function num(id) { var v = val(id); return v === '' ? null : Number(v); }
function dateOf(v) { if (!v) return null; if (v.toDate) return v.toDate(); var d = new Date(v); return isNaN(d.getTime()) ? null : d; }
function fmtDate(v) { var d = dateOf(v); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'; }
function isoDate(v) { var d = dateOf(v); return d ? d.toISOString().slice(0, 10) : ''; }
function msg(id, text, cls) { var m = $(id); if (!m) return; m.className = 'msg ' + (cls || ''); m.textContent = text || ''; }
function api(body) {
  return S.user.getIdToken().then(function (tok) {
    return fetch('/api/invest', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(body) });
  }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
}

/* ── auth ─────────────────────────────────────────────────────────────── */
$('gGoogle').onclick = function () { var p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); auth.signInWithPopup(p)['catch'](function (e) { msg('gMsg', e.message, 'err'); }); };
$('gEmailBtn').onclick = function () { auth.signInWithEmailAndPassword(val('gEmail').trim(), $('gPass').value)['catch'](function (e) { msg('gMsg', e.message, 'err'); }); };
$('btnOut').onclick = function () { auth.signOut().then(function () { location.reload(); }); };
auth.onAuthStateChanged(function (u) {
  S.user = u || null;
  if (!u) { $('gate').className = 'gate'; $('app').className = 'layout hide'; $('btnOut').className = 'btn btn-light btn-sm hide'; $('who').textContent = ''; return; }
  /* The admin team: ClearSky's domains, or an active omega_staff admin from
     any domain (isOmegaAdmin() in the rules; isPlatformAdmin() in the API).
     The console mirrors that so the right buttons appear; the server decides. */
  var domainStaff = STAFF.indexOf(orgOf(u.email)) >= 0;
  var resolve = domainStaff ? Promise.resolve(true)
    : db.collection('omega_staff').doc(u.uid).get().then(function (d) { return d.exists && d.data().active !== false && d.data().role === 'admin'; })['catch'](function () { return false; });
  resolve.then(function (isStaff) {
    S.staff = isStaff;
    var q = new URLSearchParams(location.search);
    S.org = (S.staff && q.get('org')) ? String(q.get('org')).toLowerCase() : orgOf(u.email);
    $('gate').className = 'gate hide'; $('app').className = 'layout'; $('btnOut').className = 'btn btn-light btn-sm';
    $('who').innerHTML = '<b>' + esc(u.email) + '</b> · ' + esc(S.org) + (S.staff ? ' · admin' : '');
    if (S.staff) { $('staffSeg').className = 'h'; $('btnAdmin').className = 'btn btn-ghost btn-sm'; }
    loadList();
    if (S.staff && location.hash === '#admin') renderAdmin();
  });
});
$('btnAdmin').onclick = function () { location.hash = '#admin'; renderAdmin(); };

/* ── list ─────────────────────────────────────────────────────────────── */
function loadList() {
  var q;
  if (S.scope === 'mine') q = db.collection('cf_campaigns').where('sponsorOrgId', '==', S.org);
  else if (S.scope === 'review') q = db.collection('cf_campaigns').where('status', '==', 'review');
  else if (S.scope === 'live') q = db.collection('cf_campaigns').where('status', 'in', ['live', 'funded']);
  else q = db.collection('cf_campaigns');
  $('listTitle').textContent = { mine: 'My campaigns', review: 'Review queue', live: 'Live & funded', all: 'All campaigns' }[S.scope];
  return q.get().then(function (snap) {
    var out = []; snap.forEach(function (d) { var c = d.data(); c.id = d.id; out.push(c); });
    out.sort(function (a, b) { return (dateOf(b.updatedAt) || 0) - (dateOf(a.updatedAt) || 0); });
    S.list = out; paintList();
  }).catch(function (e) { $('items').innerHTML = '<div class="empty" style="border:0">' + esc(e.message) + '</div>'; });
}
function paintList() {
  $('items').innerHTML = S.list.length ? S.list.map(function (c) {
    return '<a class="item' + (S.cur && S.cur.id === c.id ? ' on' : '') + '" data-id="' + esc(c.id) + '"><b>' + esc(c.title || 'Untitled campaign') + '</b><div class="m"><span class="pill ' + esc(c.status) + '">' + esc(c.status) + '</span><span>' + usd(c.raised) + ' / ' + usd(c.goal) + '</span>' + (S.scope !== 'mine' ? '<span>' + esc(c.sponsorOrgId) + '</span>' : '') + '</div></a>';
  }).join('') : '<div class="empty" style="border:0">Nothing here yet.</div>';
  var its = document.querySelectorAll('.item'); for (var i = 0; i < its.length; i++) its[i].onclick = function () { open(this.getAttribute('data-id')); };
}
var segs = document.querySelectorAll('#staffSeg button');
for (var si = 0; si < segs.length; si++) segs[si].onclick = function () { for (var k = 0; k < segs.length; k++) segs[k].className = ''; this.className = 'on'; S.scope = this.getAttribute('data-scope'); loadList(); };
$('btnNew').onclick = function () {
  S.cur = { id: null, status: 'draft', sponsorOrgId: S.org, type: 'compute', unitPrice: 100, minInvestment: 100, goal: 500000, offer: { kind: 'compute', sharePct: 40, termYears: 10, distributableAnnual: 0, escalatorPct: 2, degradationPct: 0, codMonths: 6, platformFeePct: 3 }, perks: [{ id: 'p1', title: 'Backer', minAmount: 100, desc: 'Quarterly distributions and the project update feed.' }], faq: [], documents: [], risks: [], images: [], raised: 0, unitsSold: 0, backers: 0 };
  paintList(); renderEditor();
};
function open(id) {
  for (var i = 0; i < S.list.length; i++) if (S.list[i].id === id) { S.cur = S.list[i]; break; }
  paintList(); renderEditor();
  if (S.cur.status !== 'draft') loadOps();
}

/* ── editor ───────────────────────────────────────────────────────────── */
function renderEditor() {
  var c = S.cur, o = c.offer || {}, sz = c.sizing || {}, loc = c.location || {};
  var editable = c.status === 'draft';
  var narrative = c.status === 'live' || c.status === 'funded';
  var m = $('main');
  m.innerHTML =
    (c.reviewNote && c.status === 'draft' ? '<div class="note"><b>Returned by ClearSky:</b> ' + esc(c.reviewNote) + '</div>' : '') +
    (c.status === 'review' ? '<div class="note">Submitted for review. ClearSky will launch it or return it with notes. Fields are locked while it is being checked.</div>' : '') +
    '<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="flex:1">' + (c.id ? esc(c.title || 'Untitled') : 'New campaign') + '</h2><span class="pill ' + esc(c.status) + '">' + esc(c.status) + '</span>' + (c.id && c.status !== 'draft' ? '<a class="btn btn-ghost btn-sm" href="/portals/skyfund/#/c/' + esc(c.slug || c.id) + '" target="_blank" rel="noopener">View listing ↗</a>' : '') + '</div>' +
    (c.status !== 'draft' ? '<div class="tiles" style="margin-top:12px"><div class="tile"><span>Raised</span><b>' + usd(c.raised) + '</b></div><div class="tile"><span>Goal</span><b>' + usd(c.goal) + '</b></div><div class="tile"><span>Units sold</span><b>' + (Number(c.unitsSold) || 0).toLocaleString('en-US') + ' / ' + (Number(c.unitsTotal) || 0).toLocaleString('en-US') + '</b></div><div class="tile"><span>Investors</span><b>' + (Number(c.backers) || 0) + '</b></div><div class="tile"><span>Target yield</span><b>' + (c.headline ? Number(c.headline.targetYieldPct).toFixed(1) + '%' : '—') + '</b></div><div class="tile"><span>Deadline</span><b style="font-size:14px">' + fmtDate(c.deadline) + '</b></div></div>' : '') + '</div>' +

    '<div class="card"><h2>The project</h2><p class="sub">What investors see on the card and at the top of the page.</p><div class="grid">' +
      '<div class="wide"><label>Title</label><input type="text" id="fTitle" value="' + esc(c.title || '') + '" placeholder="1 MW AI compute container · Joliet, IL"' + (editable ? '' : ' disabled') + '></div>' +

      '<div><label>Minimum investment (USD)</label><input type="number" id="ruMin" value="' + (r.minInvestment != null ? r.minInvestment : 100) + '"></div>' +
      '<div><label>Maximum investment (USD)</label><input type="number" id="ruMax" value="' + (r.maxInvestment != null ? r.maxInvestment : 250000) + '"></div>' +
      '<div><label>Non-accredited annual cap (USD)</label><input type="number" id="ruCap" value="' + (r.nonAccreditedAnnualCap != null ? r.nonAccreditedAnnualCap : 2500) + '"></div>' +
      '<div><label>Accreditation required above (USD)</label><input type="number" id="ruAcc" value="' + (r.accreditedRequiredAbove != null ? r.accreditedRequiredAbove : 25000) + '"></div>' +
      '<div><label>Allowed countries (ISO codes)</label><input type="text" id="ruCty" value="' + esc((r.allowedCountries || ['US']).join(', ')) + '"></div>' +
      '<div><label>Identity verification</label><label class="mini" style="margin-top:8px"><input type="checkbox" id="ruKyc"' + (r.requireKyc ? ' checked' : '') + '> required before investing</label></div>' +
    '</div><div class="bar"><button class="btn btn-primary" id="ruSave">Save rules</button><span class="msg" id="ruMsg"></span></div></div>' +

    '<div class="card"><div class="adm-h"><h2>Distributions &amp; payouts</h2>' + (Object.keys(years).length ? '<select id="csvYear">' + Object.keys(years).sort().map(function (y) { return '<option>' + y + '</option>'; }).join('') + '</select><button class="btn btn-ghost btn-sm" id="csvBtn">Export payouts CSV</button>' : '') + '</div><p class="sub">A declared distribution is paid out with one click: holders with a verified bank are paid over the rail; others are listed as unbanked and marked by hand. The CSV is the year\'s payout record for the tax preparer.</p>' +
    (a.dists.length ? '<div style="overflow-x:auto"><table><tr><th>Project</th><th>Period</th><th>Declared</th><th class="num">Crowd pool</th><th class="num">Per unit</th><th>Status</th><th></th></tr>' + a.dists.sort(function (x, y) { return (y.createdAtMs || 0) - (x.createdAtMs || 0); }).map(function (d) { return '<tr><td>' + esc(d.campaignTitle || d.campaignId) + '</td><td>' + esc(d.period) + '</td><td>' + fmtDate(d.createdAt) + '</td><td class="num">' + usd(d.crowdPool) + '</td><td class="num">$' + Number(d.perUnit || 0).toFixed(4) + '</td><td><span class="pill ' + esc(d.status) + '">' + esc(d.status) + '</span>' + (d.payoutCounts ? ' <span class="hint" style="display:inline">' + d.payoutCounts.paid + '/' + d.payoutCounts.total + ' paid' + (d.payoutCounts.unbanked ? ', ' + d.payoutCounts.unbanked + ' unbanked' : '') + (d.payoutCounts.failed ? ', ' + d.payoutCounts.failed + ' failed' : '') + '</span>' : '') + '</td><td>' + (d.status === 'declared' ? '<button class="btn btn-green btn-sm" data-payout2="' + esc(d.id) + '">Pay out</button>' : '') + '</td></tr>'; }).join('') + '</table></div>' : '<div class="hint">Nothing declared yet.</div>') +
    (openPay.length ? '<h2 style="margin-top:16px;font-size:14px">Open payouts</h2><div style="overflow-x:auto"><table><tr><th>Investor</th><th>Project · period</th><th class="num">Amount</th><th>Status</th><th></th></tr>' + openPay.map(function (x) { return '<tr><td>' + esc(x.investorName || '') + '<div class="hint">' + esc(x.investorEmail || x.investorUid) + '</div></td><td>' + esc(x.campaignTitle || x.campaignId) + ' · ' + esc(x.period || '') + '</td><td class="num">' + usd(x.amount) + '</td><td><span class="pill ' + esc(x.status) + '">' + esc(x.status) + '</span>' + (x.failure && x.failure.reason ? '<div class="hint">' + esc(x.failure.reason) + '</div>' : '') + '</td><td>' + (x.status === 'unbanked' || x.status === 'failed' ? '<button class="btn btn-green btn-sm" data-pmark="' + esc(x.id) + '" data-st="paid">Mark paid</button> ' : '') + (x.status !== 'failed' && x.status !== 'processing' ? '<button class="btn btn-ghost btn-sm" data-pmark="' + esc(x.id) + '" data-st="failed">Mark failed</button>' : '') + '</td></tr>'; }).join('') + '</table></div>' : '') + '</div>' +

    (refundDue.length ? '<div class="card"><h2>Refunds due by hand</h2><p class="sub">Wire and unbanked money that has to be returned outside the rail. Mark each once it is sent.</p><table><tr><th>Investor</th><th>Project</th><th class="num">Amount</th><th>Note</th><th></th></tr>' + refundDue.map(function (p) { return '<tr><td>' + esc(p.investorName || '') + '<div class="hint">' + esc(p.investorEmail) + '</div></td><td>' + esc(p.campaignTitle) + '</td><td class="num">' + usd(p.amount) + '</td><td class="hint">' + esc(p.refundNote || p.refundError || '') + '</td><td>' + (p.status === 'paid' ? '<button class="btn btn-ghost btn-sm" data-refmanual="' + esc(p.id) + '">Mark refunded</button>' : '<span class="pill ' + esc(p.status) + '">' + esc(p.status) + '</span>') + '</td></tr>'; }).join('') + '</table></div>' : '');

  $('admQ').oninput = function () { S.admin.q = this.value; paintAdmin(); var el = $('admQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
  function each(sel, fn) { var els = document.querySelectorAll(sel); for (var i = 0; i < els.length; i++) fn(els[i]); }
  each('[data-kyc]', function (el) { el.onchange = function () { api({ action: 'investor', uid: this.getAttribute('data-kyc'), kyc: this.value }).then(renderAdmin)['catch'](function (e) { alert(e.message); }); }; });
  each('[data-accr]', function (el) { el.onchange = function () { api({ action: 'investor', uid: this.getAttribute('data-accr'), accreditedVerified: this.checked }).then(renderAdmin)['catch'](function (e) { alert(e.message); }); }; });
  each('[data-susp]', function (el) { el.onclick = function () { var to = this.getAttribute('data-to'); if (!window.confirm((to === 'suspended' ? 'Suspend' : 'Reactivate') + ' this investor?')) return; api({ action: 'investor', uid: this.getAttribute('data-susp'), status: to }).then(renderAdmin)['catch'](function (e) { alert(e.message); }); }; });
  $('ruSave').onclick = function () {
    msg('ruMsg', 'Saving…');
    api({ action: 'settings', rules: { minInvestment: num('ruMin'), maxInvestment: num('ruMax'), nonAccreditedAnnualCap: num('ruCap'), accreditedRequiredAbove: num('ruAcc'), allowedCountries: val('ruCty'), requireKyc: $('ruKyc').checked } })
      .then(function () { msg('ruMsg', 'Saved. Applies to the next commitment.', 'ok'); })['catch'](function (e) { msg('ruMsg', e.message, 'err'); });
  };
  each('[data-payout2]', function (el) { el.onclick = function () { var id = this.getAttribute('data-payout2'); if (!window.confirm('Pay this distribution out to every holder now?')) return; this.disabled = true; api({ action: 'payout', distributionId: id }).then(function (r) { alert('Payouts created: ' + r.payouts.length + ' · distribution is ' + r.status + '.'); renderAdmin(); })['catch'](function (e) { alert(e.message); }); }; });
  each('[data-pmark]', function (el) { el.onclick = function () { var st = this.getAttribute('data-st'); var ref = window.prompt(st === 'paid' ? 'Payment reference (check number, wire id):' : 'Why did it fail?', ''); if (ref === null) return; api({ action: 'payoutMark', payoutId: this.getAttribute('data-pmark'), status: st, reference: ref }).then(renderAdmin)['catch'](function (e) { alert(e.message); }); }; });
  each('[data-refmanual]', function (el) { el.onclick = function () { var why = window.prompt('Refund reference:', 'wired back'); if (why === null) return; api({ action: 'refund', pledgeId: this.getAttribute('data-refmanual'), reason: why, manual: true }).then(renderAdmin)['catch'](function (e) { alert(e.message); }); }; });
  if ($('csvBtn')) $('csvBtn').onclick = function () {
    var y = Number(val('csvYear'));
    var rows = [['investorName', 'investorEmail', 'investorUid', 'campaign', 'period', 'units', 'perUnit', 'amount', 'status', 'paidAt', 'provider', 'transferId', 'payoutId']];
    a.payouts.forEach(function (x) { var d = dateOf(x.paidAt || x.createdAt); if (!d || d.getFullYear() !== y) return; rows.push([x.investorName || '', x.investorEmail || '', x.investorUid, x.campaignTitle || x.campaignId, x.period || '', x.units, x.perUnit, x.amount, x.status, x.paidAt ? fmtDate(x.paidAt) : '', x.provider || 'manual', x.transferId || '', x.id]); });
    var csv = rows.map(function (r2) { return r2.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var l = document.createElement('a'); l.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); l.download = 'skyfund-payouts-' + y + '.csv'; document.body.appendChild(l); l.click(); l.remove();
  };
}

/* ── operations: investors, updates, staff actions ────────────────────── */
function loadOps() {
  var c = S.cur;
  return Promise.all([
    db.collection('cf_pledges').where('sponsorOrgId', '==', c.sponsorOrgId).where('campaignId', '==', c.id).get().then(function (q) { var o = []; q.forEach(function (d) { var p = d.data(); p.id = d.id; o.push(p); }); o.sort(function (a, b) { return (b.createdAtMs || 0) - (a.createdAtMs || 0); }); return o; })['catch'](function () { return []; }),
    db.collection('cf_distributions').where('campaignId', '==', c.id).get().then(function (q) { var o = []; q.forEach(function (d) { var x = d.data(); x.id = d.id; o.push(x); }); o.sort(function (a, b) { return (b.createdAtMs || 0) - (a.createdAtMs || 0); }); return o; })['catch'](function () { return []; }),
    db.collection('cf_campaigns').doc(c.id).collection('updates').get().then(function (q) { var o = []; q.forEach(function (d) { var x = d.data(); x.id = d.id; o.push(x); }); o.sort(function (a, b) { return (dateOf(b.createdAt) || 0) - (dateOf(a.createdAt) || 0); }); return o; })['catch'](function () { return []; })
  ]).then(function (r) { if (S.cur !== c) return; S.pledges = r[0]; S.dists = r[1]; S.updates = r[2]; renderOps(); });
}
function renderOps() {
  var c = S.cur, el = $('ops'); if (!el) return;
  var paid = S.pledges.filter(function (p) { return p.status === 'paid'; }), pend = S.pledges.filter(function (p) { return p.status === 'pending' || p.status === 'processing'; });
  var html = '';
  if (c.status === 'live' || c.status === 'funded') {
    html += '<div class="card"><h2>Post an update</h2><p class="sub">Investors see updates on the campaign page and in their portfolio.</p><div class="grid"><div class="wide"><input type="text" id="uTitle" placeholder="Title — e.g. Interconnection agreement executed"></div><div class="wide"><textarea id="uBody" placeholder="What happened, what is next."></textarea></div></div><div class="bar"><button class="btn btn-primary" id="btnUpdate">Post update</button><span class="msg" id="uMsg"></span></div>' +
      (S.updates.length ? '<div style="margin-top:12px">' + S.updates.map(function (u) { return '<div style="padding:8px 0;border-top:1px solid var(--soft)"><b>' + esc(u.title) + '</b> <span style="color:var(--faint);font-size:12px">' + fmtDate(u.createdAt) + ' · ' + esc(u.author || '') + '</span><div style="font-size:13px;color:var(--sub)">' + esc(u.body).replace(/\n/g, '<br>') + '</div></div>'; }).join('') + '</div>' : '') + '</div>';
  }
  html += '<div class="card"><h2>Investors</h2><p class="sub">' + paid.length + ' confirmed · ' + pend.length + ' pending. Confirmed investors are the cap table; export it from here when the raise closes.</p>' +
    (S.pledges.length ? '<div style="overflow-x:auto"><table><tr><th>Investor</th><th>Date</th><th class="num">Amount</th><th class="num">Units</th><th class="num">Share</th><th>Perk</th><th>Status</th>' + (S.staff ? '<th></th>' : '') + '</tr>' + S.pledges.map(function (p) {
      return '<tr><td>' + esc(p.investorName || '') + '<div style="font-size:12px;color:var(--faint)">' + esc(p.investorEmail) + '</div></td><td>' + fmtDate(p.createdAt) + '</td><td class="num">' + usd(p.amount) + '</td><td class="num">' + p.units + '</td><td class="num">' + (Number(p.pctOfProject) * 100).toFixed(4) + '%</td><td>' + esc(p.perkTitle || '—') + '</td><td><span class="pill ' + esc(p.status) + '">' + esc(p.status) + '</span>' + (p.paymentProvider === 'manual' ? ' <span class="pill">manual</span>' : '') + (p.refundDue ? ' <span class="pill pending">refund due</span>' : '') + '</td>' +
        (S.staff ? '<td>' + (p.status === 'pending' && p.paymentProvider === 'manual' ? '<button class="btn btn-green btn-sm" data-confirm="' + esc(p.id) + '">Confirm paid</button> ' : '') + (p.status === 'paid' ? '<button class="btn btn-ghost btn-sm" data-refund="' + esc(p.id) + '">Refund</button>' : '') + '</td>' : '') + '</tr>';
    }).join('') + '</table></div><div class="bar"><button class="btn btn-ghost btn-sm" id="btnCsv">Download CSV</button></div>' : '<div class="hint">No commitments yet.</div>') + '</div>';
  if (S.dists.length || c.status === 'funded') {
    html += '<div class="card"><h2>Distributions</h2><p class="sub">Declared by ClearSky from the quarterly report. Per-unit is the crowd pool divided by units sold.</p>' +
      (S.dists.length ? '<table><tr><th>Period</th><th>Declared</th><th class="num">Gross revenue</th><th class="num">Distributable</th><th class="num">Crowd pool</th><th class="num">Per unit</th><th>Status</th>' + (S.staff ? '<th></th>' : '') + '</tr>' + S.dists.map(function (d) { return '<tr><td>' + esc(d.period) + '</td><td>' + fmtDate(d.createdAt) + '</td><td class="num">' + (d.grossRevenue ? usd(d.grossRevenue) : '—') + '</td><td class="num">' + usd(d.distributable) + '</td><td class="num">' + usd(d.crowdPool) + '</td><td class="num">$' + Number(d.perUnit).toFixed(4) + '</td><td><span class="pill ' + esc(d.status) + '">' + esc(d.status) + '</span>' + (d.payoutCounts ? ' <span class="hint" style="display:inline">' + d.payoutCounts.paid + '/' + d.payoutCounts.total + ' paid</span>' : '') + '</td>' + (S.staff ? '<td>' + (d.status === 'declared' ? '<button class="btn btn-green btn-sm" data-payout="' + esc(d.id) + '">Pay out</button>' : '<a href="#admin" onclick="location.hash=\'#admin\';renderAdmin();return false;">payouts</a>') + '</td>' : '') + '</tr>'; }).join('') + '</table>' : '<div class="hint">None declared yet.</div>') + '</div>';
  }
  if (S.staff) {
    html += '<div class="card staff"><h2>Review &amp; lifecycle</h2><p class="sub">Every button here is a server action; the rules do not let a browser change status.</p><div class="grid"><div class="wide"><input type="text" id="stNote" placeholder="Note to the sponsor (optional)"></div></div><div class="bar">' +
      (c.status === 'review' || c.status === 'draft' ? '<button class="btn btn-green" data-act="launch">Launch campaign</button><button class="btn btn-ghost" data-act="return">Return for changes</button>' : '') +
      (c.status === 'live' ? '<button class="btn btn-primary" data-act="funded">Close as funded</button><button class="btn btn-red" data-act="failed">Close as failed &amp; refund</button>' : '') +
      '<span class="msg" id="stMsg"></span></div></div>';
    if (c.status === 'live' || c.status === 'funded') {
      html += '<div class="card staff"><h2>Bank rail for this project</h2><p class="sub">Distributions are sent FROM this funding source (the project SPV\'s account on the rail). Blank uses the platform default from the environment.</p><div class="grid"><div class="wide"><label>Distribution funding source URL</label><input type="text" id="stSrc" value="' + esc((c.bank && c.bank.distributionSourceUrl) || '') + '" placeholder="https://api.dwolla.com/funding-sources/…"></div></div><div class="bar"><button class="btn btn-ghost btn-sm" id="btnSrc">Save</button><span class="msg" id="srcMsg"></span></div></div>';
    }
    if (c.status === 'funded') {
      html += '<div class="card staff"><h2>Declare a distribution</h2><p class="sub">From the sponsor\'s quarterly report. The crowd receives ' + (c.offer && c.offer.sharePct) + '% of the distributable figure, split across ' + (Number(c.unitsSold) || 0).toLocaleString('en-US') + ' units.</p><div class="grid"><div><label>Period</label><input type="text" id="dPeriod" placeholder="2027-Q1"></div><div><label>Gross revenue (USD)</label><input type="number" id="dGross"></div><div><label>Distributable cash (USD, whole project)</label><input type="number" id="dDist"></div><div class="wide"><label>Note</label><input type="text" id="dNote" placeholder="e.g. 91 days of operation, one curtailment event"></div></div><div class="bar"><button class="btn btn-primary" id="btnDist">Declare</button><span class="msg" id="dMsg"></span></div></div>';
    }
  }
  el.innerHTML = html;
  if ($('btnUpdate')) $('btnUpdate').onclick = function () {
    var t = val('uTitle').trim(), b = val('uBody').trim(); if (!t || !b) { msg('uMsg', 'Title and body are required.', 'err'); return; }
    db.collection('cf_campaigns').doc(c.id).collection('updates').add({ title: t, body: b, author: S.user.email, sponsorOrgId: c.sponsorOrgId, createdAt: FV.serverTimestamp() })
      .then(function () { msg('uMsg', 'Posted.', 'ok'); loadOps(); })['catch'](function (e) { msg('uMsg', e.message, 'err'); });
  };
  if ($('btnCsv')) $('btnCsv').onclick = function () {
    var rows = [['name','email','date','amount','units','pctOfProject','perk','status','provider','pledgeId']].concat(S.pledges.map(function (p) { return [p.investorName || '', p.investorEmail, fmtDate(p.createdAt), p.amount, p.units, (Number(p.pctOfProject) * 100).toFixed(6), p.perkTitle || '', p.status, p.paymentProvider || '', p.id]; }));
    var csv = rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = (c.slug || c.id) + '-investors.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  var acts = document.querySelectorAll('[data-act]'); for (var i = 0; i < acts.length; i++) acts[i].onclick = function () { staffAct(this.getAttribute('data-act')); };
  var pos = document.querySelectorAll('[data-payout]'); for (var q = 0; q < pos.length; q++) pos[q].onclick = function () { var id = this.getAttribute('data-payout'); if (!window.confirm('Pay this distribution out to every holder now? Holders with a verified bank are paid over the rail; the rest are listed as unbanked for hand payment.')) return; this.disabled = true; api({ action: 'payout', distributionId: id }).then(function (r) { alert('Payouts created: ' + r.payouts.length + ' · distribution is ' + r.status + '.'); loadOps(); })['catch'](function (e) { alert(e.message); }); };
  if ($('btnSrc')) $('btnSrc').onclick = function () { var url = val('stSrc').trim(); db.collection('cf_campaigns').doc(c.id).set({ bank: { distributionSourceUrl: url || null }, updatedAt: FV.serverTimestamp() }, { merge: true }).then(function () { msg('srcMsg', 'Saved.', 'ok'); refreshCur(); })['catch'](function (e) { msg('srcMsg', e.message, 'err'); }); };
  var cf = document.querySelectorAll('[data-confirm]'); for (var k = 0; k < cf.length; k++) cf[k].onclick = function () { var id = this.getAttribute('data-confirm'); var ref = window.prompt('Payment reference (wire id, cheque number):', ''); if (ref === null) return; api({ action: 'confirm', pledgeId: id, reference: ref }).then(function () { loadOps(); refreshCur(); })['catch'](function (e) { alert(e.message); }); };
  var rf = document.querySelectorAll('[data-refund]'); for (var j = 0; j < rf.length; j++) rf[j].onclick = function () { var id = this.getAttribute('data-refund'); var why = window.prompt('Reason for refund:', ''); if (why === null) return; api({ action: 'refund', pledgeId: id, reason: why }).then(function () { loadOps(); refreshCur(); })['catch'](function (e) { alert(e.message); }); };
  if ($('btnDist')) $('btnDist').onclick = function () {
    msg('dMsg', 'Declaring…');
    api({ action: 'distribute', campaignId: c.id, period: val('dPeriod').trim(), grossRevenue: num('dGross'), distributable: num('dDist'), note: val('dNote').trim() })
      .then(function (r) { msg('dMsg', 'Declared: ' + usd(r.crowdPool) + ' to the crowd, $' + r.perUnit.toFixed(4) + ' per unit.', 'ok'); loadOps(); refreshCur(); })['catch'](function (e) { msg('dMsg', e.message, 'err'); });
  };
}
function staffAct(act) {
  var c = S.cur, note = val('stNote').trim();
  var body = act === 'launch' ? { action: 'review', campaignId: c.id, decision: 'launch', note: note }
           : act === 'return' ? { action: 'review', campaignId: c.id, decision: 'return', note: note }
           : { action: 'close', campaignId: c.id, outcome: act, note: note };
  var warn = { launch: 'Launch this campaign? Terms freeze and it becomes visible to every investor.', 'return': 'Return it to the sponsor as a draft?', funded: 'Close as FUNDED? Units are final; distributions can be declared.', failed: 'Close as FAILED? Every paid card pledge is refunded through Stripe now.' }[act];
  if (!window.confirm(warn)) return;
  msg('stMsg', 'Working…');
  api(body).then(function (r) { msg('stMsg', 'Done — status ' + r.status + '.', 'ok'); return refreshCur(); })['catch'](function (e) { msg('stMsg', e.message, 'err'); });
}
function refreshCur() {
  var id = S.cur && S.cur.id; if (!id) return Promise.resolve();
  return db.collection('cf_campaigns').doc(id).get().then(function (d) { if (!d.exists) return; var c = d.data(); c.id = d.id; S.cur = c; for (var i = 0; i < S.list.length; i++) if (S.list[i].id === id) S.list[i] = c; paintList(); renderEditor(); if (c.status !== 'draft') loadOps(); });
}
})();
</script>
</body>
</html>
