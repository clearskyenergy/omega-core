/* ONE Omega Logic sign-in (omega-logic-signin.js), with no company in the
   address: after it, /api/logic-workspaces says where this person goes. One
   company: straight in. Several: pick. The ClearSky owner keeps the private
   directory of every workspace. */
/* ?next= (an office page's Sign out, or its "Sign in to Omega Logic"): back
   to that page once the company is known — only an Omega Logic office page
   of this site, for this company (OmegaLogicTheme.nextFor); else the dashboard */
function goTo(org){var n=OmegaLogicTheme.nextFor(org,false);location.replace(n||'/omega-logic?org='+encodeURIComponent(org)+location.hash);}
function signOut(){auth.signOut().then(function(){location.replace('/omega-logic');});}
function front(){message('');$('gate').hidden=false;$('content').hidden=true;$('gate').innerHTML='<p class="muted" style="text-align:center;margin:60px 0">Finding your company…</p>';
  OmegaLogicSignIn.resolve(auth).then(function(d){
    if(d.owner){var n=OmegaLogicTheme.nextFor('',true);if(n)return location.replace(n);$('gate').hidden=true;$('content').hidden=false;return load();}
    if(d.workspaces.length===1)return goTo(d.workspaces[0].orgId);
    OmegaLogicSignIn.choose($('gate'),d,goTo,signOut,auth);
  })['catch'](function(){/* never leave "Finding your company…" with no way out */
    $('gate').innerHTML='<div style="text-align:center;margin:60px 0"><p>Could not reach Omega Logic just now. Check your connection and try again.</p><p><button type="button" class="primary" id="fd-retry">Try again</button> <button type="button" id="fd-out">Sign out</button></p></div>';
    $('fd-retry').onclick=front;$('fd-out').onclick=signOut;});}
auth.onAuthStateChanged(function(u){$('gate').hidden=!!u;$('content').hidden=!u;
  if(u){if($('who'))$('who').textContent=u.email;if(!ORG&&window.OmegaLogicSignIn)return front();load()['catch'](function(e){/* any refusal of the company in the address (not theirs, email not
   verified, subscription lapsed) goes back to Omega Logic's front door,
   which says which of those it is and offers sign out */
if(!ORG||!window.OmegaLogicSignIn||[400,403,404].indexOf(e.status)<0)return error(e);front();});}
  else{if($('who'))$('who').textContent='';DATA=null;$('content').innerHTML='';if(window.OmegaLogicSignIn)OmegaLogicSignIn.signIn($('gate'),{auth:auth,lede:'Your business in one place: orders, customers, the plant, stock and money. Sign in with your work account and you go straight to your company.'});}});
