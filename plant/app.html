<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2733">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Plant</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  plant/app.html — the plant in a pocket
  © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.

  Two people build every unit. They do not sit at a desk; they walk between
  benches with a phone. This is the app they install on it: the work orders
  they are building, tap into one and see every unit and which step it is
  on, what is short, what is on hold — and the scanner, one tap away.

  It is the same office data through the same signed-in endpoints
  (api/logic-plant.js, api/logic-materials.js, api/plant-control.js). The
  phone adds nothing a browser could not do; it only puts it where the work
  is. Scanning is NOT here: it is the station screen (plant/station.html),
  which this app opens. A phone paired as a ROAMING station names the bench
  on each scan; the routing rules are unchanged.

  Installable (manifest + a shell service worker) so it opens like an app
  and says "offline" instead of a browser error in the yard. Work-order data
  is never served from cache: a stale list is worse than a spinner.
  ═══════════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="/omega-logic-theme.css">
<style>
  html,body{margin:0;height:100%}
  body.logic-theme{display:flex;flex-direction:column;min-height:100vh;background:var(--paper);padding-bottom:calc(64px + env(safe-area-inset-bottom,0))}
  header.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;border-bottom:1px solid var(--line);background:white;position:sticky;top:0;z-index:5}
  header.top b{font-size:17px}header.top small{display:block;color:var(--ink2);font-size:12px}
  header.top .sp{flex:1}
  header.top button{padding:7px 12px;border:1px solid var(--line);background:white;font-size:13px}
  main{flex:1;padding:14px 16px;max-width:720px;width:100%;margin:0 auto}
  h1{font-size:24px;margin:6px 0 10px}h2{font-size:18px;margin:18px 0 8px}
  .status{font-size:13px;color:var(--ink2);min-height:18px}
  .tabs{display:flex;gap:6px;margin:8px 0 12px}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:white;font-size:13px}.tabs button[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-d);font-weight:600}
  .card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:white;padding:14px;margin:10px 0;font:inherit;color:inherit;cursor:pointer}
  .card.urgent{border-left:4px solid #B42318}
  .card .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.card .h b{font-size:16px}
  .card .m{color:var(--ink2);font-size:13px;margin-top:2px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
  .pill.bad{background:#FDEBE9;color:#B42318;border-color:#F4B4AE}.pill.ok{background:#E9F7F0;color:#198764;border-color:#B8E4CD}
  .bar{height:8px;background:var(--sunk);border-radius:6px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kv div{padding:10px 12px;background:var(--sunk);border-radius:10px}.kv small{display:block;color:var(--ink2);font-size:12px}.kv b{font-size:20px}.kv div.bad b{color:#B42318}
  .unit{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit}
  .unit small{display:block;color:var(--ink2);font-size:12px}.unit .mono{font-family:'IBM Plex Mono',monospace;font-size:14px}
  .strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.strip i{flex:none;font-style:normal;font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}.strip i.here{background:var(--brand);color:white;border-color:var(--brand)}.strip i.past{color:#198764;border-color:#B8E4CD}
  .big{display:block;width:100%;padding:16px;border-radius:14px;border:0;background:var(--brand);color:white;font:700 17px 'Poppins',system-ui,sans-serif;margin:12px 0;text-align:center;text-decoration:none}
  .big.ghost{background:white;color:var(--brand-d);border:1px solid var(--brand)}
  input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
  .row{display:flex;gap:8px}.row input{flex:1}.row button{padding:0 16px;border:1px solid var(--line);background:white}
  .back{border:0;background:none;color:var(--brand-d);font:inherit;padding:6px 0;cursor:pointer}
  pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--sunk);padding:10px;border-radius:10px}
  .note{font-size:12px;color:var(--ink2)}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
  nav.bottom button{flex:1;border:0;background:none;padding:10px 4px 8px;font:600 11px system-ui,sans-serif;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.bottom button span{font-size:20px;line-height:1}nav.bottom button[aria-current=page]{color:var(--brand-d)}
  #gate{text-align:center;padding:40px 16px}#gate button{margin-top:14px}
  .off{background:#FFF5DD;color:#A26718;font-size:13px;padding:8px 12px;border-radius:10px;margin:8px 0}
</style>
</head>
<body class="logic-theme">
<header class="top"><div><b data-brand-name>Plant</b><small id="who"></small></div><span class="sp"></span><button type="button" id="refresh" title="Refresh">↻</button><button type="button" id="signout" hidden>Sign out</button></header>
<main>
  <div id="gate"><h1>Plant</h1><p class="note">Work orders, the bench scanner, stock and quality — for the people building the units.</p><button class="big" id="signin">Sign in</button><p class="note" id="gate-note"></p></div>
  <div id="offline" class="off" hidden>Offline — showing nothing rather than something stale. The bench scanner keeps its own queue.</div>
  <p id="status" class="status"></p>
  <div id="view"></div>
</main>
<nav class="bottom" id="nav" hidden>
  <button data-tab="work" aria-current="page"><span>▤</span>Work</button>
  <button data-tab="scan"><span>▣</span>Scan</button>
  <button data-tab="stock"><span>▦</span>Stock</button>
  <button data-tab="quality"><span>◈</span>Quality</button>
</nav>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="/config.js"></script><script src="/omega-brand.js"></script><script src="/omega-tenant.js"></script><script src="/omega-logic-theme.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.CLEARSKY_CONFIG || {}; if (!firebase.apps.length) firebase.initializeApp(cfg.firebase || cfg);
  var auth = firebase.auth(), params = new URLSearchParams(location.search);
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  /* The org comes with the link once and is remembered: an installed app has
     no query string to carry it. */
  var ORG = params.get('org') || load('omega_plant_app_org', '') || '';
  if (params.get('org')) store('omega_plant_app_org', params.get('org'));
  var TAB = params.get('tab') || 'work', DATA = null, WO = null, UNIT = null, LABELS = {}, MATERIALS = null;
  var q = '?org=' + encodeURIComponent(ORG);

  function api(path, body) {
    if (!auth.currentUser) return Promise.reject(new Error('Sign in first.'));
    return auth.currentUser.getIdToken().then(function (t) {
      return fetch(path, { method: body ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Request failed'); return d; }); });
  }
  function status(t) { $('status').textContent = t || ''; }
  function fail(e) { status(e.message || String(e)); }
  function label(key) { return LABELS[key] || key || 'not started'; }
  function day(s) { return s ? String(s).slice(0, 10) : ''; }

  /* ── data ─────────────────────────────────────────────────────────────── */
  function loadAll() {
    status('Loading…');
    return api('/api/logic-plant' + q).then(function (d) {
      DATA = d; LABELS = {}; (d.flow && d.flow.routing || []).forEach(function (s) { LABELS[s.key] = s.label; });
      if (d.brand) OmegaLogicTheme.apply(d.brand);
      $('who').textContent = (auth.currentUser && auth.currentUser.email) || '';
      status(''); draw();
    })['catch'](fail);
  }
  function openWork(w) { return ['complete', 'shipped', 'cancelled'].indexOf(w.status) < 0; }
  function totals(w) { var t = 0, done = 0; (w.requirements || []).forEach(function (r) { t += Number(r.qty) || 0; }); Object.keys(w.registeredCounts || {}).forEach(function (k) { t += 0; }); Object.keys(w.readyCounts || {}).forEach(function (k) { done += Number(w.readyCounts[k]) || 0; }); var started = 0; Object.keys(w.registeredCounts || {}).forEach(function (k) { started += Number(w.registeredCounts[k]) || 0; }); var alloc = (w.allocatedSerials || []).length; return { total: t + alloc, done: done + alloc, started: started }; }
  function sortWork(a, b) { var p = { urgent: 0, normal: 1, low: 2 }; if ((p[a.priority] || 1) !== (p[b.priority] || 1)) return (p[a.priority] || 1) - (p[b.priority] || 1); if ((a.dueDate || '') !== (b.dueDate || '')) { if (!a.dueDate) return 1; if (!b.dueDate) return -1; return a.dueDate < b.dueDate ? -1 : 1; } return 0; }

  /* ── views ────────────────────────────────────────────────────────────── */
  function draw() {
    if (!DATA) return;
    Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.setAttribute('aria-current', b.dataset.tab === TAB ? 'page' : 'false'); });
    if (TAB === 'work') return UNIT ? drawUnit() : (WO ? drawWorkOrder() : drawWork());
    if (TAB === 'scan') return drawScan();
    if (TAB === 'stock') return drawStock();
    if (TAB === 'quality') return UNIT ? drawUnit() : drawQuality();
  }
  function drawWork() {
    var list = (DATA.worksOrders || []).filter(openWork).sort(sortWork);
    var today = new Date().toISOString().slice(0, 10);
    $('view').innerHTML = '<h1>Work</h1><p class="note">' + list.length + ' open work order' + (list.length === 1 ? '' : 's') + ' · urgent first, then by due date.' + (DATA.limited ? ' Newest 100 shown.' : '') + '</p>'
      + (list.length ? list.map(function (w) { var t = totals(w), pct = t.total ? Math.round(t.done / t.total * 100) : 0, late = w.dueDate && w.dueDate < today && t.done < t.total;
          return '<button class="card' + (w.priority === 'urgent' ? ' urgent' : '') + '" data-wo="' + esc(w.id) + '"><div class="h"><b>' + esc(w.orderNo || 'Stock build') + '</b><span class="pill' + (late ? ' bad' : '') + '">' + (w.dueDate ? (late ? 'due ' : 'due ') + esc(w.dueDate) : esc(w.status)) + '</span></div>'
            + '<div class="m">' + esc((w.requirements || []).map(function (r) { return r.qty + ' × ' + r.sku; }).join(', ') || (w.allocatedSerials || []).length + ' from stock') + (w.lineId ? ' · ' + esc(w.lineId) : '') + (w.priority === 'urgent' ? ' · <b style="color:#B42318">urgent</b>' : '') + '</div>'
            + '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="m">' + t.done + ' of ' + t.total + ' finished' + (t.started ? ' · ' + t.started + ' started' : '') + (w.managerNotes ? ' · ' + esc(w.managerNotes.slice(0, 60)) : '') + '</div></button>'; }).join('')
        : '<p class="note">Nothing open. A paid order releases a work order here automatically; stock builds are registered under Work orders on the desktop.</p>');
    Array.prototype.forEach.call(document.querySelectorAll('[data-wo]'), function (b) { b.onclick = function () { openWorkOrder(b.dataset.wo); }; });
  }
  function openWorkOrder(id) {
    status('Loading work order…'); WO = null; MATERIALS = null;
    Promise.all([api('/api/logic-plant' + q + '&workOrder=' + encodeURIComponent(id)), api('/api/logic-materials' + q + '&workOrder=' + encodeURIComponent(id))['catch'](function () { return null; })])
      .then(function (r) { WO = r[0]; MATERIALS = r[1]; status(''); draw(); })['catch'](fail);
  }
  function drawWorkOrder() {
    var w = WO.workOrder, units = WO.units || [], t = totals(w), routing = w.routing || [];
    var byAt = {}; units.forEach(function (u) { if (u.shipUnit !== false) byAt[u.at || ''] = (byAt[u.at || ''] || 0) + 1; });
    $('view').innerHTML = '<button class="back" id="back">‹ Work</button><h1>' + esc(w.orderNo || 'Stock build') + '</h1><p class="note">' + esc(w.status) + (w.dueDate ? ' · due ' + esc(w.dueDate) : '') + (w.priority && w.priority !== 'normal' ? ' · ' + esc(w.priority) : '') + (w.lineId ? ' · ' + esc(w.lineId) : '') + '</p>'
      + '<div class="kv"><div><small>Finished</small><b>' + t.done + ' / ' + t.total + '</b></div><div class="' + (units.some(function (u) { return u.hold; }) ? 'bad' : '') + '"><small>On hold</small><b>' + units.filter(function (u) { return u.hold; }).length + '</b></div></div>'
      + (w.managerNotes ? '<p>' + esc(w.managerNotes) + '</p>' : '')
      + '<div class="strip">' + routing.map(function (s) { return '<i>' + esc(s.label || s.key) + (byAt[s.key] ? ' · ' + byAt[s.key] : '') + '</i>'; }).join('') + '</div>'
      + (MATERIALS ? (MATERIALS.short && MATERIALS.short.length ? '<h2>Short of</h2>' + MATERIALS.short.map(function (s) { return '<div class="unit"><div>' + esc(s.name || s.sku) + '<small>' + esc(s.sku) + ' · on hand ' + s.onHand + ' · on order ' + s.onOrder + '</small></div><span class="pill bad">' + s.short + ' ' + esc(s.unit) + (s.late ? ' · late' : '') + '</span></div>'; }).join('') : (MATERIALS.hasBom ? '<p class="note">✓ Every part for this work order is on the shelf or on order.</p>' : '')) : '')
      + '<h2>Units · ' + units.length + '</h2>'
      + (units.length ? units.filter(function (u) { return u.shipUnit !== false; }).concat(units.filter(function (u) { return u.shipUnit === false; })).map(function (u) { var p = u.progress; return '<button class="unit" data-unit="' + esc(u.serial) + '"><div><span class="mono">' + esc(u.serial) + '</span><small>' + esc(u.sku) + (u.shipUnit === false ? ' · component' : '') + '</small></div><div style="text-align:right">' + (u.hold ? '<span class="pill bad">hold · ' + esc(u.ncr || '') + '</span>' : '<span class="pill' + (u.at === 'ready' ? ' ok' : '') + '">' + esc(label(u.at)) + '</span>') + (p ? '<small>' + p.done + ' of ' + p.total + ' steps' + (p.complete ? ' ✓' : (p.open.length ? ' · next: ' + esc(p.open[0]) : '')) + '</small>' : '') + '</div></button>'; }).join('') : '<p class="note">No serials registered yet. Register them under Work orders on the desktop, or from the label printer’s sheet.</p>')
      + (WO.limited ? '<p class="note">First 400 units shown.</p>' : '')
      + '<a class="big" href="' + scannerHref() + '">Scan at a bench</a><a class="big ghost" href="/plant/' + q + '&wo=' + encodeURIComponent(w.id) + '">Register serials on the desktop</a>';
    $('back').onclick = function () { WO = null; draw(); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-unit]'), function (b) { b.onclick = function () { openUnit(b.dataset.unit); }; });
  }
  function openUnit(serial) {
    status('Loading unit…');
    api('/api/logic-plant' + q + '&serial=' + encodeURIComponent(serial)).then(function (d) { UNIT = d; status(''); draw(); })['catch'](fail);
  }
  function drawUnit() {
    var u = UNIT.unit, routing = (WO && WO.workOrder && WO.workOrder.routing) || (DATA.flow && DATA.flow.routing) || [], ai = -1;
    routing.forEach(function (s, i) { if (s.key === u.at) ai = i; });
    var work = u.work || {}, issued = [];
    Object.keys(work).forEach(function (st) { var w = work[st] || {}; Object.keys(w.issued || {}).forEach(function (sku) { issued.push(label(st) + ': ' + w.issued[sku] + ' × ' + sku + (w.lots && w.lots[sku] ? ' (lot ' + w.lots[sku] + ')' : '')); }); });
    $('view').innerHTML = '<button class="back" id="back">‹ Back</button><h1 class="mono" style="font-family:\'IBM Plex Mono\',monospace;font-size:20px">' + esc(u.serial) + '</h1><p class="note">' + esc(u.unitType || 'unit') + ' · ' + esc(u.sku) + ' · ' + esc(u.orderNo || 'stock') + '</p>'
      + (u.hold ? '<div class="off" style="background:#FDEBE9;color:#B42318"><b>On hold:</b> ' + esc(u.hold) + (u.ncr ? ' · ' + esc(u.ncr) : '') + '</div>' : '')
      + '<div class="strip">' + routing.map(function (s, i) { return '<i class="' + (i < ai ? 'past' : (i === ai ? 'here' : '')) + '">' + esc(s.label) + '</i>'; }).join('') + '</div>'
      + '<div class="kv"><div><small>At</small><b style="font-size:16px">' + esc(label(u.at)) + '</b></div><div><small>Last test</small><b style="font-size:16px">' + esc(u.test && u.test.result ? u.test.result : '—') + '</b></div></div>'
      + (issued.length ? '<h2>Parts issued</h2>' + issued.map(function (t) { return '<div class="unit"><span>' + esc(t) + '</span></div>'; }).join('') : '')
      + (UNIT.genealogy && UNIT.genealogy.length > 1 ? '<h2>Assembly</h2>' + UNIT.genealogy.map(function (g) { return '<div class="unit"><span class="mono">' + esc(g.serial) + '</span><small>' + esc(g.unitType) + (g.parentSerial ? ' → ' + esc(g.parentSerial) : ' · root') + '</small></div>'; }).join('') : '')
      + '<h2>Recent scans</h2>' + ((UNIT.events || []).slice(0, 10).map(function (e) { var v = e.verdict || {}; return '<div class="unit"><div>' + esc(v.say || (e.control && e.control.action) || e.kind || '') + '<small>' + esc(day(e.at)) + ' · ' + esc(label(e.station)) + (e.kind === 'issue' ? ' · issued ' + esc(e.qty) + ' × ' + esc(e.sku) : '') + '</small></div><span class="pill' + (e.ok ? '' : ' bad') + '">' + (e.ok ? 'ok' : 'refused') + '</span></div>'; }).join('') || '<p class="note">No scans yet.</p>')
      + '<h2>Quality</h2><p class="note">A hold stops every scan on this unit until a plant administrator releases it with a disposition. A failed machine test still needs a passing retest.</p>'
      + (u.hold ? '<textarea id="q-reason" placeholder="Disposition — what was found and what was done"></textarea><button class="big ghost" id="q-release">Release the hold</button>' : '<textarea id="q-reason" placeholder="Why this unit is being held"></textarea><button class="big ghost" id="q-hold">Place a quality hold</button>')
      + '<a class="big" href="' + scannerHref() + '">Scan at a bench</a>';
    $('back').onclick = function () { UNIT = null; draw(); };
    var act = $('q-release') || $('q-hold');
    act.onclick = function () {
      var reason = $('q-reason').value.trim(); if (!reason) { status('Write the reason or disposition first.'); return; }
      act.disabled = true; status('Saving…');
      var bytes = new Uint8Array(12); crypto.getRandomValues(bytes); var id = Array.prototype.map.call(bytes, function (n) { return ('0' + n.toString(16)).slice(-2); }).join('');
      api('/api/plant-control', { orgId: ORG, serial: u.serial, action: u.hold ? 'release' : 'hold', reason: reason, actionId: id }).then(function () { status(u.hold ? 'Hold released.' : 'Hold placed.'); return openUnit(u.serial); })['catch'](fail).then(function () { act.disabled = false; });
    };
  }
  function scannerHref() { var st = load('omega_station_v1', null); return '/plant/station.html' + (st && st.stationId ? '' : ''); }
  function drawScan() {
    var st = load('omega_station_v1', null);
    $('view').innerHTML = '<h1>Scan</h1>'
      + (st ? '<div class="card"><div class="h"><b>' + esc(st.label || st.stationId) + '</b><span class="pill ok">paired</span></div><div class="m">' + (st.roaming ? 'Roaming phone — you pick the bench on each scan.' : 'This phone is paired to one bench.') + '</div></div><a class="big" href="/plant/station.html">Open the scanner</a>'
           : '<p>This phone is not paired yet. A plant administrator creates a <b>Roaming phone</b> credential under Work orders → Pair a scanner, then you paste the token once on the scanner screen. After that the scanner opens with one tap and you pick the bench you are at on each scan.</p><a class="big" href="/plant/station.html">Open the scanner to pair</a><a class="big ghost" href="/plant/' + q + '">Create a credential (admin)</a>')
      + '<h2>Find a unit</h2><div class="row"><input id="find" placeholder="Serial, or the label URL" autocapitalize="off" autocorrect="off"><button id="find-go">Look up</button></div><p class="note">Every serial has a history: where it is, what was issued into it, its tests and holds.</p>';
    $('find-go').onclick = function () { var v = $('find').value.trim(); if (v) { WO = null; TAB = 'quality'; openUnit(v.indexOf('/') >= 0 ? v.split(/[?#]/)[0].replace(/\/+$/, '').split('/').pop() : v); } };
    $('find').onkeydown = function (e) { if (e.key === 'Enter') $('find-go').click(); };
  }
  function drawStock() {
    status('Loading stock…');
    Promise.all([api('/api/logic-plant' + q + '&page=units'), api('/api/logic-materials' + q)['catch'](function () { return null; })]).then(function (r) {
      var units = r[0].rows || [], m = r[1], by = {};
      units.forEach(function (u) { if (!u.shipUnit) return; var g = by[u.sku] = by[u.sku] || { a: 0, b: 0, c: 0 }; if (u.inventoryStatus === 'available' && u.at === 'ready' && !u.hold) g.a++; else if (u.orderId) g.b++; else g.c++; });
