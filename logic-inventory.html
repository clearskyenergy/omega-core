<!doctype html>
<!-- © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.
     logic-inventory.html — what is on the shelf: finished units by product
     (available, assigned, being built) and components by part. A finished
     unit can be assigned to an order that is short of it; the endpoint
     (api/logic-plant.js action:'allocate') moves the whole assembly and
     tells the works order to build one fewer. Counts of components are
     recorded on the materials plan; this page only shows them. -->
<html lang="en"><head><meta charset="utf-8"><script src="/omega-splash.js?v=1"></script>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory</title><link rel="stylesheet" href="/omega-logic-theme.css"><style>body{margin:0}header{padding:22px 4%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}main{min-width:0}button{padding:9px 16px;border:1px solid var(--line);background:white}select{width:auto;max-width:100%}.num{text-align:right;white-space:nowrap}details{margin:4px 0}summary{cursor:pointer}.serial{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.serial small{display:block;color:var(--ink2);font-family:'IBM Plex Mono',monospace;font-size:12px}.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}.pill.bad{background:#FDEBE9;color:#B42318;border-color:#F4B4AE}@media(max-width:700px){.serial{grid-template-columns:1fr}}</style></head><body class="logic-theme"><header><b data-product-name>Inventory</b><span><a id="materials">Materials plan</a> · <a id="office">Office</a></span></header><div class="logic-shell"><nav class="logic-nav" aria-label="Inventory"></nav><main class="logic-main"><h1>Inventory</h1><p>Finished units on the shelf and components on the shelf. A finished unit built for stock can be assigned to an order here; the plant then builds one fewer for that order.</p><p id="status" class="logic-status" role="status">Checking access…</p><div id="content"></div></main></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="/config.js"></script><script src="/omega-brand.js"></script><script src="/omega-tenant.js"></script><script src="/omega-logic-theme.js"></script><script>
(function(){'use strict';var org=new URLSearchParams(location.search).get('org')||'',cfg=window.CLEARSKY_CONFIG||{},units=[],next=null,plan=null,orders=[],labels={};if(!firebase.apps.length)firebase.initializeApp(cfg.firebase||cfg);var auth=firebase.auth();function $(id){return document.getElementById(id);}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function n(v){v=Number(v);return isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:4}):'—';}
var q='?org='+encodeURIComponent(org);($('office')||{}).href='/omega-logic'+q;($('materials')||{}).href='/logic-materials.html'+q;
function api(path,body){return auth.currentUser.getIdToken().then(function(t){return fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(Object.assign({org:org},body)):undefined});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Request failed');return d;});});}
function error(e){$('status').textContent=e.message;}
function loadUnits(more){return api('/api/logic-plant'+q+'&page=units'+(more&&next?'&after='+encodeURIComponent(next):'')).then(function(d){units=more?units.concat(d.rows):d.rows;next=d.next;});}
function load(){return Promise.all([api('/api/logic-plant'+q),loadUnits(false),api('/api/logic-materials'+q),api('/api/logic-office'+q)]).then(function(r){labels={};(r[0].flow&&r[0].flow.routing||[]).forEach(function(s){labels[s.key]=s.label;});plan=r[2];orders=r[3].orders||[];
  OmegaLogicTheme.chrome({org:org,current:'inventory',owner:r[0].owner,brand:r[0].brand,who:auth.currentUser&&auth.currentUser.email,local:[{href:'#finished',label:'Finished units'},{href:'#parts',label:'Components'}]});$('status').textContent='';draw();});}
function needs(sku){return orders.filter(function(o){return o.status==='in_fulfilment'&&o.worksOrderId&&(o.logic&&o.logic.requirements||[]).some(function(r){return r.sku===sku&&Number(r.qty)>0;});});}
function draw(){var by={};units.filter(function(u){return u.shipUnit&&u.inventoryStatus!=='void';}).forEach(function(u){var g=by[u.sku]=by[u.sku]||{sku:u.sku,available:[],allocated:0,building:0};if(u.inventoryStatus==='available'&&u.at==='ready'&&!u.hold)g.available.push(u);else if(u.orderId)g.allocated++;else g.building++;});
  var skus=Object.keys(by).sort();
  $('content').innerHTML='<section class="panel" id="finished"><h2>Finished units</h2><p class="note">Shipping units by product. <b>Available</b> is finished, tested and unassigned; <b>assigned</b> belongs to an order; <b>building</b> is on the floor.'+(next?' Newest 100 units loaded — <a href="#" id="more">load more</a>.':'')+'</p>'+(skus.length?'<div class="logic-scroll"><table class="logic-table"><thead><tr><th>Product</th><th class="num">Available</th><th class="num">Assigned</th><th class="num">Building</th></tr></thead><tbody>'+skus.map(function(s){var g=by[s];return '<tr><td>'+esc(s)+'</td><td class="num"><b>'+g.available.length+'</b></td><td class="num">'+g.allocated+'</td><td class="num">'+g.building+'</td></tr>';}).join('')+'</tbody></table></div>'+skus.filter(function(s){return by[s].available.length;}).map(function(s){var g=by[s],want=needs(s);return '<details open><summary>'+esc(s)+' · '+g.available.length+' available'+(want.length?' · '+want.length+' order'+(want.length===1?'':'s')+' waiting':'')+'</summary>'+g.available.map(function(u){return '<div class="serial"><div>'+esc(u.serial)+'<small>'+esc(u.unitType||'unit')+(u.test&&u.test.result?' · test '+esc(u.test.result):'')+(u.createdAt?'':'')+'</small></div>'+(want.length?'<select data-for="'+esc(u.serial)+'"><option value="">Assign to…</option>'+want.map(function(o){return '<option value="'+esc(o.id)+'">'+esc(o.orderNo)+' · '+esc(OmegaLogicTheme.company(o))+'</option>';}).join('')+'</select><button data-assign="'+esc(u.serial)+'">Assign</button>':'<span class="pill">no order needs this product</span><span></span>')+'</div>';}).join('')+'</details>';}).join(''):'<p class="note">No finished shipping units loaded.</p>')+'</section>'
  +'<section class="panel" id="parts"><h2>Components on the shelf</h2><p class="note">From the materials plan. Record a count under <a href="/logic-materials.html'+q+'#stock">Materials plan → Stock counts</a>; receive a purchase order there too.</p>'+(plan&&plan.rows&&plan.rows.length?'<div class="logic-scroll"><table class="logic-table"><thead><tr><th>Component</th><th class="num">On hand</th><th class="num">On order</th><th class="num">Safety stock</th><th class="num">Needed (firm)</th><th></th></tr></thead><tbody>'+plan.rows.filter(function(r){return r.kind==='component';}).map(function(r){var firm=r.net.committed+r.net.pipeline+(r.net.buffer||0);return '<tr><td>'+esc(r.sku)+'<br><small>'+esc(r.name)+(r.make?' · sub-assembly':'')+'</small></td><td class="num">'+n(r.onHand)+' '+esc(r.unit)+'</td><td class="num">'+n(r.onOrder)+'</td><td class="num">'+(r.safetyStock?n(r.safetyStock):'—')+'</td><td class="num">'+(firm>0?'<b>'+n(firm)+'</b>':'0')+'</td><td>'+(r.belowSafety?'<span class="pill bad">below safety stock</span>':(r.late?'<span class="pill bad">late</span>':''))+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="note">No components in the plan yet. Add components and bills of materials under Products &amp; bills.</p>')+'</section>';
  if($('more'))$('more').onclick=function(e){e.preventDefault();loadUnits(true).then(draw).catch(error);};
  Array.prototype.forEach.call(document.querySelectorAll('[data-assign]'),function(b){b.onclick=function(){var sel=document.querySelector('select[data-for="'+b.dataset.assign.replace(/"/g,'')+'"]');if(!sel||!sel.value){$('status').textContent='Choose the order first.';return;}var o=orders.filter(function(x){return x.id===sel.value;})[0];if(!confirm('Assign '+b.dataset.assign+' to '+(o?o.orderNo:sel.value)+'? The plant will build one fewer for that order.'))return;b.disabled=true;$('status').textContent='Assigning…';api('/api/logic-plant',{action:'allocate',serial:b.dataset.assign,orderId:sel.value}).then(function(d){$('status').textContent=d.serial+' assigned to '+d.orderNo+(d.stillToBuild?' · '+d.stillToBuild+' still to build':' · nothing left to build for it')+'.';return load();}).catch(error).then(function(){b.disabled=false;});};});}
auth.onAuthStateChanged(function(u){units=[];$('content').textContent='';if(!u){$('status').textContent='Sign in through your office to open inventory.';return;}if(!org){$('status').textContent='Open inventory from your office workspace.';return;}load().catch(error);});})();
</script></body></html>
