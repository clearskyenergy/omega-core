<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearSky OMEGA &middot; Battery Sizer</title>
<meta name="robots" content="noindex">
<!-- ====================================================================
     This was a COPY of the root Battery Sizer, taken before the sizing
     engine moved server-side, and it was served on finance.csebuilders.com
     and financing.csebuilders.com through the rewrites in vercel.json.

     It carried the whole engine inline — the load-duration curve, the
     dispatch simulation, the sweep and the economics — which meant two
     things. The logic shipped to every browser that opened it, against
     the rule in CLAUDE.md that pricing and sizing run in /api/. And it
     had drifted: it still computed nameplate as usable/DoD, omitting the
     discharge half of the round trip, so it under-sized and under-priced
     every system by about 6.6% against what the canonical tool returned
     for the same bills.

     A finance partner and a developer looking at the same meter got
     different numbers, on two customer-facing hostnames.

     There is nothing finance-specific in it to preserve: same title, same
     chrome, and the portal-return logic in the canonical tool already
     works out which portal sent the visitor. So the rewrites now point at
     /battery-sizer, and this file stays only to catch a deep link to the
     literal path.
     ==================================================================== -->
<style>
  html,body{margin:0;height:100%;background:#F2F5F8;
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .w{display:flex;align-items:center;justify-content:center;height:100%;padding:24px}
  .c{max-width:420px;text-align:center;color:#16232F}
  h1{font-size:15px;font-weight:600;margin:0 0 8px}
  p{font-size:13px;line-height:1.5;color:#64788A;margin:0 0 14px}
  a{color:#0E9E8F;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="w"><div class="c">
  <h1>The Battery Sizer has moved</h1>
  <p>It lives at <a id="lnk" href="/battery-sizer.html">/battery-sizer.html</a> now, so the
     finance portal and the rest of OMEGA size from the same engine.</p>
  <p>Taking you there&hellip;</p>
</div></div>
<script>
/* Carry the query string through: a deep link from the portal may name the
   project or the return host, and dropping it would land the visitor on an
   empty tool with no way back. */
(function () {
  var target = '/battery-sizer.html' + (location.search || '') + (location.hash || '');
  var a = document.getElementById('lnk');
  if (a) a.setAttribute('href', target);
  /* replace(), not assign(): the back button should return to wherever the
     visitor came from, not to this notice. */
  location.replace(target);
})();
</script>
</body>
</html>
