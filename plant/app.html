<!--
  ═══════════════════════════════════════════════════════════════════════════
  plant/app.html — the plant in a pocket
  © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.

  Two people build every unit. They do not sit at a desk; they walk between
  benches with a phone. This is the app they install on it: the work orders
  they are building, tap into one and see every unit and which step it is
  on, what is short, what is on hold — and the scanner, one tap away.

  It is the same office data through the same signed-in endpoints
  (api/logic-plant.js, api/logic-materials.js, api/plant-control.js). The
  phone adds nothing a browser could not do; it only puts it where the work
  is. Scanning is NOT here: it is the station screen (plant/station.html),
  which this app opens. A phone paired as a ROAMING station names the bench
  on each scan; the routing rules are unchanged.

  Installable (manifest + a shell service worker) so it opens like an app
  and says "offline" instead of a browser error in the yard. Work-order data
  is never served from cache: a stale list is worse than a spinner.
  ═══════════════════════════════════════════════════════════════════════════
-->

<script>window.OMEGA_NO_HUB_ROUTE = true; /* Omega Logic resolves its own workspace (omega-logic-signin.js) */</script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="/config.js"></script><script src="/omega-brand.js"></script><script src="/omega-tenant.js"></script><script src="/omega-logic-theme.js"></script><script src="/omega-auth-errors.js"></script><script src="/omega-logic-signin.js"></script>

  }

  function loadOps() { return OPS ? Promise.resolve(OPS) : api('/api/logic-plant' + q + '&page=ops').then(function (o) { OPS = o; return o; }); }
  function openWork(w) { return ['complete', 'shipped', 'cancelled'].indexOf(w.status) < 0; }

  function draw() {

    if (TAB === 'today') return UNIT ? drawUnit() : (WO ? drawWorkOrder() : drawToday());
    if (TAB === 'work') return UNIT ? drawUnit() : (WO ? drawWorkOrder() : drawWork());

  function boardRows() { return BOARD && BOARD.rows ? BOARD.rows.filter(function (r) { return r.stage !== 'complete'; }) : null; }

  function drawToday() {

    $('view').innerHTML = '<h1>Today</h1><p class="note" id="today-when">' + esc(new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })) + '</p>'
      + '<div class="kv" id="today-kv"><div><small>Open work orders</small><b>' + rows.length + '</b></div><div class="' + (late.length ? 'bad' : '') + '"><small>Late</small><b>' + late.length + '</b></div><div class="' + (held.length ? 'bad' : '') + '"><small>With holds</small><b>' + held.length + '</b></div><div><small>Mine</small><b>' + my.length + '</b></div></div>'

      + (held.length ? held.map(function (u) { return '<button class="unit" data-unit="' + esc(u.serial) + '"><div><span class="mono">' + esc(u.serial) + '</span><small>' + esc(u.sku) + ' · ' + esc(u.orderNo || 'stock') + ' · at ' + esc(label(u.at)) + '</small><small>' + esc(u.hold) + (u.ncr ? ' · ' + esc(u.ncr) : '') + '</small></div><span class="pill bad">hold</span></button>'; }).join('') : '<p class="note">Nothing on hold.</p>')
      + '<h2>Find a unit</h2><div class="row"><input id="find" placeholder="Serial" autocapitalize="off" autocorrect="off"><button id="find-go">Look up</button></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-unit]'), function (b) { b.onclick = function () { WO = null; openUnit(b.dataset.unit); }; });
    $('find-go').onclick = function () { var v = $('find').value.trim(); if (v) { WO = null; openUnit(v); } };
    $('find').onkeydown = function (e) { if (e.key === 'Enter') $('find-go').click(); };
  }

  /* ── shell ────────────────────────────────────────────────────────────── */
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.onclick = function () { TAB = b.dataset.tab; WO = null; UNIT = null; draw(); window.scrollTo(0, 0); }; });
  document.getElementById('home').onclick = function (e) { e.preventDefault(); TAB = 'today'; WO = null; UNIT = null; draw(); window.scrollTo(0, 0); };
  $('refresh').onclick = function () { WO = null; UNIT = null; loadAll(); };
  /* ── the front door: Omega Logic's one sign-in, then the company ──────
     omega-logic-signin.js draws Google, email + password and a sign-in link;
     on an iPhone home-screen app it goes straight to the redirect (the
     pop-up never returns there) and hides the emailed link, which would
     open in Safari instead (PLANT-04). /api/logic-workspaces says which
     company this person may open; nothing here is access. */
  var LS_ORG = 'omega_plant_app_org', LS_EMAIL = 'omega_plant_app_link_email';
  function setOrg(o) { ORG = o || ''; q = '?org=' + encodeURIComponent(ORG); store(LS_ORG, ORG || null); }
  function signOut() { setOrg(''); DATA = null; WO = null; UNIT = null; auth.signOut().then(function () { location.replace(location.pathname); }, function () { location.replace(location.pathname); }); }
  $('signout').onclick = signOut;
  function legacySignIn() {
    $('signin').onclick = function () {
      var p = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(p)['catch'](function () { return auth.signInWithRedirect(p); })['catch'](fail);
    };
  }
  function showSignIn() {
    if (window.OmegaLogicSignIn) OmegaLogicSignIn.signIn($('gate'), { auth: auth, lede: 'Work orders, the bench scanner, stock and quality, for the people building the units.', linkUrl: location.origin + '/plant/app', linkKey: LS_EMAIL });
    else legacySignIn();
  }
  /* which company: one straight in, several to pick from, none said plainly */
  function front() {
    $('gate').hidden = false; $('nav').hidden = true;
    if (!window.OmegaLogicSignIn) { $('gate').innerHTML = '<p class="note" style="text-align:center">Open the app once from your office link so it knows your workspace.</p>'; return; }
    $('gate').innerHTML = '<p class="note" style="text-align:center;margin-top:40px">Finding your company…</p>';
    OmegaLogicSignIn.resolve(auth).then(function (d) {
      if (!d.owner && d.workspaces.length === 1) return enter(d.workspaces[0].orgId);
      OmegaLogicSignIn.choose($('gate'), d, enter, signOut, auth);
    })['catch'](function (e) { $('gate').innerHTML = '<p class="note" style="text-align:center;margin-top:40px;color:#B42318">' + esc(e.message) + '</p>'; });
  }
  function enter(org) { setOrg(String(org || '').trim().toLowerCase()); $('gate').hidden = true; $('nav').hidden = false; TAB = 'today'; WO = null; UNIT = null; loadAll(); }
  if (!window.OmegaLogicSignIn) legacySignIn();
  /* the emailed sign-in link comes back here */
  try {
    if (typeof auth.isSignInWithEmailLink === 'function' && auth.isSignInWithEmailLink(location.href)) {
      var saved = load(LS_EMAIL, '') || window.prompt('Confirm the email address you used') || '';
      auth.signInWithEmailLink(saved, location.href).then(function () { store(LS_EMAIL, null); history.replaceState(null, '', location.pathname); })['catch'](fail);
    }
  } catch (e) {}
  function paintNet() { $('offline').hidden = navigator.onLine !== false; }
  window.addEventListener('online', paintNet); window.addEventListener('offline', paintNet); paintNet();
  auth.onAuthStateChanged(function (u) {
    $('gate').hidden = !!u; $('nav').hidden = !u; $('signout').hidden = !u; $('view').innerHTML = '';
    if (!u) { $('who').textContent = ''; showSignIn(); return; }
    if (!ORG) return front();
    loadAll();
  });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('/plant/app-sw.js', { scope: '/plant/app' })['catch'](function () {}); } catch (e) {} }
})();
</script>
</body>
</html>
