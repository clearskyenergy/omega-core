# Isolated review runner. Never deploys Firebase or writes main.
name: Site CRM rules preservation review
on:
  push:
    branches: [automation/sitecrm-rules-verify-20261011]
    paths: [.github/workflows/sitecrm-rules-verify.yml]
permissions:
  contents: read
concurrency:
  group: sitecrm-rules-preservation-review
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      REVIEW_DIR: ${{ runner.temp }}/sitecrm-review
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51d7423492472a5dc610e66397044b5896fc31d5
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review
          persist-credentials: false
          sparse-checkout: /scripts/review/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preserve the base and apply only the reviewed patch
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          test "$(git hash-object firestore.rules)" = 'e8baddbdeace0400955a8225df8c7f7df488b301'
          cp firestore.rules "$REVIEW_DIR/baseline-firestore.rules"
          cp "$GITHUB_WORKSPACE/review/scripts/review/sitecrm-rules.patch" "$REVIEW_DIR/sitecrm.patch"
          cp "$GITHUB_WORKSPACE/review/scripts/review/test-sitecrm-rules.cjs" "$REVIEW_DIR/test-rules.cjs"
          node --check "$REVIEW_DIR/test-rules.cjs"
          git apply --check "$REVIEW_DIR/sitecrm.patch"
          git apply "$REVIEW_DIR/sitecrm.patch"
          test "$(git hash-object firestore.rules)" = 'a6efb085f9c6e80b01ca5855b97222255603e8f0'
          cp firestore.rules "$REVIEW_DIR/candidate-firestore.rules"
          git diff --check
          test "$(git diff --name-only)" = 'firestore.rules'
          python3 - <<'PY'
          import os, pathlib, hashlib, json, re, collections
          root = pathlib.Path(os.environ['REVIEW_DIR'])
          before = (root / 'baseline-firestore.rules').read_bytes()
          after = (root / 'candidate-firestore.rules').read_bytes()
          assert hashlib.sha256(before).hexdigest() == 'b02906483ff4d5a1a136248af2f82726b4f374146d136b5e670ddafd5941c5aa'
          assert hashlib.sha256(after).hexdigest() == '4db3827f9f0fcc9c0e9032aa815fc201b4ff85f91e729c39553d1f6f8ae86b27'
          def clauses(raw):
              text = re.sub(r'/\*[\s\S]*?\*/|//[^\n]*', '', raw.decode())
              return collections.Counter(re.sub(r'\s+', ' ', m.group()).strip() for m in re.finditer(r'\ballow\s+[\s\S]*?;', text))
          a, b = clauses(before), clauses(after)
          assert not a-b and b-a == collections.Counter({'allow read, write: if false;': 5})
          (root / 'preservation.json').write_text(json.dumps({'base_commit': '51d7423492472a5dc610e66397044b5896fc31d5', 'existing_allow_clauses_preserved': sum(a.values()), 'new_false_clauses': 5, 'baseline_sha256': hashlib.sha256(before).hexdigest(), 'candidate_sha256': hashlib.sha256(after).hexdigest(), 'production_deployment': False}, indent=2))
          (root / 'firebase.emulator.json').write_text(json.dumps({'firestore': {'rules': 'candidate-firestore.rules'}, 'emulators': {'firestore': {'host': '127.0.0.1', 'port': 8187}, 'ui': {'enabled': False}, 'singleProjectMode': True}}))
          print('PASS: all existing clauses preserved; exact uploaded candidate hash verified.')
          PY
          node scripts/check-rules.js firestore.rules | tee "$REVIEW_DIR/structural-check.log"
      - name: Existing offline Site CRM API and pro forma tests
        run: |
          set -euo pipefail
          node scripts/test-site-crm.js 2>&1 | tee "$REVIEW_DIR/site-crm-tests.log"
      - name: Install isolated emulator-only test tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sitecrm-test-tools"
          npm install --prefix "$RUNNER_TEMP/sitecrm-test-tools" --ignore-scripts --no-audit --no-fund --save-exact firebase-tools@14.12.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
          cp "$RUNNER_TEMP/sitecrm-test-tools/package-lock.json" "$REVIEW_DIR/test-tools-package-lock.json"
      - name: Compile both rulesets and test existing access plus denied paths
        env:
          FIREBASE_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          CI: 'true'
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/sitecrm-test-tools/node_modules"
          cd "$REVIEW_DIR"
          "$NODE_PATH/.bin/firebase" emulators:exec --only firestore --project demo-omega-sitecrm --config firebase.emulator.json "node $REVIEW_DIR/test-rules.cjs" 2>&1 | tee emulator.log
      - name: Preserve review evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitecrm-rules-review-${{ github.run_id }}
          path: ${{ runner.temp }}/sitecrm-review/
          retention-days: 14
          if-no-files-found: error
  stage-reviewed-rules:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: sitecrm-rules-review-${{ github.run_id }}
          path: ${{ runner.temp }}/sitecrm-reviewed
      - name: Stage verified rules on a separate branch, never main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '51d7423492472a5dc610e66397044b5896fc31d5'
          test "$(git hash-object firestore.rules)" = 'e8baddbdeace0400955a8225df8c7f7df488b301'
          export REVIEW_DIR="$RUNNER_TEMP/sitecrm-reviewed"
          python3 - <<'PY'
          import os, pathlib, hashlib, json
          root = pathlib.Path(os.environ['REVIEW_DIR'])
          report = json.loads((root / 'emulator-results.json').read_text())
          assert report['status'] == 'passed' and report['production_access'] is False
          candidate = (root / 'candidate-firestore.rules').read_bytes()
          assert hashlib.sha256(candidate).hexdigest() == '4db3827f9f0fcc9c0e9032aa815fc201b4ff85f91e729c39553d1f6f8ae86b27'
          pathlib.Path('firestore.rules').write_bytes(candidate)
          PY
          git diff --check
          test "$(git diff --name-only)" = 'firestore.rules'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c review/sitecrm-rules-20261011
          git add -- firestore.rules
          git commit -m 'Site CRM: explicit server-only rules; preserve all existing policies'
          git push origin HEAD:refs/heads/review/sitecrm-rules-20261011
          echo "Reviewed rules commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No Firebase deployment. No customer data import. Main is unchanged.' >> "$GITHUB_STEP_SUMMARY"
