<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omega Logic · Subscribers</title><link rel="stylesheet" href="/omega-logic-theme.css"><style>

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin:14px 0}.card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:white;min-width:0}.card.wide{grid-column:1/-1}.card h3{margin:0 0 4px}.card .who{font-size:12px;color:var(--ink3);margin:0 0 10px}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="/config.js"></script><script src="/omega-brand.js"></script><script src="/omega-tenant.js"></script><script src="/omega-logic-theme.js"></script><script>
(function(){'use strict';var params=new URLSearchParams(location.search),org=(params.get('org')||'').toLowerCase(),cfg=window.CLEARSKY_CONFIG||{};if(!firebase.apps.length)firebase.initializeApp(cfg.firebase||cfg);var auth=firebase.auth();
function $(id){return document.getElementById(id);}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function say(t,cls){$('status').textContent=t||'';$('status').className='msg '+(cls||'');}
function tok(){return auth.currentUser.getIdToken();}
function api(path,body){return tok().then(function(t){return fetch(path,body?{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)}:{headers:{Authorization:'Bearer '+t}});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Request failed ('+r.status+')');return d;});});}
function download(path,name){return tok().then(function(t){return fetch(path,{headers:{Authorization:'Bearer '+t}});}).then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.error||'Download failed');});return r.blob();}).then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);});}
function v(id){var e=$(id);if(!e)return undefined;if(e.type==='checkbox')return e.checked;return e.value;}
function num(id){var x=v(id);return x===''||x==null?null:Number(x);}
function lines(id){return String(v(id)||'').split(/[\n,]/).map(function(s){return s.trim();}).filter(Boolean);}
function pill(s){var t=String(s||'pending');return '<span class="pill '+(t==='active'?'go':(t==='suspended'||t==='cancelled'||t==='past_due')?'stop':'')+'">'+esc(t.replace(/_/g,' '))+'</span>';}
function inp(id,label,val,type,extra){return '<div'+(extra&&extra.span?' class="span"':'')+'><label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"'+(extra&&extra.ph?' placeholder="'+esc(extra.ph)+'"':'')+'></div>';}
function chk(id,label,val){return '<div><label class="chk"><input id="'+id+'" type="checkbox"'+(val?' checked':'')+'> '+esc(label)+'</label></div>';}
function sel(id,label,val,opts){return '<div><label for="'+id+'">'+esc(label)+'</label><select id="'+id+'">'+opts.map(function(o){var k=typeof o==='string'?o:o[0],l=typeof o==='string'?o:o[1];return '<option value="'+esc(k)+'"'+(String(val==null?'':val)===k?' selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select></div>';}
function ta(id,label,val,ph){return '<div class="span"><label for="'+id+'">'+esc(label)+'</label><textarea id="'+id+'" placeholder="'+esc(ph||'')+'">'+esc(val==null?'':val)+'</textarea></div>';}
function when(s){return s?String(s).slice(0,10):'—';}
function busy(btn,fn){btn.disabled=true;say('Working…');return fn().then(function(){btn.disabled=false;},function(e){btn.disabled=false;say(e.message,'err');});}

/* ── every subscriber ─────────────────────────────────────────────────── */

  +'<div class="scroll"><table class="t"><thead><tr><th>Account</th><th>Status</th><th>Tier</th><th>Logic</th><th>White label</th><th>Hosts</th><th>Trial / due</th><th></th></tr></thead><tbody>'+d.subscribers.map(function(s){return '<tr><td><b>'+esc(s.name)+'</b><br><span class="muted">'+esc(s.orgId)+'</span></td><td>'+pill(s.status)+(s.hidden?' <span class="muted">hidden</span>':'')+'</td><td>'+esc(s.tier||'—')+(s.toolAccess?'<br><span class="muted">'+s.toolAccess.length+' tools</span>':'')+'</td><td>'+(s.subscribed?'<span class="pill go">subscribed</span>':'<span class="pill">not subscribed</span>')+'</td><td>'+(s.whiteLabel?esc(s.platformName||'on'):'—')+'</td><td class="muted">'+esc(s.domains.join(', ')||'—')+'</td><td class="muted">'+when(s.trialEndsAt)+' / '+when(s.subscriptionDue)+'</td><td><a href="?org='+encodeURIComponent(s.orgId)+'">Manage →</a></td></tr>';}).join('')+'</tbody></table></div>'
  +'<div class="cards"><div class="card wide" id="commission"><h3>Commission a Logic subscriber</h3><p class="who">Creates the tenant record, the subscription (omega-logic + whitelabel add-ons), the office terms, the public sign-in mirror for every host, and the owner\'s account with a one-time set-password link. Products, the storefront key and QuickBooks come after, from the pages this hands you.</p>'
  +'<div class="f">'+inp('c-org','Company email domain (the tenant key)','', 'text',{ph:'cleancell.us'})+inp('c-name','Company name','')+inp('c-slug','Workspace slug (host = slug.clearskyomega.com)','','text',{ph:'derived from the domain'})+inp('c-domains','Extra hostnames (comma separated)','','text',{ph:'app.cleancell.us'})
  +inp('c-owner','Owner email','','email')+inp('c-owner-name','Owner name','')+sel('c-tier','Tier','standard',d.tiers)+sel('c-vertical','Vertical','oem',d.verticals)
  +inp('c-platform','Platform name (white label)','','text',{ph:'defaults to the company name'})+sel('c-attr','Attribution','powered-by',[['powered-by','Powered by ClearSky-OMEGA'],['none','None (a contract decision)']])+inp('c-deposit','Deposit %','30','number')+inp('c-due','Balance due (days)','0','number')+inp('c-fee','ClearSky fee %','0.25','number')+inp('c-fee-fixed','ClearSky fee fixed ($)','0','number')
  +ta('c-notes','Notes (internal)','')+chk('c-mail','Email the owner their set-password link now (otherwise you hand it over yourself)',false)+'</div>'
  +'<div class="acts"><button type="button" class="p" id="c-go">Commission</button><span class="muted" id="c-note"></span></div><div id="c-result"></div></div></div>';
  $('c-go').onclick=function(){var btn=this;busy(btn,function(){return api('/api/logic-admin',{action:'commission',orgId:v('c-org'),name:v('c-name'),slug:v('c-slug'),domains:lines('c-domains'),ownerEmail:v('c-owner'),ownerName:v('c-owner-name'),tier:v('c-tier'),vertical:v('c-vertical'),platformName:v('c-platform'),attribution:v('c-attr'),terms:{depositPct:num('c-deposit'),dueDays:num('c-due')},fee:{percent:num('c-fee'),fixed:num('c-fee-fixed')},notes:v('c-notes'),sendMail:v('c-mail')}).then(function(r){say('Commissioned '+r.orgId+'.','ok');
    var o=r.owner||{};$('c-result').innerHTML='<h4>'+esc(r.orgId)+' is live</h4><p>Hosts: '+esc(r.hosts.join(', '))+'</p><p>Owner '+esc(o.email)+': account '+esc(o.account)+(o.error?' — '+esc(o.error):'')+(o.mail?' · email '+esc(o.mail):'')+'</p>'+(o.resetLink?'<p>Set-password link (valid about an hour — hand it to them yourself):</p><pre class="link">'+esc(o.resetLink)+'</pre>':'')+(o.resetLinkNote?'<p class="msg">'+esc(o.resetLinkNote)+'</p>':'')+(o.resetLinkError?'<p class="msg err">'+esc(o.resetLinkError)+'</p>':'')+'<p><b>Next</b></p><ul>'+r.next.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul><div class="acts"><a class="btn" href="'+esc(r.links.admin)+'">Manage '+esc(r.orgId)+' →</a><a class="btn" href="'+esc(r.links.setup)+'">White-label setup</a><a class="btn" href="'+esc(r.links.office)+'">Open the office</a></div>';});});};
  if(location.hash==='#commission')$('commission').scrollIntoView();}

/* ── one subscriber ───────────────────────────────────────────────────── */

function drawOne(d){D=d;var o=d.org||{},bl=d.billing||{},cf=d.config||{},sf=d.storefront||{},wl=o.whiteLabel||{},c=d.counts,s=d.summary,L=d.links;

  +'<div class="kv"><span>Orders<b>'+esc(c.orders)+'</b></span><span>Customers<b>'+esc(c.customers)+'</b></span><span>Reps<b>'+esc(c.reps)+'</b></span><span>Work orders<b>'+esc(c.workOrders)+'</b></span><span>Units<b>'+esc(c.units)+'</b></span><span>Stations<b>'+esc(c.stations)+'</b></span><span>Products<b>'+sf.products.length+'</b></span><span>Members<b>'+d.members.length+'</b></span></div>'
  +'<div class="acts"><a class="btn" href="'+esc(L.office)+'">Office →</a><a class="btn" href="'+esc(L.settings)+'">Office settings</a><a class="btn" href="'+esc(L.catalog)+'">Catalog</a><a class="btn" href="'+esc(L.customers)+'">Customers</a><a class="btn" href="'+esc(L.setup)+'">White-label setup</a><a class="btn" href="'+esc(L.portal)+'">Customer portal</a></div><div class="cards">';

  h+='<div class="card"><h3>Status</h3><p class="who">tenant-approve · gates sign-in and every office endpoint</p><p>Now: '+pill(o.status)+(o.approvedAt?' <span class="muted">approved '+esc(when(o.approvedAt))+' by '+esc(o.approvedBy||'')+'</span>':'')+'</p><div class="f">'+inp('st-note','Note to the owner (optional)','')+'</div><div class="acts">'+['approve','suspend','reactivate','reject'].map(function(a){return '<button type="button" data-status="'+a+'"'+(a==='reject'?' title="Cancels the tenant and releases its hostnames"':'')+'>'+a+'</button>';}).join('')+'</div></div>';
  /* tenant record */
  h+='<div class="card wide"><h3>Tenant record</h3><p class="who">omega_orgs/'+esc(d.orgId)+' · mirrored to tenant_public for every host (allowlisted keys only)</p><div class="f">'+inp('o-name','Company name',o.name)+inp('o-slug','Slug',o.slug)+sel('o-vertical','Vertical',o.vertical||'oem',d.verticals)+inp('o-shell','Shell',o.shell||'default')+inp('o-logo','Logo URL',o.logoUrl)+inp('o-c-primary','Primary colour',(o.colors||{}).primary||'','text',{ph:'#3fafc6'})+inp('o-c-accent','Accent colour',(o.colors||{}).accent||'','text',{ph:'#ee5a4f'})+inp('o-c-ink','Ink colour',(o.colors||{}).ink||'','text',{ph:'#0b2733'})
  +inp('o-eb-name','Export brand name',(o.exportBrand||{}).name)+inp('o-eb-logo','Export brand logo',(o.exportBrand||{}).logo)+ta('o-domains','Hostnames (one per line) — removing one releases its sign-in page',(o.domains||[]).join('\n'))+chk('o-logic','Omega Logic account (shows in the directory)',o.omegaLogic===true)+chk('o-fullbom','Receives the full BOM on RFQs',o.receivesFullBom===true)+chk('o-hidden','Hidden from the Logic directory',o.logicDirectoryHidden===true)+ta('o-notes','Internal notes',o.notes)+'</div><div class="acts"><button type="button" class="p" id="o-save">Save tenant record</button></div></div>';
  /* subscription */
  h+='<div class="card wide"><h3>Subscription</h3><p class="who">tenant-billing · billing/current, every change kept in billing/current/history</p><div class="f">'+sel('b-tier','Tier',bl.tier||'standard',d.tiers)+sel('b-status','Billing status',bl.status||'active',['active','past_due','suspended','cancelled'])+inp('b-addons','Add-ons (comma)',(bl.addons||[]).join(', '),'text',{ph:'omega-logic, whitelabel'})+inp('b-tools','Tool allowlist (comma; blank = whatever the plan includes)',Array.isArray(bl.toolAccess)?bl.toolAccess.join(', '):'','text',{ph:'editor, gridatlas'})
  +inp('b-trial','Trial ends',bl.trialEndsAt?String(bl.trialEndsAt).slice(0,10):'','date')+inp('b-due','Subscription due',bl.subscriptionDue?String(bl.subscriptionDue).slice(0,10):'','date')+inp('b-amount','Amount due ($)',bl.amountDue==null?'':bl.amountDue,'number')+sel('b-provider','Payment provider',bl.paymentProvider||'manual',['manual','stripe','invoice'])+inp('b-link','Payment link (https)',bl.paymentLink||'')+chk('b-autopay','Autopay',bl.autopay===true)+ta('b-overrides','Tool overrides (JSON: {"editor": false})',JSON.stringify(bl.toolOverrides||{}))+'</div><div class="acts"><button type="button" class="p" id="b-save">Save subscription</button><span class="muted">'+(bl.updatedAt?'last change '+esc(when(bl.updatedAt))+' by '+esc(bl.updatedBy||''):'')+'</span></div></div>';
  /* what this subscriber's CUSTOMERS pay for Editor Lite (api/customer-subscribe.js charges exactly these) */
  var cel=bl.customerEditorLite||{},celOn=(bl.editorLite||{}).enabled===true;
  h+='<div class="card"><h3>Customer Editor Lite</h3><p class="who">tenant-billing · billing/current.customerEditorLite · the design tool this subscriber\'s customers subscribe to, on ClearSky\'s Stripe. Blank withdraws that plan; existing subscriptions keep their price.</p><div class="f">'+inp('lp-month','Monthly price ($)',cel.monthlyPriceCents?cel.monthlyPriceCents/100:'','number')+inp('lp-year','Yearly price ($)',cel.yearlyPriceCents?cel.yearlyPriceCents/100:'','number')+'</div><div class="acts"><button type="button" class="p" id="lp-save">Save customer prices</button><span class="muted">'+(celOn?'Editor Lite is on for this subscriber':'Editor Lite is off for this subscriber: customers see no checkout until it is on')+'</span></div></div>';

  h+='<div class="card wide"><h3>White label</h3><p class="who">tenant-branding (staff) · what the platform is called here; attribution is a contract term</p><div class="f">'+chk('w-enabled','White label on',wl.enabled===true)+inp('w-platform','Platform name',wl.platformName)+inp('w-short','Short name',wl.shortName)+sel('w-attr','Attribution',wl.attribution||'powered-by',[['powered-by','Powered by ClearSky-OMEGA'],['none','None']])+inp('w-attr-text','Attribution text',wl.attributionText)+inp('w-mark','Mark URL',wl.markUrl)+inp('w-support','Support email',wl.supportEmail,'email')+inp('w-accent','Accent',wl.accent,'text',{ph:'#rrggbb'})+inp('w-ink','Ink',wl.ink,'text',{ph:'#rrggbb'})+ta('w-embed','Embed block (JSON: headline, origins…)',JSON.stringify(wl.embed||{},null,1))+'</div><div class="acts"><button type="button" class="p" id="w-save">Save white label</button></div></div>';

  +(sf.products.length?'<div class="scroll"><table class="t"><thead><tr><th>SKU</th><th>Name</th><th>Kind</th><th>kW</th><th>kWh</th><th>Price</th></tr></thead><tbody>'+sf.products.map(function(p){return '<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+(p.archived?' <span class="muted">archived</span>':'')+'</td><td>'+esc(p.kind)+'</td><td>'+esc(p.kw==null?'':p.kw)+'</td><td>'+esc(p.kwh==null?'':p.kwh)+'</td><td>'+esc(p.priceMode||'quote')+(p.listPrice?' $'+Number(p.listPrice).toLocaleString('en-US'):'')+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="muted">No products yet.</p>')+'</div>';
  /* people */
