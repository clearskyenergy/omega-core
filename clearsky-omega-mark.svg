<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OMEGA">
  <!-- © 2025–2026 ClearSky Energy Solutions LLC. Proprietary and Confidential.
       Neon omega for DARK grounds (navy topbars). Three passes over one open
       path: a blurred coloured halo, the gradient stroke, then a white-hot
       core. One path, not three shapes, so the bloom runs continuously instead
       of pooling at the joins. The stroke is kept thin on purpose — the mark
       is carried by the glow, and a heavy stroke turns it into a horseshoe. -->
  <defs>
    <linearGradient id="csoG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3AAE63"/>
      <stop offset=".34" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="csoB" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 80H26C33 79 34.8 71 33.4 63.3A27 27 0 1 1 66.6 63.3C65.2 71 67 79 74 80H90" stroke="url(#csoG)" stroke-width="14" filter="url(#csoB)" opacity=".8"/>
    <path d="M10 80H26C33 79 34.8 71 33.4 63.3A27 27 0 1 1 66.6 63.3C65.2 71 67 79 74 80H90" stroke="url(#csoG)" stroke-width="8"/>
    <path d="M10 80H26C33 79 34.8 71 33.4 63.3A27 27 0 1 1 66.6 63.3C65.2 71 67 79 74 80H90" stroke="#fff" stroke-width="3.2" opacity=".97"/>
  </g>
</svg>
