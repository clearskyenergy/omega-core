<!doctype html><meta charset="utf-8"><title>OMEGA editable-export DOM harness</title>
<style>body{font:13px/1.5 ui-monospace,Menlo,monospace;background:#0b1420;color:#dce9f7;padding:18px}
b{color:#7fd3ff}.ok{color:#5bd98a}.bad{color:#ff8080}pre{white-space:pre-wrap}</style>
<h3>compile() against the features the sheets emit</h3><pre id="out">running…</pre>
<script src="/omega-plot-editable.js"></script>
<script>
/* Exercises the DOM half of the converter — getCTM, getComputedStyle, <use>
   expansion, marker placement, clip intersection — none of which the node
   tests can reach. Each case is a sheet fragment in the shape the editor's
   own generators produce. */
var PNG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAACZgbYnAAAAF0lEQVR4AWP4//8/AzbMMKp4VPGo4mEAAOnCD/1ZxkjcAAAAAElFTkSuQmCC';
function sheet(inner,defs){
  return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300">'
    +(defs?'<defs>'+defs+'</defs>':'')+inner+'</svg>';
}
var cases=[
 ['rounded rect (220 in the sheets)',
  sheet('<rect x="10" y="10" width="120" height="60" rx="8" ry="8" fill="none" stroke="#000"/>'),
  function(o){return o.length===1&&o[0].type==='shape'&&o[0].points.filter(function(p){return p.curve;}).length>=4;}],

 ['rect with only rx set',
  sheet('<rect x="0" y="0" width="80" height="40" rx="6" fill="#123456"/>'),
  function(o){return o.length===1&&o[0].fill==='123456';}],

 ['elliptical arc in a path',
  sheet('<path d="M 20 100 A 40 40 0 0 1 100 100" fill="none" stroke="#f00"/>'),
  function(o){return o.length===1&&o[0].points.length>1&&o[0].points.every(function(p){return p.close||isFinite(p.x);});}],

 ['<use> of a <symbol> with viewBox (one-line symbols)',
  sheet('<use href="#sym-x" x="100" y="50" width="60" height="40"/>',
        '<symbol id="sym-x" viewBox="0 0 60 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#000"/><circle cx="40" cy="20" r="15" fill="none" stroke="#000"/></symbol>'),
  function(o){return o.length===2&&o.every(function(r){return r.type==='shape';});}],

 ['<use> lands where the symbol was placed',
  sheet('<use href="#sym-y" x="200" y="100" width="40" height="40"/>',
        '<symbol id="sym-y" viewBox="0 0 40 40"><rect x="0" y="0" width="40" height="40" fill="#000"/></symbol>'),
  function(o){var xs=o[0].points.map(function(p){return p.x;}).filter(isFinite);
              return Math.min.apply(null,xs)>199 && Math.max.apply(null,xs)<241;}],

 ['marker-end arrowhead becomes real geometry',
  sheet('<line x1="10" y1="200" x2="120" y2="200" stroke="#000" marker-end="url(#ar)"/>',
        '<marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#000"/></marker>'),
  function(o){return o.length===2;}],

 ['the arrowhead sits at the line end, not the origin',
  sheet('<line x1="10" y1="200" x2="120" y2="200" stroke="#000" stroke-width="2" marker-end="url(#ar2)"/>',
        '<marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#000"/></marker>'),
  function(o){var head=o[1],xs=head.points.map(function(p){return p.x;}).filter(isFinite);
              return Math.max.apply(null,xs)>110 && Math.max.apply(null,xs)<126;}],

 ['marker-start and marker-end both emit',
  sheet('<polyline points="10,250 60,250 110,250" fill="none" stroke="#000" marker-start="url(#ar3)" marker-end="url(#ar3)"/>',
        '<marker id="ar3" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><circle cx="3" cy="3" r="2" fill="#000"/></marker>'),
  function(o){return o.length===3;}],

 ['rect clip keeps what is inside',
  sheet('<g clip-path="url(#cp)"><rect x="20" y="20" width="50" height="50" fill="#0a0"/></g>',
        '<clipPath id="cp"><rect x="0" y="0" width="200" height="200"/></clipPath>'),
  function(o){return o.length===1;}],

 ['rect clip drops what it already hid',
  sheet('<g clip-path="url(#cp2)"><rect x="300" y="220" width="50" height="50" fill="#0a0"/></g>',
        '<clipPath id="cp2"><rect x="0" y="0" width="100" height="100"/></clipPath>'),
  function(o){return o.length===0;}],

 ['clipped map image becomes a cropped, whole picture',
  sheet('<g clip-path="url(#cp3)"><image href="'+PNG+'" x="0" y="0" width="400" height="300" preserveAspectRatio="none"/></g>',
        '<clipPath id="cp3"><rect x="50" y="40" width="200" height="150"/></clipPath>'),
  function(o){return o.length===1&&o[0].type==='image'&&o[0].clipTo&&Math.round(o[0].clipTo.x)===50;}],

 ['image keeps its aspect intent',
  sheet('<image href="'+PNG+'" x="0" y="0" width="200" height="100" preserveAspectRatio="xMidYMid meet"/>'),
  function(o){return o.length===1&&o[0].fit&&o[0].fit.mode==='meet';}],

 ['plain text still converts',
  sheet('<text x="20" y="280" font-size="12" fill="#000">BESS-01</text>'),
  function(o){return o.length===1&&o[0].type==='text'&&o[0].text==='BESS-01';}],

 ['a whole fragment: symbols, arrows, curves, clipped map',
  sheet('<g clip-path="url(#cp4)"><image href="'+PNG+'" x="0" y="0" width="400" height="300" preserveAspectRatio="none"/></g>'
      + '<rect x="20" y="20" width="90" height="50" rx="6" fill="none" stroke="#000"/>'
      + '<use href="#sym-z" x="160" y="30" width="50" height="40"/>'
      + '<line x1="110" y1="45" x2="158" y2="45" stroke="#000" marker-end="url(#ar4)"/>'
      + '<path d="M 20 120 A 30 30 0 0 1 80 120" fill="none" stroke="#00f"/>'
      + '<text x="24" y="40" font-size="10" fill="#000">BESS-01</text>',
        '<clipPath id="cp4"><rect x="0" y="0" width="400" height="300"/></clipPath>'
      + '<symbol id="sym-z" viewBox="0 0 50 40"><rect x="2" y="2" width="46" height="36" fill="none" stroke="#000"/></symbol>'
      + '<marker id="ar4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#000"/></marker>'),
  /* map + rounded rect + the symbol's rect + line + its arrowhead + arc +
     text = 7. The arrowhead is its own object, which is the point. */
  function(o){return o.length===7&&o[0].type==='image'&&o[6].type==='text';}],
];
var refusals=[
 ['rich tspan text still refuses', sheet('<text x="10" y="20"><tspan>a</tspan></text>'), /Rich SVG text/],
 ['a non-rect clip still refuses',
  sheet('<g clip-path="url(#cc)"><rect x="0" y="0" width="10" height="10"/></g>','<clipPath id="cc"><circle cx="5" cy="5" r="5"/></clipPath>'), /rectangular clip/],
 ['an undefined marker still refuses',
  sheet('<line x1="0" y1="0" x2="10" y2="0" stroke="#000" marker-end="url(#nope)"/>'), /Marker #nope/],
 ['an undefined <use> target still refuses', sheet('<use href="#gone" x="0" y="0" width="10" height="10"/>'), /not defined/],
];
/* Case names contain literal <use> and <symbol>. They go through innerHTML,
   so escape them or the browser eats the tag and the report reads wrong. */
function esc(v){return String(v).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
var lines=[],pass=0,fail=0;
var API=window.OmegaEditablePlotPPT;
cases.forEach(function(c){
  try{
    var scene=API.compile(c[1]);
    var good=c[2](scene.objects);
    lines.push((good?'<span class="ok">  ok  </span>':'<span class="bad"> FAIL </span>')+esc(c[0])
      +'   <b>'+scene.objects.length+' object(s)</b>'
      +(good?'':'  → '+JSON.stringify(scene.objects.map(function(o){return o.type+':'+o.name;}))));
    good?pass++:fail++;
  }catch(e){ lines.push('<span class="bad"> FAIL </span>'+esc(c[0])+'   threw: '+esc(e.message)); fail++; }
});
lines.push('');
refusals.forEach(function(c){
  try{ API.compile(c[1]); lines.push('<span class="bad"> FAIL </span>'+esc(c[0])+' — did not refuse'); fail++; }
  catch(e){ var m=c[2].test(e.message);
    lines.push((m?'<span class="ok">  ok  </span>':'<span class="bad"> FAIL </span>')+esc(c[0])+'   ("'+esc(e.message)+'")');
    m?pass++:fail++; }
});
lines.push('','<b>'+pass+' passed, '+fail+' failed</b>');
document.getElementById('out').innerHTML=lines.join('\n');
window.__RESULT={pass:pass,fail:fail};
</script>
